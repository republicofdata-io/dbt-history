walkthrough:
  id: wt-0.2
  learning_objective: |
    Recognize the difference between a successful build and valid relationships.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is orphan-payment. Each state below is an authored illustration.
  dataset_variant: orphan-payment
  steps:
  - id: feed
    title: A payment without an order
    explanation: |
      The orphan-payment variant adds one bad reference.
    state:
      kind: comparison
      title: A payment without an order
      columns:
      - payment_id
      - order_id
      - amount_cents
      rows:
      - - 2099
        - 9999
        - 400
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A valid payment row can refer to an absent order.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
    code:
    - language: sql
      filename: models/payments.sql
      content: |
        select payment_id, order_id, amount_cents
        from raw.payments
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/orders.sql
      content: |
        select order_id, customer_id, location_id, ordered_at
        from raw.orders
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/orphan_payments.sql
      content: |
        select p.payment_id, p.order_id, p.amount_cents
        from {{ ref("payments") }} as p
        left join {{ ref("orders") }} as o on p.order_id = o.order_id
        where o.order_id is null
      highlight_lines:
      - 3
      - 4
      purpose: authored executable syntax; illustration only
  - id: test
    title: Check the relationship
    explanation: |
      A relationship assertion expects every payment order_id to exist in orders.
    state:
      kind: result
      title: Check the relationship
      columns:
      - assertion
      - expected_missing
      - actual_missing
      - offending_order_id
      rows:
      - - payments → orders
        - 0
        - 1
        - 9999
      result_status: fail
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The data fails even if SQL builds successfully.
    code:
    - language: sql
      filename: models/payments.sql
      content: |
        select payment_id, order_id, amount_cents
        from raw.payments
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/orders.sql
      content: |
        select order_id, customer_id, location_id, ordered_at
        from raw.orders
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: models/schema.yml
      content: |
        orders:
          constraints:
            relationships:
              - {from: order_id, to: payments, field: order_id}
        payments:
          constraints:
            not_null:
              - payment_id
              - order_id
      highlight_lines:
      - 1
      - 3
      - 4
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt test
      highlight_lines:
      - 1
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
  - id: boundary
    title: Keep the money discrepancy visible
    explanation: |
      Do not silently add the orphan to a location. Seeds enter this chapter only at 0.2.3.0.
    state:
      kind: comparison
      title: Keep the money discrepancy visible
      columns:
      - measure
      - cents
      rows:
      - - raw payments
        - 14200
      - - refunds
        - 1300
      - - unattributed payment
        - 400
      - - order-based revenue
        - 12500
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Tests expose money the business result cannot safely attribute.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
    code:
    - language: sql
      filename: models/order_amounts.sql
      content: |
        with paid as (
            select order_id, sum(amount_cents) as payment_cents
            from raw.payments group by order_id
        ), refunded as (
            select order_id, sum(amount_cents) as refund_cents
            from raw.refunds group by order_id
        )
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from raw.orders as o
        left join paid as p on o.order_id = p.order_id
        left join refunded as r on o.order_id = r.order_id
      highlight_lines:
      - 2
      - 5
      - 8
      - 9
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/unattributed_money.sql
      content: |
        select sum(p.amount_cents) as unattributed_cents
        from {{ ref("payments") }} as p
        left join {{ ref("orders") }} as o on p.order_id = o.order_id
        where o.order_id is null
      highlight_lines:
      - 1
      - 4
      purpose: authored executable syntax; illustration only
