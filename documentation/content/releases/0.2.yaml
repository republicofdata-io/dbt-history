    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      0.2.0 schema_tester.py checks child-table IDs against the model declaring the relationship. The rule therefore belongs under orders with to: payments, the reverse of later child-oriented syntax. dbt test is a separate command here; dependency-blocking dbt build arrives in 0.21.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Check missing values, duplicate keys and relationships with the new test command.
    - Initialize a project with the supplied starter configuration.
    - From 0.2.3.0, load a small CSV lookup table with the seed command.
    scenario: |
      A 400-cent payment arrives for order 9999, which does not exist. The revenue query can still run, so the shop needs a separate check for money that cannot be attributed to a location.
    outcome: |
      See the historical relationship definition identify one violation while valid order-based revenue remains 12,500 cents.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
