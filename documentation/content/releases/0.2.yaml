walkthrough:
  id: wt-0.2
  learning_objective: |
    Tell a build that succeeds apart from data that is right, using the first dbt test command.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is orphan-payment. Each state below is an authored illustration.
  dataset_variant: orphan-payment
  steps:
    - id: feed
      title: A payment arrives for an order that does not exist
      explanation: >-
        Highlighted lines 3 and 4 of the warehouse query join payments to orders and retain a payment when
        its order is missing. The supporting models copy the two feeds into schema waffle. The panel shows
        payment 2099: 400 cents against missing order 9999. This query is read directly in the warehouse,
        not compiled from an analyses folder at 0.2.0.
      state:
        kind: comparison
        title: One payment with no matching order
        columns:
          - payment_id
          - order_id
          - amount_cents
        rows:
          -   - 2099
              - 9999
              - 400
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        A payment row can point at an order that does not exist, and nothing in the build stops it.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-0-2-3-0
      code:
        - language: sql
          filename: inspection/orphan_payments.sql (warehouse query)
          content: |
            select p.payment_id, p.order_id, p.amount_cents
            from waffle.payments as p
            left join waffle.orders as o on p.order_id = o.order_id
            where o.order_id is null
          highlight_lines:
            - 3
            - 4
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/payments.sql
          content: |
            select payment_id, order_id, amount_cents
            from raw.payments
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/orders.sql
          content: |
            select order_id, customer_id, location_id, ordered_at
            from raw.orders
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
    - id: test
      title: Declare the link and run dbt test
      explanation: >-
        Highlighted lines 1, 3 and 4 of schema.yml declare orders as the parent and payments as the child.
        In 0.2.0 this direction means every payment order_id must occur in orders. dbt test turns the rule
        into a child-not-in-parent query. The panel shows one missing parent, order 9999, so the test fails.
      state:
        kind: result
        title: The relationship test fails on order 9999
        columns:
          - assertion
          - expected_missing
          - actual_missing
          - offending_order_id
        rows:
          -   - payments → orders
              - 0
              - 1
              - 9999
        result_status: fail
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The build succeeded but the test failed, because the data broke a rule the SQL never checked.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            orders:
              constraints:
                relationships:
                  - {from: order_id, to: payments, field: order_id}
            payments:
              constraints:
                not_null:
                  - payment_id
                  - order_id
          highlight_lines:
            - 1
            - 3
            - 4
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/payments.sql
          content: |
            select payment_id, order_id, amount_cents
            from raw.payments
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/orders.sql
          content: |
            select order_id, customer_id, location_id, ordered_at
            from raw.orders
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt test
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-0-2-3-0
    - id: seed
      title: From patch 0.2.3.0, load the location list from a CSV file
      explanation: >
        Three shops need names, not just ids. The CSV file, highlighted on lines 1 to 4, lists them: a header
        row and one row per location. The command file runs dbt seed, which arrived in patch 0.2.3.0 and loads
        every CSV in the project's data folder into the warehouse as a table. The result panel shows the table
        it creates: three rows, one per location, ready for a model to join to.
      code:
        - language: text
          filename: data/locations.csv
          content: |
            location_id,name
            1,Old Port
            2,Mile End
            3,Riverside
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
          purpose: authored fixture file; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt seed
          highlight_lines:
            - 1
          purpose: authored command; illustration only
      state:
        kind: table
        title: The locations table created by dbt seed
        columns:
          - location_id
          - name
        rows:
          -   - 1
              - Old Port
          -   - 2
              - Mile End
          -   - 3
              - Riverside
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >
        A small lookup table can live in the project as a CSV file and be loaded with one command, instead
        of
        being created by hand in the warehouse.
      evidence:
        - src-3
        - src-1
        - src-2
        - src-4
        - src-5
        - alignment-0-2-3-0
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
      - alignment-0-2-3-0
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      0.2.0 schema_tester.py checks child-table IDs against the model declaring the relationship. The rule therefore belongs under orders with to: payments, the reverse of later child-oriented syntax. dbt test is a separate command here; dependency-blocking dbt build arrives in 0.21.
      Resolved against src-4: dbt/schema_tester.py lines 124-134 assigns parent_table to the declaring model and child_table to reference["to"]; lines 24-33 count child IDs absent from parent. Keep the declaration under orders. Reversing it would miss this orphan. The review’s direction objection uses later semantics.
      Seed folder data/ is confirmed at 0.2.3.0. Its independent seeder writes the CSV into the target schema, while ref() searches only project SQL models. No ref-based seed join is added here; that capability is demonstrated at 0.10. Accepted-values tests and project initialization are outside this walkthrough (src-1, src-3).
      review-0.2-01: The reviewer’s modern direction is incorrect for 0.2.0. Retain parent orders -> child payments. schema_tester.py lines 130-133 assign these roles; lines 24-33 count orphan children. Schema file now opens first. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-0-2-3-0.
      review-0.2-02: Confirmed data/ in 0.2.3.0 project.py. Seeds are loaded independently; compilation.py ref lookup only sees SQL models. Keep the seed result without a ref join; explain the 0.10 change. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-0-2-3-0.
      historical-0.2-01: The reviewer’s modern direction is incorrect for 0.2.0. Retain parent orders -> child payments. schema_tester.py lines 130-133 assign these roles; lines 24-33 count orphan children. Schema file now opens first. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-0-2-3-0.
      historical-0.2-03: Accepted-values tests remain patch release context, not an intro or step promise. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-0-2-3-0.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Run one command, dbt test, to check for missing values, duplicate keys and broken links between
        tables.
      - From patch 0.2.3.0, load a small CSV file, such as a list of locations, as a table with the seed
        command.
    scenario: >
      A 400-cent payment arrives tagged to order 9999. No such order exists. The revenue query still runs
      and
      still reports 12,500 cents, because it starts from orders and never sees the stray payment. The shop
      needs a separate check that flags money it cannot tie to a location.
    outcome: >
      Watch the test command report one broken link while revenue by location stays at 12,500 cents, then
      see
      the seed command from patch 0.2.3.0 load the list of locations from a CSV file.
  title: |
    Demo: a relationship test catches a payment with no matching order, and a CSV becomes a table
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
