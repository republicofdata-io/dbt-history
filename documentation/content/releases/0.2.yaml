walkthrough:
  id: wt-0.2
  learning_objective: |
    Recognize the difference between a successful build and valid relationships.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is orphan-payment. Each state below is an authored illustration.
  dataset_variant: orphan-payment
  steps:
  - id: feed
    title: A payment without an order
    explanation: |
      The orphan-payment variant adds one bad reference.
    state:
      kind: comparison
      title: A payment without an order
      columns:
      - payment_id
      - order_id
      - amount_cents
      rows:
      - - 2099
        - 9999
        - 400
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A valid payment row can refer to an absent order.
    evidence:
    - src-1
    - src-2
    - src-3
  - id: test
    title: Check the relationship
    explanation: |
      A relationship assertion expects every payment order_id to exist in orders.
    state:
      kind: result
      title: Check the relationship
      columns:
      - assertion
      - expected_missing
      - actual_missing
      - offending_order_id
      rows:
      - - payments → orders
        - 0
        - 1
        - 9999
      result_status: fail
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The data fails even if SQL builds successfully.
    code:
    - language: shell
      filename: commands.sh
      content: |
        dbt test
      highlight_lines: []
    evidence:
    - src-1
    - src-2
    - src-3
  - id: boundary
    title: Keep the money discrepancy visible
    explanation: |
      Do not silently add the orphan to a location. Seeds enter this chapter only at 0.2.3.0.
    state:
      kind: comparison
      title: Keep the money discrepancy visible
      columns:
      - measure
      - cents
      rows:
      - - raw payments
        - 14200
      - - refunds
        - 1300
      - - unattributed payment
        - 400
      - - order-based revenue
        - 12500
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Tests expose money the business result cannot safely attribute.
    evidence:
    - src-1
    - src-2
    - src-3
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    - src-3
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
