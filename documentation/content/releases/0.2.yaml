id: '0.2'
label: v0.2
title: Tests and a project workflow
lead: |
  The project gains a way to check the data it builds. A later patch also brings small CSV files into the workflow.
problem_then: |
  A successful SQL query could still produce untrustworthy data. There was no dbt test command in the earliest package.
what_changed:
- id: change-1
  summary: Project initialization, dependency installation and the test command are available.
  introduced_in: 0.2.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: CSV seeds and accepted-values tests are added.
  introduced_in: 0.2.3.0
  adapter_constraints: null
  evidence:
  - src-3
  confidence: high
in_practice: |
  Build the project, then inspect explicit data assertions. Treat the first seed command as a patch milestone.
technical_detail: |
  The initial package is 0.2.0. CSV seeds and accepted-values tests arrive in the real four-component version 0.2.3.0. This walkthrough uses a relationship assertion conceptually rather than backporting modern schema YAML.
