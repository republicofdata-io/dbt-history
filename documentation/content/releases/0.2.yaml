id: '0.2'
label: v0.2
featured: true
title: Tests and a project workflow
lead: >
  The project gains a way to check the data it builds. A later patch also brings small CSV files into the
  workflow.
problem_then: >
  A successful SQL query could still produce untrustworthy data. There was no dbt test command in the earliest
  package.
what_changed:
  - id: change-1
    summary: Project initialization, dependency installation and the test command are available.
    introduced_in: 0.2.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: CSV seeds and accepted-values tests are added.
    introduced_in: 0.2.3.0
    adapter_constraints:
    evidence:
      - src-3
    confidence: high
in_practice: |
  Build the project, then inspect explicit data assertions. Treat the first seed command as a patch milestone.
technical_detail: >
  The 0.2 series starts with package 0.2.0, which brings the test command. CSV seeds and accepted-values tests

  arrive later in the series, in patch 0.2.3.0 (dbt used four-part version numbers at the time). The
  walkthrough

  writes its relationship test in the schema file format of 2016, not in today's YAML.
milestones:
  - id: 0.2.0
    kind: package
    date: '2016-06-22'
    precision: day
    title: First published package
    evidence:
      - src-1
  - id: 0.2.3.0
    kind: patch
    date: '2016-07-15'
    precision: day
    title: CSV seed command and accepted-values tests
    evidence:
