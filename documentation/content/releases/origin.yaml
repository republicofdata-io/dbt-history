walkthrough:
  id: wt-origin
  learning_objective: |
    Separate the revenue calculation from the workflow needed to maintain it.
  context: |
    Twelve orders at three fictional locations produce 13,800 cents of payments and 1,300 cents of refunds.
  dataset_variant: base
  steps:
  - id: raw
    title: Five raw tables
    explanation: |
      Orders link money events to the location that earned them.
    state:
      kind: diagram
      title: Waffle Shop before dbt
      columns: []
      rows: []
      result_status: null
      diagram:
        nodes:
        - id: orders
          label: orders
        - id: payments
          label: payments
        - id: refunds
          label: refunds
        - id: query
          label: handwritten revenue query
        edges:
        - from: orders
          to: query
        - from: payments
          to: query
        - from: refunds
          to: query
        highlight: []
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A correct answer starts with a clear grain and business rule.
    evidence:
    - src-1
    - src-2
    - src-3
  - id: manual
    title: Write the rule once
    explanation: |
      Aggregate money events by order before joining, so split payments do not duplicate another relation.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The query can be correct even when its maintenance process is fragile.
    code:
    - language: sql
      filename: manual/revenue.sql
      content: |
        with payment_totals as (
            select order_id, sum(amount_cents) as payment_cents
            from raw.payments
            group by order_id
        ), refund_totals as (
            select order_id, sum(amount_cents) as refund_cents
            from raw.refunds
            group by order_id
        )
        select
            orders.location_id,
            sum(coalesce(payment_totals.payment_cents, 0)
                - coalesce(refund_totals.refund_cents, 0)) as revenue_cents
        from raw.orders as orders
        left join payment_totals on orders.order_id = payment_totals.order_id
        left join refund_totals on orders.order_id = refund_totals.order_id
        group by orders.location_id
      highlight_lines:
      - 12
      - 13
    evidence:
    - src-1
    - src-2
    - src-3
  - id: handoff
    title: Make the workflow visible
    explanation: |
      The next person needs to know the input tables, the refund rule and the order of work.
    state:
      kind: comparison
      title: Prepared workflow comparison
      columns:
      - responsibility
      - manual approach
      - project approach
      rows:
      - - SQL logic
        - copied query
        - reviewed project file
      - - dependencies
        - remembered by operator
        - declared or inferred by tooling
      - - revenue_cents
        - 12500
        - 12500
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The history that follows changes how the shop produces and trusts the answer.
    evidence:
    - src-1
    - src-2
    - src-3
  evidence:
