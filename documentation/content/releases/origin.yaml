id: origin
label: Origins
title: Before the project had a name
lead: |
  The story begins in 2016, before Olivier adopted dbt. Waffle Shop starts with a question, some raw tables and a manually maintained revenue query.
problem_then: |
  The shop can calculate revenue, but someone must remember which scripts to run and which copy contains the latest refund rule.
what_changed:
- id: first-package
  summary: The first observed dbt package is 0.0.1.
  introduced_in: 0.0.1
  adapter_constraints: Early code targets Redshift.
  evidence:
  - src-2
  confidence: high
in_practice: |
  SQL business logic begins moving into a project that can build related datasets. This is the starting point, not the full modern feature set.
technical_detail: |
  The founder retrospective marks 9 March 2016 as the first-commit origin. PyPI records 0.0.1 on 23 March. These are different events; the package date is not asserted as GA. The raw SQL below is an authored pre-dbt illustration.
