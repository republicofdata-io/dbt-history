walkthrough:
  id: wt-origin
  title: Before dbt, the answer lived in a handwritten query.
  learning_objective: |
    See why a correct SQL query is not the same thing as a trustworthy answer.
  context: >
    Jaffle Shop has three locations. Twelve orders, 13,800 cents of payments and 1,300 cents of refunds make
    12,500 cents of revenue.
  intro:
    can_now:
      - Write the revenue query by hand in SQL and run it against the warehouse.
      - Save copies of that query wherever they are needed, in a scheduler, a notebook or a dashboard.
      - Nothing yet keeps those copies in step, runs them in the right order or checks the result.
    scenario: >
      Someone asks how much each location earned. The analyst writes one SQL query, gets the right number, and
      passes the query around. A month later two copies exist and they disagree. Amounts throughout are in
      cents, the way payment systems store money, so every sum is a whole number: 12,500 cents is $125.
    outcome: >
      Follow the question from the raw tables to a correct answer, then watch a second copy of the same query
      quietly report the wrong number.
  dataset_variant: base
  steps:
    - id: question
      title: The question and the raw tables
      explanation: >-
        How much did each location earn? Highlighted lines 1 to 3 of look_around.sql read the raw orders,
        payments and refunds. Orders identify the location, payments record money received, and refunds record
        money returned. The panel summarizes these feeds: 12 orders, 13 payments worth 13,800 cents and three
        refunds worth 1,300 cents.
      code:
        - language: sql
          filename: raw/look_around.sql
          content: |
            select * from raw.orders;    -- 12 rows: order_id, customer_id, location_id, ordered_at
            select * from raw.payments;  -- 13 rows: payment_id, order_id, amount_cents
            select * from raw.refunds;   --  3 rows: refund_id, order_id, amount_cents
          highlight_lines:
            - 1
            - 2
            - 3
          purpose: authored executable syntax; illustration only
      state:
        kind: comparison
        title: What the raw tables hold
        columns:
          - table
          - rows
          - total cents
          - what it tells us
        rows:
          - - raw.orders
            - 12
            - null
            - which location each order belongs to
          - - raw.payments
            - 13
            - 13800
            - what customers paid, one order can have two payments
          - - raw.refunds
            - 3
            - 1300
            - what was given back
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Revenue is payments minus refunds, attributed to the location of the order.
      evidence:
        - src-1
        - src-2
    - id: answer
      title: The handwritten answer
      explanation: >-
        The analyst writes revenue_by_location.sql. It totals payments and refunds per order before joining
        them to orders to find each location. Highlighted lines 10 and 11 subtract refunds from payments. The
        result panel shows the three location totals, adding up to 12,500 cents.
      code:
        - language: sql
          filename: analyst/revenue_by_location.sql
          content: |
            with payment_totals as (
                select order_id, sum(amount_cents) as payment_cents
                from raw.payments group by order_id
            ), refund_totals as (
                select order_id, sum(amount_cents) as refund_cents
                from raw.refunds group by order_id
            )
            select
                orders.location_id,
                sum(coalesce(payment_totals.payment_cents, 0)
                    - coalesce(refund_totals.refund_cents, 0)) as revenue_cents
            from raw.orders as orders
            left join payment_totals on orders.order_id = payment_totals.order_id
            left join refund_totals on orders.order_id = refund_totals.order_id
            group by orders.location_id
          highlight_lines:
            - 10
            - 11
          purpose: authored executable syntax; illustration only
      state:
        kind: table
        title: Revenue by location, 12,500 cents in total
        columns:
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - Old Port
            - 4400
            - 1000
            - 3400
          - - Mile End
            - 4600
            - 300
            - 4300
          - - Riverside
            - 4800
            - 0
            - 4800
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        The numbers are right, but nothing checks them and nothing protects the refund rule from being lost
        when the query is copied.
      evidence:
        - src-1
        - src-2
    - id: problem
      title: Two copies, two answers
      explanation: >-
        The query gets copied into the dashboard tool. Highlighted lines 3 and 4 of
        analyst/revenue_by_location.sql subtract refunds. Highlighted line 3 of dashboard/revenue_copy.sql
        only sums payments. The panel compares the answers: 12,500 cents from the analyst's query and 13,800
        from the dashboard copy. The copied rule has lost the refund subtraction.
      code:
        - language: sql
          filename: analyst/revenue_by_location.sql
          content: |
            select
                orders.location_id,
                sum(coalesce(payment_totals.payment_cents, 0)
                    - coalesce(refund_totals.refund_cents, 0)) as revenue_cents
            from raw.orders as orders
            left join payment_totals on orders.order_id = payment_totals.order_id
            left join refund_totals on orders.order_id = refund_totals.order_id
            group by orders.location_id
          highlight_lines:
            - 3
            - 4
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: dashboard/revenue_copy.sql
          content: |
            select
                orders.location_id,
                sum(coalesce(payment_totals.payment_cents, 0)) as revenue_cents
            from raw.orders as orders
            left join payment_totals on orders.order_id = payment_totals.order_id
            group by orders.location_id
          highlight_lines:
            - 3
          purpose: authored illustration of a divergent copy; illustration only
      state:
        kind: comparison
        title: The same question, answered twice
        columns:
          - copy
          - Old Port
          - Mile End
          - Riverside
          - total
        rows:
          - - analyst query
            - 3400
            - 4300
            - 4800
            - 12500
          - - dashboard copy
            - 4400
            - 4600
            - 4800
            - 13800
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        This is the problem the next ten years work on: not writing the query, but keeping one version of it,
        running it in the right order, and checking its answer.
      evidence:
        - src-1
        - src-2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
    limitations: >
      Fictional pre-dbt scenario with authored SQL; no database or dbt runtime was executed. The divergent
      dashboard copy is a teaching device, not a historical incident.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
