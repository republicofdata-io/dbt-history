    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - From the first 0.0.1 package, keep transformation SQL in a project that dbt can compile.
    - Let the early tool build database models from those SQL files.
    scenario: |
      Waffle Shop has twelve orders, split payments and refunds, but its revenue query is handed around manually. The opening example separates the correct calculation from the work of maintaining it.
    outcome: |
      Follow 13,800 cents of payments and 1,300 cents of refunds to 12,500 cents of revenue, then see what a repeatable project begins to replace.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
