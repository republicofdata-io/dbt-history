id: '0.1'
label: v0.1
title: Earliest SQL build workflow
lead: >
  SQL files become inputs to a repeatable build. This earliest series still looks quite different from modern
  dbt.
problem_then: |
  The shop has a revenue query but must repeatedly turn it into a database object by hand.
what_changed:
  - id: sql-build
    summary: Jinja-templated SQL compiled into database models.
    introduced_in: 0.1.1
    adapter_constraints: Redshift-oriented implementation.
    evidence:
      - src-1
    confidence: high
  - id: ref-known-present
    summary: ref() and deps are present by 0.1.14; first introduction is unresolved.
    introduced_in: null
    adapter_constraints: null
    evidence:
      - src-3
    confidence: qualified
    known_present_in: 0.1.14
    introduction_uncertainty: Not present in 0.1.1; confirmed by inspection of 0.1.14.
in_practice: >
  A SQL file in the project became a table or view in the warehouse with one command, instead of a statement
  someone pasted into a console. By patch 0.1.14 a model could point at another by name.
technical_detail: >
  The first observed 0.1 package is 0.1.1, not 0.1.0. It uses Boolean materialization configuration and lacks
  ref() and a test command. ref()/deps are present by 0.1.14; the exact first introducing patch is not
  established.
milestones:
