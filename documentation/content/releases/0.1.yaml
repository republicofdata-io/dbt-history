    - src-2
    - src-3
    limitations: |
      Illustration only. Early engine code targets Redshift; no local compatibility is claimed. The 0.1.1 project setting and 0.1.14 ref helper were inspected in original package source; the exact ref introduction patch remains unknown.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Turn SQL files into stored models with the early Boolean materialization setting.
    - By 0.1.14, refer to another model by name and let dbt track the dependency; the first introducing patch remains
      uncertain.
    scenario: |
      Waffle Shop needs the same revenue calculation rebuilt every day. The example starts with 0.1.1 and then advances explicitly to the later 0.1.14 dependency workflow.
    outcome: |
      See the same revenue rule represented in two historical checkpoints without importing modern configuration.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
