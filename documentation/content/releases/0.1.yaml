walkthrough:
  id: wt-0.1
  learning_objective: >
    See how the first dbt turned a SQL file into a rebuilt table, and how a later 0.1 patch let one model
    refer to another.
  context: >
    Jaffle Shop still earns 12,500 cents. The example compares how the same rule is represented in 0.1.1 and
    in the later 0.1.14 patch.
  dataset_variant: base
  steps:
    - id: query
      title: Start with one SQL file
      explanation: >-
        revenue_by_location.sql saves the whole revenue query as a model, a SQL file that dbt turns into a
        table or view. Highlighted lines 1 to 4 total payments per order straight from the raw table. There's
        no dbt shorthand yet, just plain table names. The result panel shows 12,500 cents across three
        locations.
      state:
        kind: table
        title: Revenue from the saved query
        columns:
          - location_id
          - revenue_cents
        rows:
          - - 1
            - 3400
          - - 2
            - 4300
          - - 3
            - 4800
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        A model is a SQL query saved in a file, and dbt builds the table from it.
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            with payment_totals as (
                select order_id, sum(amount_cents) as payment_cents
                from raw.payments
                group by order_id
            ), refund_totals as (
                select order_id, sum(amount_cents) as refund_cents
                from raw.refunds
                group by order_id
            )
            select
                orders.location_id,
                sum(coalesce(payment_totals.payment_cents, 0)
                    - coalesce(refund_totals.refund_cents, 0)) as revenue_cents
            from raw.orders as orders
            left join payment_totals on orders.order_id = payment_totals.order_id
            left join refund_totals on orders.order_id = refund_totals.order_id
            group by orders.location_id
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-0-1-1
    - id: config
      title: Tell dbt to store the result as a table
      explanation: >-
        Highlighted line 2 of dbt_project.yml is a Boolean switch: true stores a table; false stores a view.
        Highlighted lines 1 to 3 of order_payments.sql total raw payments per order. The command compiles the
        project. With target schema analytics, the panel compares the CREATE statements that the 0.1.1
        compiler would generate. These are prepared examples, not captured output.
      state:
        kind: comparison
        title: Generated statements at 0.1.1 (illustration)
        columns:
          - materialized
          - generated SQL
        rows:
          - - true
            - >-
              create table analytics.order_payments as ( select order_id, sum(amount_cents) as payment_cents
              from raw.payments group by order_id );
          - - false
            - >-
              create view analytics.order_payments as ( select order_id, sum(amount_cents) as payment_cents
              from raw.payments group by order_id );
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: Changing one Boolean changes the generated CREATE TABLE to CREATE VIEW.
      code:
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            model-defaults:
              materialized: true
          highlight_lines:
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_payments.sql
          content: |
            select order_id, sum(amount_cents) as payment_cents
            from raw.payments
            group by order_id
          highlight_lines:
            - 1
            - 2
            - 3
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt compile
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-0-1-1
    - id: patch
      title: 'Jump to patch 0.1.14: one model points at another'
      explanation: >-
        At patch 0.1.14, highlighted line 2 of revenue_by_location.sql uses ref('order_revenue') instead of a
        raw table name. dbt replaces that placeholder with the real table name and records the dependency. The
        existing order_revenue model supplies one row per order with payments minus refunds. The diagram shows
        it building before revenue_by_location.
      state:
        kind: diagram
        title: Build order at 0.1.14
        columns: []
        rows: []
        result_status: null
        diagram:
          nodes:
            - id: order_revenue
              label: order_revenue
            - id: revenue_by_location
              label: revenue_by_location
          edges:
            - from: order_revenue
              to: revenue_by_location
          highlight:
            - revenue_by_location
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        By patch 0.1.14 a model can point at another model by name, and dbt uses that link to build things in
        the right order.
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select location_id, sum(revenue_cents) as revenue_cents
            from {{ ref('order_revenue') }}
            group by location_id
          highlight_lines:
            - 2
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-0-1-1
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - alignment-0-1-1
    limitations: >
      Illustration only. Early engine code targets Redshift; no local compatibility is claimed. The 0.1.1
      project setting and 0.1.14 ref helper were inspected in original package source; the exact ref
      introduction patch remains unknown.

      historical-0.1-04: 0.1.1 compile.py inspected: only Jinja/project wrapping, no ref helper. 0.1.14 has
      ref; exact introduction patch stays unknown. Evidence: src-1, src-2, src-3, alignment-0-1-1.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Save a revenue query as a file and have dbt build it as a table in the warehouse.
      - Use one project-wide switch, materialized true or false, to store every model as a table or a view.
      - >-
        By patch 0.1.14, point one model at another by name and let dbt work out the build order. Which patch
        first added this is still unconfirmed.
    scenario: >
      Jaffle Shop wants its revenue by location recalculated every day. Instead of pasting a query into a
      database console, the query lives in a file and dbt rebuilds the table from it. The walkthrough starts
      at the first release, 0.1.1, then jumps to patch 0.1.14 to show one model referring to another.
    outcome: >
      See the same revenue rule at two points in the 0.1 series: first as a standalone SQL file, then as a
      model that refers to another model by name.
  title: |
    Demo: a plain SQL file becomes a table that dbt rebuilds, and by 0.1.14 one model can point at another
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
