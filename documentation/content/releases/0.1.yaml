walkthrough:
  id: wt-0.1
  learning_objective: |
    Recognize what the first build workflow did without borrowing later syntax.
  context: |
    Waffle Shop still earns 12,500 cents. The example compares how the same rule is represented in 0.1.1 and in the later 0.1.14 patch.
  dataset_variant: base
  steps:
  - id: query
    title: Start with a model file
    explanation: |
      In the 0.1.1 illustration, the model reads raw relations directly.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A model is a saved SQL definition.
    code:
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        with payment_totals as (
            select order_id, sum(amount_cents) as payment_cents
            from raw.payments
            group by order_id
        ), refund_totals as (
            select order_id, sum(amount_cents) as refund_cents
            from raw.refunds
            group by order_id
        )
        select
            orders.location_id,
            sum(coalesce(payment_totals.payment_cents, 0)
                - coalesce(refund_totals.refund_cents, 0)) as revenue_cents
        from raw.orders as orders
        left join payment_totals on orders.order_id = payment_totals.order_id
        left join refund_totals on orders.order_id = refund_totals.order_id
        group by orders.location_id
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    evidence:
    - src-1
    - src-2
    - src-3
  - id: config
    title: Choose a stored result
    explanation: |
      This 0.1.1 project excerpt uses the historical Boolean setting, before named materializations.
    state:
      kind: comparison
      title: 0.1.1 project choice
      columns:
      - setting
      - meaning
      rows:
      - - 'materialized: true'
        - table-backed model
      - - ref()
        - not available in this package
      - - test command
        - not available in this package
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The first release has its own configuration language.
    code:
    - language: yaml
      filename: dbt_project.yml (excerpt)
      content: |
        model-defaults:
          materialized: true
      highlight_lines:
      - 2
    - language: sql
      filename: models/order_payments.sql
      content: |
        select order_id, sum(amount_cents) as payment_cents
        from raw.payments
        group by order_id
      highlight_lines:
      - 1
      - 2
      - 3
      purpose: authored executable syntax; illustration only
    evidence:
    - src-1
    - src-2
    - src-3
  - id: patch
    title: Advance to patch 0.1.14
    explanation: |
      The downloaded 0.1.14 source includes ref(). This is a later patch, not evidence for 0.1.1.
    state:
      kind: diagram
      title: 0.1.14 dependency illustration
      columns: []
      rows: []
      result_status: null
      diagram:
        nodes:
        - id: order_revenue
          label: order_revenue
        - id: revenue
          label: revenue_by_location
        edges:
        - from: order_revenue
          to: revenue
        highlight:
        - revenue
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Record the patch when showing a feature added during a series.
    code:
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select location_id, sum(revenue_cents) as revenue_cents
        from {{ ref('order_revenue') }}
        group by location_id
      highlight_lines:
      - 2
    evidence:
    - src-1
    - src-2
    - src-3
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
