id: '0.10'
label: v0.10
title: Reusable packages and portable seeds
lead: >
  Small CSV datasets become easier to use across adapters and through ref. Dependency declarations also get
  their own packages.yml file.
problem_then: |
  Small reference data and dependency configuration need a consistent place in a project.
what_changed:
  - id: change-1
    summary: packages.yml and local package paths replace repository declarations.
    introduced_in: 0.10.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: 'Seed overhaul: all adapters, ref-able CSVs and configuration.'
    introduced_in: 0.10.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
in_practice: >
  A small reference table such as the list of locations was kept as a CSV in the project, loaded with dbt seed
  and referenced from models like any other table. Dependencies moved to packages.yml.
technical_detail: >
  Seeds existed by 0.2.3.0. The 0.10 change is an overhaul, including adapter coverage and ref support, not
  their first appearance. The CSV below is the same immutable locations fixture.
milestones:
  - id: 0.10.0
    kind: package
    date: '2018-03-08'
    precision: day
    title: First published package
    evidence:
      - src-2
sources:
  - id: src-1
    title: dbt 0.10 release evidence
    url: https://github.com/dbt-labs/dbt/releases/tag/v0.10.0
    retrieved: '2026-09-21'
    supports: Tagged release changes; package upload and public announcement remain distinct.
  - id: src-2
