walkthrough:
  id: wt-0.10
  learning_objective: >
    See how a small CSV file kept in the project (a seed) is loaded into the warehouse and joined to the
    revenue numbers.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: csv
      title: Keep the location names in a CSV file inside the project
      explanation: >-
        Highlighted lines 1 to 4 of the CSV contain a header and one row per location, with its id and name.
        dbt calls this a seed: a small, hand-maintained table that lives with project code. The result panel
        shows the same three rows as a table.
      state:
        kind: table
        title: The three locations as a table
        columns:
          - location_id
          - name
        rows:
          - - 1
            - Old Port
          - - 2
            - Mile End
          - - 3
            - Riverside
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        A short list that rarely changes, like location names, can live in the project as a CSV seed instead
        of being retyped in every report.
      code:
        - language: text
          filename: data/locations.csv
          content: |
            location_id,name
            1,Old Port
            2,Mile End
            3,Riverside
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - alignment-0-10-0
    - id: seed
      title: Load the CSV and refer to it from a model
      explanation: >-
        The command runs dbt seed to load the CSV into a warehouse table. Highlighted lines 1 and 2 of
        location_names select that table with ref(), the same function used to point at other models. That
        tells dbt the seed is an input. The panel shows the three loaded location rows.
      state:
        kind: table
        title: Loaded seed table and its row count
        columns:
          - relation
          - rows
        rows:
          - - locations
            - 3
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        Once loaded, the seed is a table that models can point at with ref, just like any other model.
      code:
        - language: sql
          filename: models/location_names.sql
          content: |
            select location_id, name
            from {{ ref("locations") }}
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt seed
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - alignment-0-10-0
    - id: package
      title: Declare a local package in its own file
      explanation: >-
        Highlighted line 2 of packages.yml points to a second dbt project on disk. The command runs dbt deps
        to install it. The panel compares the older repositories entry with the new package file. The folder
        must exist and contain a dbt project; this is an authored example, not a published package.
      state:
        kind: comparison
        title: Where the dependency is declared
        columns:
          - era
          - file
          - entry
        rows:
          - - before 0.10
            - dbt_project.yml
            - 'repositories: [git URL]'
          - - '0.10'
            - packages.yml
            - 'local: ../jaffle_utils'
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: Dependencies have their own file, and an entry can point directly to a local project folder.
      code:
        - language: yaml
          filename: packages.yml
          content: |
            packages:
              - local: ../jaffle_utils
          highlight_lines:
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt deps
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - alignment-0-10-0
    - id: labels
      title: Join the names to the revenue numbers
      explanation: >-
        Highlighted line 5 of revenue_by_location_labeled reads the existing order-level revenue; line 6 joins
        its location_id to the locations seed. The query totals payments, refunds and revenue for each named
        location. The result panel contains the three names and 12,500 cents in total. Names are joined once,
        directly from the seed.
      state:
        kind: table
        title: Revenue by location with names from the seed
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - 1
            - Old Port
            - 4400
            - 1000
            - 3400
          - - 2
            - Mile End
            - 4600
            - 300
            - 4300
          - - 3
            - Riverside
            - 4800
            - 0
            - 4800
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        The location names now come from one file in the project, so every report that joins to the seed shows
        the same names.
      evidence:
        - src-1
        - src-2
        - alignment-0-10-0
      code:
        - language: sql
          filename: models/revenue_by_location_labeled.sql
          content: |
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join {{ ref("locations") }} as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 5
            - 6
          purpose: Authored era-specific example; illustration only.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - alignment-0-10-0
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Keep a small CSV file, such as a list of location names, inside the dbt project and load it into the
        warehouse with one command.
      - Refer to that CSV from a model the same way you refer to any other model, so dbt knows it is an input.
      - >-
        List the other dbt projects the project depends on in a packages.yml file, including projects sitting
        in a local folder.
    scenario: >
      Every revenue report needs to show the location names Old Port, Mile End and Riverside. Until now,
      someone typed those names into each report by hand. Jaffle Shop puts the three names in one CSV file
      inside the project, loads it as a table, and joins it to the revenue numbers.
    outcome: >-
      See the CSV become a ref-addressable table, a local package declared in packages.yml, and names joined
      once to the revenue result.
  title: 'Demo: reference a CSV seed and declare a local package'
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
