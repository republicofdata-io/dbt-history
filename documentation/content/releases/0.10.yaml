id: '0.10'
label: v0.10
title: Reusable packages and portable seeds
lead: |
  Small CSV datasets become easier to use across adapters and through ref. Dependency declarations also get their own packages.yml file.
problem_then: |
  Small reference data and dependency configuration need a consistent place in a project.
what_changed:
- id: change-1
  summary: packages.yml and local package paths replace repository declarations.
  introduced_in: 0.10.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: 'Seed overhaul: all adapters, ref-able CSVs and configuration.'
  introduced_in: 0.10.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Store the three shop locations as a seed, then reference that relation from SQL.
technical_detail: |
  Seeds existed by 0.2.3.0. The 0.10 change is an overhaul, including adapter coverage and ref support, not their first appearance. The CSV below is the same immutable locations fixture.
milestones:
- id: 0.10.0
  kind: package
  date: '2018-03-08'
  precision: day
  title: First published package
  evidence:
  - src-2
sources:
- id: src-1
  title: dbt 0.10 release evidence
  url: https://github.com/dbt-labs/dbt/releases/tag/v0.10.0
  retrieved: '2026-09-21'
  supports: Release changes or package publication; date kinds remain distinct.
- id: src-2
  title: dbt 0.10 package evidence
  url: https://pypi.org/project/dbt/0.10.0/
  retrieved: '2026-09-21'
  supports: Release changes or package publication; date kinds remain distinct.
narrative_evidence:
- src-1
- src-2
walkthrough:
  id: wt-0.10
  learning_objective: |
    Recognize a seed as version-controlled reference data.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: csv
    title: Keep the locations in the project
    explanation: |
      Three stable location names are a good small reference dataset.
    state:
      kind: table
      title: Location seed
      columns:
      - location_id
      - name
      rows:
      - - 1
        - Old Port
      - - 2
        - Mile End
      - - 3
        - Riverside
      result_status: null
      diagram: null
    takeaway: |
      Use a seed for small maintained reference data.
    code:
    - language: text
      filename: data/locations.csv
      content: |
        location_id,name
        1,Old Port
        2,Mile End
        3,Riverside
      highlight_lines: []
  - id: seed
    title: Load and reference the seed
    explanation: |
      The prepared relation contains the same three rows.
    state:
      kind: comparison
      title: Load and reference the seed
      columns:
      - relation
      - rows
      rows:
      - - locations
        - 3
      result_status: null
      diagram: null
    takeaway: |
      A seed can participate in the dependency graph.
    code:
    - language: shell
      filename: commands.sh
      content: |
        dbt seed
      highlight_lines: []
    - language: sql
      filename: models/location_names.sql
      content: |
        select location_id, name
        from {{ ref("locations") }}
      highlight_lines: []
  - id: labels
    title: Attach readable names
    explanation: |
      The location IDs join to the same names used in the revenue expectation.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
    takeaway: |
      The labels are maintained with the project, not typed separately into every report.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt execution.
