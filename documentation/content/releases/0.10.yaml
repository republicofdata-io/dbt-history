      https://files.pythonhosted.org/packages/e3/3e/dbccc280ec71144cba3b82ce6889db09b0b5ed4830cafaadead6cb8170b3/dbt-0.10.0.tar.gz
    retrieved: '2026-09-22'
    source_path: dbt/task/deps.py; dbt/deps.py; dbt/parser.py
