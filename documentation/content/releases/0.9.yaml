walkthrough:
  id: wt-0.9
  learning_objective: |
    Tell the shop's own models apart from behaviour it borrows from a shared package.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: copies
      title: Two reports, one rule
      explanation: >-
        Highlighted line 2 of each report types out payments minus refunds. These are two separate copies
        of the rule. The panel lists the two reports and the repeated calculation; the next step moves it
        into a shared package.
      state:
        kind: comparison
        title: One rule shared by two reports
        columns:
          - model
          - rule
        rows:
          -   - daily_revenue
              - payments minus refunds
          -   - customer_revenue
              - payments minus refunds
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        Both reports currently carry their own copy of the same subtraction.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-0-9-0
      code:
        - language: sql
          filename: models/daily_revenue.sql
          content: |
            select order_id,
                payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/customer_revenue.sql
          content: |
            select customer_id,
                sum(payment_cents - refund_cents) as revenue_cents
            from {{ ref("order_amounts") }}
            group by customer_id
          highlight_lines:
            - 2
          purpose: Authored era-specific example; illustration only.
    - id: dependency
      title: Pull the shared behaviour in as a dependency
      explanation: >
        Highlighted lines 4 and 5 of the shop's project file list the shared project as a repository. This
        is
        the older way to declare a dependency, before packages.yml existed. Highlighted lines 1 and 3 of the
        shared project name it and say where its macros live. The shared project also carries a test:
        highlighted lines 1 to 3 of test_non_negative count rows where a column is below zero. Highlighted
        lines 2 to 4 of the shop's schema file apply that test to revenue_cents. The command dbt deps
        downloads the package. The result panel sorts out what lives where: the macro and tests in the shared
        package, the shop's own source mappings at home. The shared package is made up for this example; it
        was never published.
      state:
        kind: comparison
        title: What lives in the package and what stays local
        columns:
          - component
          - belongs in
        rows:
          -   - net-revenue macro
              - shared dependency
          -   - shared integrity tests
              - shared dependency
          -   - shop-specific source mappings
              - Jaffle Shop project
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        A package can supply macros and tests, not only models, and one command pulls it in.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-0-9-0
      code:
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            name: jaffle_shop
            version: "1.0"
            profile: jaffle_shop
            repositories:
              - "file:///tmp/shared_shop"
          highlight_lines:
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: jinja
          filename: shared_shop/macros/net_cents.sql
          content: |
            {% macro net_cents(payment, refund) %}
              ({{ payment }} - {{ refund }})
            {% endmacro %}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/daily_revenue.sql
          content: |
            select order_id,
                {{ shared_shop.net_cents("payment_cents", "refund_cents") }} as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: shared_shop/dbt_project.yml
          content: |
            name: shared_shop
            version: "1.0"
            macro-paths: [macros]
          highlight_lines:
            - 1
            - 3
          purpose: authored executable syntax; illustration only
        - language: jinja
          filename: shared_shop/macros/test_non_negative.sql
          content: |
            {% macro test_non_negative(model, column_name) %}
            select count(*) from {{ model }}
            where {{ column_name }} < 0
            {% endmacro %}
          highlight_lines:
            - 1
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: yaml
          filename: models/schema.yml
          content: |
            order_revenue:
              constraints:
                shared_shop.non_negative:
                  - {column_name: revenue_cents}
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt deps
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
    - id: schema
      title: Give the reports their own schema
      explanation: >
        A schema is a named area inside the database. Highlighted line 5 of the profile sets the base schema,
        jaffle. Highlighted line 1 of the location model asks for a custom schema, analytics. dbt joins the
        two with an underscore, so the table lands in jaffle_analytics. The result panel shows where each
        report ends up. The names are illustrative.
      state:
        kind: comparison
        title: Where each model lands
        columns:
          - relation
          - illustrative schema
        rows:
          -   - order_revenue
              - jaffle
          -   - revenue_by_location
              - jaffle_analytics
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        A model can choose its own schema, so shared code does not force every project into the same place.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-0-9-0
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            {{ config(schema="analytics") }}
            select location_id, sum(revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }}
            group by location_id
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: profiles.yml (target excerpt)
          content: |
            jaffle_shop:
              target: dev
              outputs:
                dev:
                  schema: jaffle
          highlight_lines:
            - 5
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
      - alignment-0-9-0
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The dependency is an authored local Git repository at /tmp/shared_shop, not a claimed historical published package; it must exist and contain the shown macro/project files. The old repositories key is used, not packages.yml. With target schema jaffle and custom schema analytics, the default schema macro produces jaffle_analytics.
      The shared 0.9 test uses a test_ macro returning a count, invoked through the v1 constraints mapping and package namespace; it is not a modern data-test block.
      historical-0.9-02: Confirmed package-prefixed v1 constraints in 0.9 parser.py, resolving a namespaced test_ macro. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-0-9-0.
      historical-0.9-03: Confirmed repositories is handed to Git clone, which accepts file URLs. The example is an authored existing local Git repository, not a historical public package. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-0-9-0.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Pull custom tests and materializations from another dbt project, not just its models.
      - Use ref, var and the warehouse adapter from inside a macro.
      - >-
        Send chosen models to their own schema, a named area inside the database, instead of one schema for
        everything.
    scenario: >
      Two shop reports, daily revenue and revenue by customer, need the same net-revenue rule and the same
      data checks. Rather than copying that logic into each, the shop pulls it from a shared package, a second
      dbt project that is made up for this example, and keeps only its own source mappings locally.
    outcome: >
      Read the shared macro, the line that pulls in the package, a shared test and a custom schema setting,
      all in the syntax used before packages.yml existed.
  title: |
    Demo: a shared package supplies the net-revenue macro and a custom test to two reports
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
