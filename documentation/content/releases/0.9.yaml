id: '0.9'
label: v0.9
title: Extensible projects
lead: >
  Shared packages can carry more of a team’s dbt behavior. Custom schemas also help separate the shop’s models
  from other projects.
problem_then: |
  Reusing SQL is helpful, but teams also repeat tests, materializations and deployment conventions.
what_changed:
  - id: change-1
    summary: Macros can use adapter, ref and var; packages can supply custom tests/materializations.
    introduced_in: 0.9.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Custom schemas; improved BigQuery table support.
    introduced_in: 0.9.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
in_practice: |
  Put shared project behavior in dependencies and choose schemas deliberately.
technical_detail: >
  This release predates packages.yml. Do not display the later package file as 0.9 syntax. Macros gain richer
  context, including adapter, ref and var. The example uses workflow states to avoid inventing a historical
  package registry entry.
milestones:
  - id: 0.9.0
    kind: package
    date: '2017-10-26'
    precision: day
    title: First published package
    evidence:
      - src-2
