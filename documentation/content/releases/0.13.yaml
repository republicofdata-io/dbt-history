walkthrough:
  id: wt-0.13
  learning_objective: |
    Distinguish fresh data from valid arithmetic.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is stale-payments. Each state below is an authored illustration.
  dataset_variant: stale-payments
  steps:
  - id: clock
    title: Inspect the feed observation
    explanation: |
      At noon on March 9 the last recorded payment load is 08:00.
    state:
      kind: comparison
      title: Inspect the feed observation
      columns:
      - evaluation_utc
      - last_loaded_utc
      - age_hours
      rows:
      - - 2016-03-09 12:00
        - 2016-03-09 08:00
        - 4
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Freshness measures elapsed time since a source update.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    code:
    - language: sql
      filename: setup/payments_feed.sql
      content: |
        create view raw.payments_feed as
        select p.*, cast(
            '2016-03-09 08:00:00' as timestamp
        ) as loaded_at
        from raw.payments as p;
      highlight_lines:
      - 2
      - 3
      - 4
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: models/sources.yml
      content: |
        version: 2
        sources:
          - name: raw
            schema: raw
            tables:
              - name: payments
                identifier: payments_feed
                loaded_at_field: loaded_at
                freshness:
                  warn_after: {count: 1, period: hour}
                  error_after: {count: 3, period: hour}
      highlight_lines:
      - 7
      - 8
      - 9
      - 10
      - 11
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/payment_feed_age.sql
      content: |
        select max(loaded_at) as last_loaded_utc,
            cast('2016-03-09 12:00:00' as timestamp) as evaluation_utc,
            datediff(hour, max(loaded_at),
                cast('2016-03-09 12:00:00' as timestamp)) as age_hours
        from {{ source("raw", "payments") }}
      highlight_lines:
      - 2
      - 3
      - 4
      purpose: authored executable syntax; illustration only
  - id: threshold
    title: Compare the thresholds
    explanation: |
      The fictional feed allows one hour before warning and three before error.
    state:
      kind: result
      title: Compare the thresholds
      columns:
      - check
      - expected
      - actual
      rows:
      - - age before error
        - at most 3 hours
        - 4 hours
      result_status: fail
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      This feed fails its timeliness expectation.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    code:
    - language: yaml
      filename: models/sources.yml
      content: |
        version: 2
        sources:
          - name: raw
            schema: raw
            tables:
              - name: payments
                identifier: payments_feed
                loaded_at_field: loaded_at
                freshness:
                  warn_after: {count: 1, period: hour}
                  error_after: {count: 3, period: hour}
      highlight_lines:
      - 7
      - 8
      - 9
      - 10
      - 11
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/payment_feed_age.sql
      content: |
        select max(loaded_at) as last_loaded_utc,
            cast('2016-03-09 12:00:00' as timestamp) as evaluation_utc,
            datediff(hour, max(loaded_at),
                cast('2016-03-09 12:00:00' as timestamp)) as age_hours
        from {{ source("raw", "payments") }}
      highlight_lines:
      - 2
      - 3
      - 4
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt source snapshot-freshness
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
  - id: business
    title: Separate two trust questions
    explanation: |
      The base rows still sum correctly even though the feed is stale.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Correct arithmetic is not proof that today’s data has arrived.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    code:
    - language: sql
      filename: models/payments.sql
      content: |
        select payment_id, order_id, amount_cents
        from {{ source("raw", "payments") }}
      highlight_lines:
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        with paid as (
            select order_id, sum(amount_cents) as payment_cents
            from raw.payments group by order_id
        ), refunded as (
            select order_id, sum(amount_cents) as refund_cents
            from raw.refunds group by order_id
        )
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from raw.orders as o
        left join paid as p on o.order_id = p.order_id
        left join refunded as r on o.order_id = r.order_id
      highlight_lines:
      - 2
      - 5
      - 8
      - 9
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
