walkthrough:
  id: wt-0.13
  learning_objective: |
    Tell the difference between data that adds up correctly and data that arrived on time.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is stale-payments. Each state below is an authored illustration.
  dataset_variant: stale-payments
  steps:
    - id: clock
      title: Check when the payment feed last loaded
      explanation: >
        Three files are shown. The first, highlighted on lines 2 to 4, stamps every payment row with the time
        it was loaded: 08:00 on March 9. The YAML file, highlighted on lines 7 to 11, tells dbt which column
        holds that timestamp and how old is too old. The third file is a query, highlighted on lines 2 to
        4,
        that compares the last load time to noon. The result panel shows the answer: the feed is four hours
        old.
      state:
        kind: comparison
        title: Age of the payment feed at noon
        columns:
          - evaluation_utc
          - last_loaded_utc
          - age_hours
        rows:
          -   - 2016-03-09 12:00
              - 2016-03-09 08:00
              - 4
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Freshness is simply how much time has passed since the raw table was last loaded.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
      code:
        - language: sql
          filename: setup/payments_feed.sql
          content: |
            create view raw.payments_feed as
            select p.*, cast(
                '2016-03-09 08:00:00' as timestamp
            ) as loaded_at
            from raw.payments as p;
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: models/sources.yml
          content: |
            version: 2
            sources:
              - name: raw
                schema: raw
                tables:
                  - name: payments
                    identifier: payments_feed
                    loaded_at_field: loaded_at
                    freshness:
                      warn_after: {count: 1, period: hour}
                      error_after: {count: 3, period: hour}
          highlight_lines:
            - 7
            - 8
            - 9
            - 10
            - 11
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: analyses/payment_feed_age.sql
          content: |
            select max(loaded_at) as last_loaded_utc,
                cast('2016-03-09 12:00:00' as timestamp) as evaluation_utc,
                datediff(hour, max(loaded_at),
                    cast('2016-03-09 12:00:00' as timestamp)) as age_hours
            from {{ source("raw", "payments") }}
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: authored executable syntax; illustration only
    - id: threshold
      title: Compare the age with the allowed limits
      explanation: >
        The same YAML file is shown, with lines 7 to 11 highlighted. Line 10 says warn after one hour. Line
        11
        says error after three hours. The command file runs the dbt freshness check. The result panel compares
        the limit with the actual age: at most three hours allowed, four hours observed. The check fails.
      state:
        kind: result
        title: 'Freshness check: three hours allowed, four observed'
        columns:
          - check
          - expected
          - actual
        rows:
          -   - age before error
              - at most 3 hours
              - 4 hours
        result_status: fail
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The payment feed is older than the three-hour limit, so its freshness check fails.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
      code:
        - language: yaml
          filename: models/sources.yml
          content: |
            version: 2
            sources:
              - name: raw
                schema: raw
                tables:
                  - name: payments
                    identifier: payments_feed
                    loaded_at_field: loaded_at
                    freshness:
                      warn_after: {count: 1, period: hour}
                      error_after: {count: 3, period: hour}
          highlight_lines:
            - 7
            - 8
            - 9
            - 10
            - 11
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: analyses/payment_feed_age.sql
          content: |
            select max(loaded_at) as last_loaded_utc,
                cast('2016-03-09 12:00:00' as timestamp) as evaluation_utc,
                datediff(hour, max(loaded_at),
                    cast('2016-03-09 12:00:00' as timestamp)) as age_hours
            from {{ source("raw", "payments") }}
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt source snapshot-freshness
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
    - id: business
      title: The arithmetic is still right
      explanation: >-
        Highlighted line 2 of payments reads the declared source. Highlighted line 3 of order_amounts now
        reads that payments model through ref(), so the source link reaches the revenue calculation. Lines
        5, 8 and 9 add refunds and attach both totals to orders. The panel still totals 12,500 cents, despite
        the four-hour-old feed.
      state:
        kind: table
        title: Revenue by location on the stale feed
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          -   - 1
              - Old Port
              - 4400
              - 1000
              - 3400
          -   - 2
              - Mile End
              - 4600
              - 300
              - 4300
          -   - 3
              - Riverside
              - 4800
              - 0
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >
        Correct arithmetic and fresh data are two separate questions, and this feed passes the first but fails
        the second.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
      code:
        - language: sql
          filename: models/payments.sql
          content: |
            select payment_id, order_id, amount_cents
            from {{ source("raw", "payments") }}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            with paid as (
                select order_id, sum(amount_cents) as payment_cents
                from {{ ref("payments") }} group by order_id
            ), refunded as (
                select order_id, sum(amount_cents) as refund_cents
                from raw.refunds group by order_id
            )
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from raw.orders as o
            left join paid as p on o.order_id = p.order_id
            left join refunded as r on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 5
            - 8
            - 9
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The derived raw.payments_feed view adds the variant’s fixed loaded_at observation without altering base rows. The displayed four-hour age is computed by the Redshift analysis at the declared historical evaluation time; native freshness uses the actual warehouse clock, so running that command today would not produce four hours.
      The age query assumes Redshift, where datediff(hour, ...) is valid. Separate adapter installation is release context, not a demonstrated step; the source-freshness API and date arithmetic assumptions are stated explicitly (src-1 and source contract evidence).
      historical-0.13-02: Named Redshift as the adapter for datediff(hour,...); no PostgreSQL compatibility is claimed for that query. Evidence: src-1, src-2, src-3, src-4.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Give the raw tables a name in a YAML file and point models at them with source, so dbt knows where
        the
        project's inputs come from.
      - Say how old a raw table may be before dbt warns, and before it errors, then run one command to
        check.
    scenario: >
      It is noon on March 9. The last batch of payments landed at 08:00, four hours ago. The rows still add
      up
      to the expected revenue. But Jaffle Shop has said the payment feed must be no more than three hours
      old,
      so the feed fails its freshness check.
    outcome: |
      Compare a revenue calculation that is correct with a freshness check that fails on the same data.
  title: |
    Demo: the payment feed is four hours old, so a freshness check fails even though the numbers add up
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
