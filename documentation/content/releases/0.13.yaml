id: '0.13'
label: v0.13
title: Sources and adapter plugins
lead: >
  Sources become named inputs with freshness checks. A correct calculation can now sit beside a warning that
  its feed is too old.
problem_then: |
  A table can contain internally consistent data while missing the latest business activity.
what_changed:
  - id: change-1
    summary: Sources with freshness checks.
    introduced_in: 0.13.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Stable adapter API and separate adapter plugins; Presto adapter.
    introduced_in: 0.13.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
in_practice: |
  Treat source timeliness as a separate question from model correctness.
technical_detail: >
  The stale-payments variant supplies fixed freshness observations, not an extra timestamp column in the base
  payment table. The result is a prepared age comparison. Adapter plugins also become separate packages.
  run-operation is present in inspected 0.13 source but announced in 0.14 notes; its exact introduction
  remains unresolved.
