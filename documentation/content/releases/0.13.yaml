    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The derived raw.payments_feed view adds the variant’s fixed loaded_at observation without altering base rows. The displayed four-hour age is computed by the Redshift analysis at the declared historical evaluation time; native freshness uses the actual warehouse clock, so running that command today would not produce four hours.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Name raw inputs as sources and reference them with source.
    - Set freshness thresholds and check whether a feed is too old.
    - Install supported adapter plugins separately from Core.
    scenario: |
      At noon, the latest recorded payment load is four hours old. Its rows still reconcile, but the shop’s three-hour error threshold means the feed cannot be treated as current.
    outcome: |
      Compare correct arithmetic with a separately failing freshness expectation.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
