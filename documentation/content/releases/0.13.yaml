walkthrough:
  id: wt-0.13
  learning_objective: |
    Distinguish fresh data from valid arithmetic.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is stale-payments. Each state below is an authored illustration.
  dataset_variant: stale-payments
  steps:
  - id: clock
    title: Inspect the feed observation
    explanation: |
      At noon on March 9 the last recorded payment load is 08:00.
    state:
      kind: comparison
      title: Inspect the feed observation
      columns:
      - evaluation_utc
      - last_loaded_utc
      - age_hours
      rows:
      - - 2016-03-09 12:00
        - 2016-03-09 08:00
        - 4
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Freshness measures elapsed time since a source update.
    evidence:
    - src-1
    - src-2
  - id: threshold
    title: Compare the thresholds
    explanation: |
      The fictional feed allows one hour before warning and three before error.
    state:
      kind: result
      title: Compare the thresholds
      columns:
      - check
      - expected
      - actual
      rows:
      - - age before error
        - at most 3 hours
        - 4 hours
      result_status: fail
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      This feed fails its timeliness expectation.
    evidence:
    - src-1
    - src-2
  - id: business
    title: Separate two trust questions
    explanation: |
      The base rows still sum correctly even though the feed is stale.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Correct arithmetic is not proof that today’s data has arrived.
    evidence:
    - src-1
    - src-2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
