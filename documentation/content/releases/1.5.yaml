walkthrough:
  id: wt-1.5
  learning_objective: |
    See a contract reject a model whose output columns no longer match what it promised.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: promise
      title: The model promises two columns
      explanation: >-
        Highlighted lines 5 and 6 enforce the contract, the promised output shape. Lines 8 to 11 promise location_id
        as integer and revenue_cents as bigint. The supporting SQL casts both columns to those types. The
        panel lists exactly those two columns.
      state:
        kind: comparison
        title: The two promised columns and their types
        columns:
          - column
          - declared type
        rows:
          -   - location_id
              - integer
          -   - revenue_cents
              - bigint
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The contract fixes both the names and the types of the model's output columns.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                config:
                  contract:
                    enforced: true
                columns:
                  - name: location_id
                    data_type: integer
                  - name: revenue_cents
                    data_type: bigint
          highlight_lines:
            - 5
            - 6
            - 8
            - 9
            - 10
            - 11
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select cast(location_id as integer) as location_id,
                cast(sum(revenue_cents) as bigint) as revenue_cents
            from {{ ref("order_revenue") }}
            group by location_id
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
      evidence:
        - src-1
        - src-2
        - alignment-1-5-0
    - id: mismatch
      title: An edit renames the column and the contract rejects it
      explanation: >-
        Highlighted lines 5, 6 and 8 to 11 keep the same enforced contract. Highlighted line 2 of the proposed
        SQL renames revenue_cents to net_cents. The prepared panel shows the name mismatch that stops the
        build during SQL compilation, before table creation. This is an interface check, not a database constraint
        violation.
      state:
        kind: result
        title: 'Contract mismatch: revenue_cents expected, net_cents found'
        columns:
          - expected column
          - proposed column
          - assessment
        rows:
          -   - revenue_cents
              - net_cents
              - interface mismatch
        result_status: fail
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The contract failed the build because a column name changed, even though the numbers were still right.
      evidence:
        - src-1
        - src-2
        - alignment-1-5-0
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                config:
                  contract:
                    enforced: true
                columns:
                  - name: location_id
                    data_type: integer
                  - name: revenue_cents
                    data_type: bigint
          highlight_lines:
            - 5
            - 6
            - 8
            - 9
            - 10
            - 11
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql (proposed edit)
          content: |
            select cast(location_id as integer) as location_id,
                cast(sum(revenue_cents) as bigint) as net_cents
            from {{ ref("order_revenue") }}
            group by location_id
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt run --select revenue_by_location
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
    - id: repair
      title: Restore the column name and the build passes
      explanation: >-
        The contract still highlights enforcement and the two promised column types. Highlighted line 2 of
        SQL restores revenue_cents. The panel now contains exactly the two query columns and three location
        rows, with 3,400, 4,300 and 4,800 cents.
      state:
        kind: table
        title: Corrected contract output
        columns:
          - location_id
          - revenue_cents
        rows:
          -   - 1
              - 3400
          -   - 2
              - 4300
          -   - 3
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >
        With the column name restored, the contract passes and the dashboard keeps reading the column it
        expects.
      evidence:
        - src-1
        - src-2
        - alignment-1-5-0
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                config:
                  contract:
                    enforced: true
                columns:
                  - name: location_id
                    data_type: integer
                  - name: revenue_cents
                    data_type: bigint
          highlight_lines:
            - 5
            - 6
            - 8
            - 9
            - 10
            - 11
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select cast(location_id as integer) as location_id,
                cast(sum(revenue_cents) as bigint) as revenue_cents
            from {{ ref("order_revenue") }}
            group by location_id
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
    - id: versions
      title: Ship the rename as version 2
      explanation: 'Highlighted line 4 keeps version 1 as the default. Lines 10 to 16 keep its existing SQL
        file and declare version 2 with net_cents instead of revenue_cents. The v2 SQL supplies the renamed
        column; the dashboard’s unversioned ref still resolves to v1. dbt show previews v2 in the panel: the
        same 3,400, 4,300 and 4,800 cents under net_cents.'
      state:
        kind: table
        title: Prepared dbt show preview of v2
        columns:
          - location_id
          - net_cents
        rows:
          -   - 1
              - 3400
          -   - 2
              - 4300
          -   - 3
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: The renamed interface is available as v2 while the existing dashboard stays on v1.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                latest_version: 1
                config: {materialized: table, contract: {enforced: true}}
                columns:
                  - {name: location_id, data_type: integer}
                  - {name: revenue_cents, data_type: bigint}
                versions:
                  - v: 1
                    defined_in: revenue_by_location
                  - v: 2
                    columns:
                      - include: "*"
                        exclude: [revenue_cents]
                      - {name: net_cents, data_type: bigint}
          highlight_lines:
            - 4
            - 10
            - 11
            - 12
            - 14
            - 15
            - 16
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location_v2.sql
          content: |
            select cast(location_id as integer) as location_id,
                cast(sum(revenue_cents) as bigint) as net_cents
            from {{ ref("order_revenue") }}
            group by location_id
          highlight_lines:
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select cast(location_id as integer) as location_id,
                cast(sum(revenue_cents) as bigint) as revenue_cents
            from {{ ref("order_revenue") }}
            group by location_id
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/dashboard_input.sql
          content: |
            select location_id, revenue_cents
            from {{ ref("revenue_by_location") }}
          highlight_lines:
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt show --select revenue_by_location.v2 --limit 3
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - alignment-1-5-0
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - alignment-1-5-0
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The include selector is "*", not the review’s suggested literal all. defined_in preserves the existing v1 filename; default ref resolves latest_version: 1. Groups and access remain release context, not promised demo behaviors. Preview order is illustrative because the grouped SQL has no ORDER BY (src-1 and 1.5 source).
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Reject a model whose output differs from its promised column names and types.
      - Publish a renamed column in a second model version while the default stays on version 1.
      - Preview the versioned model with dbt show.
    scenario: >-
      A proposed rename from revenue_cents to net_cents breaks the dashboard’s expected column. Waffle Shop
      catches it with a contract, restores the original, then publishes the rename as a separate version.
    outcome: |-
      See the mismatch, the restored v1 output, and a v2 preview that preserves the same revenue values.
  title: |-
    Demo: catch a contract break and publish the rename as version 2
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
