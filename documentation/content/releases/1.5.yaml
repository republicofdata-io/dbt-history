walkthrough:
  id: wt-1.5
  learning_objective: |
    Catch a column-name change before treating it as the same interface.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: promise
    title: Declare the expected columns
    explanation: |
      The contract promises location_id and revenue_cents.
    state:
      kind: comparison
      title: Declare the expected columns
      columns:
      - column
      - declared type
      rows:
      - - location_id
        - integer
      - - revenue_cents
        - bigint
      result_status: null
      diagram: null
    takeaway: |
      A model interface includes names and types.
    code:
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: revenue_by_location
            config:
              contract:
                enforced: true
            columns:
              - name: location_id
                data_type: integer
              - name: revenue_cents
                data_type: bigint
      highlight_lines: []
  - id: mismatch
    title: Rename a column in the proposed SQL
    explanation: |
      Assume a proposed edit returns net_cents instead of the contracted name.
    state:
      kind: result
      title: Rename a column in the proposed SQL
      columns:
      - expected column
      - proposed column
      - assessment
      rows:
      - - revenue_cents
        - net_cents
        - interface mismatch
      result_status: fail
      diagram: null
    takeaway: |
      The issue is a broken interface even if values still sum correctly.
  - id: repair
    title: Restore the public name
    explanation: |
      The corrected output again exposes revenue_cents.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
    takeaway: |
      An interface check complements the tests of business meaning.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt execution.
