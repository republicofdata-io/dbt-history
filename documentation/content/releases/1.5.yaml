id: '1.5'
label: v1.5
title: Models as governed interfaces
lead: |
  Contracts, versions and access settings give models a clearer interface. A consumer can depend on a named, typed output.
problem_then: |
  Changing a column silently can break dashboards and downstream models.
what_changed:
- id: change-1
  summary: Model contracts, versions, groups and access.
  introduced_in: 1.5.0
  adapter_constraints: Contract types and constraints vary by adapter and materialization.
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: dbt show and programmatic dbtRunner.
  introduced_in: 1.5.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Declare the interface and plan changes for consumers rather than treating every model as a private scratch table.
technical_detail: |
  Contract enforcement checks model shape where supported; it does not prove the revenue definition is correct. Versions and groups/access manage project interfaces, not a universal warehouse authorization system.
