      linked from the package.
    rechecked: '2026-09-22'
  - id: alignment-1-5-0
    title: 'dbt 1.5.0 original source: dbt/contracts/graph/unparsed.py:144-247; dbt/parser/schemas.py; dbt/task/show.py'
    url:
      https://files.pythonhosted.org/packages/bd/50/24e22edfe4d667a6c3e7910dcbbf4c1cf1994d82ae2a8d90c94fd14bd763/dbt-core-1.5.0.tar.gz
    retrieved: '2026-09-22'
    source_path: dbt/contracts/graph/unparsed.py:144-247; dbt/parser/schemas.py; dbt/task/show.py
    sha256: d6d43b7ff0f12765e7e85559c1a109eaa23a7536b26b3f963d0c19263f69b3c4
