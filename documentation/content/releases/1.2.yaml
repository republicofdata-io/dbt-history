walkthrough:
  id: wt-1.2
  learning_objective: |
    Separate creating a model from granting access to it.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: access
    title: Identify the reader
    explanation: |
      The fictional finance_reader role needs the location revenue result.
    state:
      kind: comparison
      title: Identify the reader
      columns:
      - relation
      - reader
      - required privilege
      rows:
      - - revenue_by_location
        - finance_reader
        - select
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Successful creation alone does not define reader access.
    evidence:
    - src-1
    - src-2
    code:
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        {{ config(grants={"select": ["finance_reader"]}) }}
        select location_id, sum(revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }}
        group by location_id
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
  - id: grant
    title: Declare the intended grant
    explanation: |
      This config is a PostgreSQL-style SELECT example, subject to adapter support and permissions.
    state:
      kind: comparison
      title: Declare the intended grant
      columns:
      - configured privilege
      - recipient
      rows:
      - - select
        - finance_reader
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Access intent can be reviewed with the model.
    code:
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        {{ config(grants={"select": ["finance_reader"]}) }}
        select location_id, sum(revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }}
        group by location_id
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    evidence:
    - src-1
    - src-2
  - id: read
    title: Read the same trusted measure
    explanation: |
      Granting access does not change the rows or their definition.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Permissions and accounting are separate parts of delivering a useful model.
    evidence:
    - src-1
    - src-2
    code:
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        {{ config(grants={"select": ["finance_reader"]}) }}
        select location_id, sum(revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }}
        group by location_id
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
