id: '1.2'
label: v1.2
title: Grants as project configuration
lead: |
  Model grants can be declared in project configuration. Access to the location revenue table becomes part of the build definition.
problem_then: |
  A model may be correctly built but unavailable to the people who need to query it. Manually repeated grants can drift.
what_changed:
- id: change-1
  summary: Model-level grants configuration.
  introduced_in: 1.2.0
  adapter_constraints: Privileges, supported adapters and grant authority vary.
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Cross-database macros and ratio metric support.
  introduced_in: 1.2.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Declare the intended read access alongside the model.
technical_detail: |
  The illustrative reporting role must already exist, and the executing identity must be authorized to grant access. Supported privileges and reconciliation differ by adapter. Cross-database macros also move into Core.
milestones:
- id: 1.2.0
  kind: package
  date: '2022-07-26'
  precision: day
  title: First published package
  evidence:
  - src-2
