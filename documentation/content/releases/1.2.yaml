  intro:
    can_now:
    - Declare model grants alongside SQL.
    - Use Core’s newly included cross-database macros.
    scenario: |
      The finance reader needs access to the location revenue model. The shop makes that read-access intent part of the model configuration.
    outcome: |
      Separate the permission change from the unchanged revenue values.
