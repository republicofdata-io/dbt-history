  intro:
    can_now:
      - Put a label, called a tag, on a model, such as finance.
      - Run only the models that carry a given tag, instead of the whole project.
    scenario: >
      A change touches only the finance numbers. Waffle Shop wants to rebuild the two revenue models and
      nothing else. It tags both models finance and runs that slice, leaving the upstream models already in
      the warehouse untouched.
    outcome: |
      See the tag in the model, the command that selects by tag, and the revenue result that stays the same.
  title: |
    Demo: a tag lets Waffle Shop build only its finance models
