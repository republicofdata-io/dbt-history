id: '0.12'
label: v0.12
title: Faster and more selective runs
lead: |
  Tags make it easier to work on a purposeful subset of models. Relation caching also reduces repeated warehouse introspection.
problem_then: |
  As the project grows, rebuilding everything is often more work than a small edit needs.
what_changed:
- id: change-1
  summary: Relation caching speeds introspection.
  introduced_in: 0.12.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Model tags and selection by tag.
  introduced_in: 0.12.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Group the revenue models with a tag and select that group.
technical_detail: |
  Tags are selection metadata, not a claim that all dependencies are automatically selected. Relation caching is an internal improvement; no speed measurement is shown.
