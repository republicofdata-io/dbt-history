  intro:
    can_now:
    - Tag models and select the group by tag.
    - Let dbt reuse cached relation information instead of repeating some warehouse introspection.
    scenario: |
      A finance-only change should have a clear selection boundary. The shop labels its revenue models and runs that slice with existing upstream inputs.
    outcome: |
      Connect the tag configuration, selection command and unchanged revenue result.
