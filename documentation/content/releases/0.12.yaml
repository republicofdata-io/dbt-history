walkthrough:
  id: wt-0.12
  learning_objective: |
    Label two revenue models with a tag, then run just those models with one command.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: tag
      title: Put a finance tag on the revenue model
      explanation: |
        The screen shows the order_revenue model. The highlighted line 1 is a config call that gives the model the tag finance. Lines 2 and 3 are the ordinary SQL: revenue is payments minus refunds. A tag is just a label. It does not change what the model computes. The result panel shows that revenue_by_location carries the same tag in this prepared project.
      state:
        kind: comparison
        title: Models carrying the finance tag
        columns:
          - model
          - tag
        rows:
          -   - order_revenue
              - finance
          -   - revenue_by_location
              - finance
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        A tag is a label on a model that says which group it belongs to.
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            {{ config(tags=["finance"]) }}
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            {{ config(tags=["finance"]) }}
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
    - id: select
      title: Run only the models tagged finance
      explanation: |
        Both revenue models are shown with tag line 1 highlighted. The command file runs dbt run with a selection: only models tagged finance. The result panel lists the two models dbt would build. The models they read from, such as order_amounts, are not rebuilt. This example assumes they already exist in the warehouse from an earlier run.
      state:
        kind: comparison
        title: What the finance selection builds
        columns:
          - selection
          - models in this prepared slice
        rows:
          -   - tag:finance
              - order_revenue, revenue_by_location
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Selecting by tag tells dbt to build just the tagged models and skip the rest.
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            {{ config(tags=["finance"]) }}
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            {{ config(tags=["finance"]) }}
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt run --models tag:finance
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
    - id: answer
      title: The revenue numbers do not change
      explanation: >-
        Highlighted line 1 in both model files retains the finance tag. Their SQL is identical to the previous
        step: subtract refunds per order, then sum per location. The panel shows the same three rows and total
        of 12,500 cents after rebuilding just those two tagged models.
      state:
        kind: table
        title: Revenue by location after the finance-only run
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          -   - 1
              - Old Port
              - 4400
              - 1000
              - 3400
          -   - 2
              - Mile End
              - 4600
              - 300
              - 4300
          -   - 3
              - Riverside
              - 4800
              - 0
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Running only the finance slice gave the same revenue result as running everything.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            {{ config(tags=["finance"]) }}
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            {{ config(tags=["finance"]) }}
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
