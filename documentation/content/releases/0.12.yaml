walkthrough:
  id: wt-0.12
  learning_objective: |
    Select a named slice of the project.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: tag
    title: Label the revenue model
    explanation: |
      The tag expresses an editorial grouping in the shop project.
       The same tag is also assigned to revenue_by_location in this prepared project.
    state:
      kind: comparison
      title: Label the revenue model
      columns:
      - model
      - tag
      rows:
      - - order_revenue
        - finance
      - - revenue_by_location
        - finance
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Tags make selection intent readable.
    code:
    - language: sql
      filename: models/order_revenue.sql
      content: |
        {{ config(tags=["finance"]) }}
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      - 2
      - 3
    evidence:
    - src-1
    - src-2
  - id: select
    title: Select the finance slice
    explanation: |
      Assume required upstream relations already exist for this example.
    state:
      kind: comparison
      title: Select the finance slice
      columns:
      - selection
      - models in this prepared slice
      rows:
      - - tag:finance
        - order_revenue, revenue_by_location
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Selection controls the work requested.
    code:
    - language: sql
      filename: models/order_revenue.sql
      content: |
        {{ config(tags=["finance"]) }}
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      - 2
      - 3
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        {{ config(tags=["finance"]) }}
        select location_id, sum(revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }}
        group by location_id
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt run --models tag:finance
      highlight_lines:
      - 1
    evidence:
    - src-1
    - src-2
  - id: answer
    title: Keep the same accounting expectation
    explanation: |
      Selecting a subset does not redefine revenue.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Use dependency selection as needed when upstream models also change.
    evidence:
    - src-1
    - src-2
    code:
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
