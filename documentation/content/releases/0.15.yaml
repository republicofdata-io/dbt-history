      performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Ask dbt to reuse what it learned from the last read of the project, instead of reading every file
        again from scratch.
      - Ask dbt to print each run event as a line of JSON, so another program can read the log.
    scenario: >
      Someone edits the description of the revenue model. The SQL and the numbers do not change. Waffle Shop
      uses this small edit to show two things: dbt can skip re-reading unchanged files, and it can report what
      it did in a form that tools can parse.
    outcome: |
      Compare the two parser modes and the two log formats, without claiming a measured speedup.
  title: >
    Demo: change one description, and dbt can skip re-reading the whole project and report the run as
    machine-readable events
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
