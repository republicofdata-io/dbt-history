  intro:
    can_now:
    - Opt into reusing eligible earlier parsing work.
    - Request structured JSON logs for operational tools.
    scenario: |
      A description changes while the shop’s SQL and rows stay the same. The example separates parsing work from warehouse execution and shows how run events can be requested in a machine-readable form.
    outcome: |
      Compare parser settings and logging configuration without claiming a measured speedup.
