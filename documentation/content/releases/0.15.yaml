walkthrough:
  id: wt-0.15
  learning_objective: >
    See that dbt reads the project before it runs SQL, that it can reuse the earlier read, and that run output
    can be requested as structured JSON.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: project
      title: Edit only a description
      explanation: >
        Two files are shown. The YAML file, highlighted on lines 4, 6 and 7, holds the description of the
        revenue-by-location model and its revenue column. This is the only thing edited. The SQL file,
        highlighted on lines 3 to 5, is unchanged. The result panel lists what changed: the description was
        edited, the SQL and the data were not.
      state:
        kind: comparison
        title: What changed in this edit
        columns:
          - project area
          - prepared change
        rows:
          - - revenue_by_location description
            - edited
          - - business SQL
            - unchanged
          - - base fixture
            - unchanged
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        This edit changes the documentation, not the revenue number.
      evidence:
        - src-1
        - src-2
        - src-5
        - src-6
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
                columns:
                  - name: revenue_cents
                    description: Net successful payments after refunds.
          highlight_lines:
            - 4
            - 6
            - 7
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
    - id: parse
      title: Reuse the earlier read of the project
      explanation: >
        Before running any SQL, dbt reads every file in the project to learn the models and how they connect.
        dbt calls this parsing. The command file runs dbt with the partial-parse flag, which tells it to reuse
        the result of the last read for files that did not change. The YAML and SQL files are the same as in
        the previous step. The result panel compares the two modes: a full parse reads the whole project, a
        partial parse reuses what it can. How much it reuses depends on the project and the edit.
      state:
        kind: comparison
        title: Full parse compared with partial parse
        columns:
          - mode
          - behavior
        rows:
          - - full parsing
            - read the whole project
          - - partial parsing, opt-in
            - reuse eligible prior parse information
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        dbt reads the project before it runs SQL, and partial parsing lets it reuse the last read.
      evidence:
        - src-1
        - src-2
        - src-5
        - src-6
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
                columns:
                  - name: revenue_cents
                    description: Net successful payments after refunds.
          highlight_lines:
            - 4
            - 6
            - 7
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt --partial-parse run
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
    - id: events
      title: Print the run as machine-readable events
      explanation: >
        The command file runs dbt with the log format set to JSON. Each event in the run, such as a model
        starting or finishing, is printed as one line of JSON that another program can read. The YAML and SQL
        files are unchanged. The result panel describes what such events give an operator: the type of event
        and which model it belongs to. The revenue numbers still come from the model table, not the log. The
        panel describes the fields in words. It is not a copy of a real log.
      state:
        kind: comparison
        title: What JSON log events give an operator
        columns:
          - operational need
          - structured-event benefit
        rows:
          - - identify event type
            - machine-readable classification
          - - associate event with model
            - structured context
          - - read revenue
            - still query the model result
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        JSON logs make the run easier for tools to read, while the revenue result still lives in the model
        table.
      evidence:
        - src-1
        - src-2
        - src-5
        - src-6
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
                columns:
                  - name: revenue_cents
                    description: Net successful payments after refunds.
          highlight_lines:
            - 4
            - 6
            - 7
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt --log-format json run
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
