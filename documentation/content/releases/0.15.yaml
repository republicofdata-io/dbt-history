id: '0.15'
label: v0.15
title: Partial parsing and structured operations
lead: >
  Parsing can reuse earlier project work, and structured logs make runs easier to inspect programmatically.
  This is an operational release, not a new revenue formula.
problem_then: |
  Repeated project parsing adds overhead, while free-form logs are awkward for tools to consume.
what_changed:
  - id: change-1
    summary: Opt-in partial parsing; structured/JSON logging.
    introduced_in: 0.15.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Python 2 support dropped; improved snapshot/docs/RPC behavior.
    introduced_in: 0.15.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
in_practice: |
  Opt into partial parsing where suitable and use structured events for operational tooling.
technical_detail: >
  Partial parsing is opt-in at this point, not the later default. Python 2 support ends. No timing or original
  event payload is claimed in these prepared comparisons.
