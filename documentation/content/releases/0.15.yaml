walkthrough:
  id: wt-0.15
  learning_objective: |
    See why project preparation and observability matter.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: project
    title: Change one model
    explanation: |
      The example edit changes only a description attached to revenue.
    state:
      kind: comparison
      title: Change one model
      columns:
      - project area
      - prepared change
      rows:
      - - revenue_by_location description
        - edited
      - - business SQL
        - unchanged
      - - base fixture
        - unchanged
      result_status: null
      diagram: null
    takeaway: |
      Not every edit changes the business result.
  - id: parse
    title: Reuse eligible parse work
    explanation: |
      Exact invalidation depends on the project and change.
    state:
      kind: comparison
      title: Reuse eligible parse work
      columns:
      - mode
      - behavior
      rows:
      - - full parsing
        - read the whole project
      - - partial parsing, opt-in
        - reuse eligible prior parse information
      result_status: null
      diagram: null
    takeaway: |
      Parsing is a distinct stage from warehouse execution.
  - id: events
    title: Make operational output easier to consume
    explanation: |
      This table describes fields conceptually, not a fabricated JSON log.
    state:
      kind: comparison
      title: Make operational output easier to consume
      columns:
      - operational need
      - structured-event benefit
      rows:
      - - identify event type
        - machine-readable classification
      - - associate event with model
        - structured context
      - - read revenue
        - still query the model result
      result_status: null
      diagram: null
    takeaway: |
      Logs describe execution; they do not replace the data result.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt execution.
