walkthrough:
  id: wt-0.15
  learning_objective: >
    See that dbt reads the project before it runs SQL, that it can reuse the earlier read, and that run output
    can be requested as structured JSON.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: project
      title: Edit only a description
      explanation: |-
        Highlighted lines 4, 6 and 7 of schema.yml edit the model and column descriptions. Neither the business SQL nor the input rows change. The panel identifies this as a documentation-only edit.
      state:
        kind: comparison
        title: What changed in this edit
        columns:
          - project area
          - prepared change
        rows:
          -   - revenue_by_location description
              - edited
          -   - business SQL
              - unchanged
          -   - base fixture
              - unchanged
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        This edit changes the documentation, not the revenue number.
      evidence:
        - src-1
        - src-2
        - src-5
        - src-6
        - src-3
        - src-4
        - alignment-0-15-0
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
                columns:
                  - name: revenue_cents
                    description: Net successful payments after refunds.
          highlight_lines:
            - 4
            - 6
            - 7
          purpose: authored executable syntax; illustration only
    - id: parse
      title: Reuse the earlier read of the project
      explanation: >-
        Highlighted line 2 of the profile enables partial parsing, which reuses the earlier reading of unchanged
        project files. The command shows the equivalent global --partial-parse switch before run. The panel
        shows schema.yml read again and four unchanged SQL files reused, assuming a compatible saved parse
        from this project.
      state:
        kind: comparison
        title: Prepared file-reuse decision after the description edit
        columns:
          - file
          - parse action
        rows:
          -   - models/schema.yml
              - read again
          -   - models/orders.sql
              - reuse saved parse
          -   - models/order_amounts.sql
              - reuse saved parse
          -   - models/order_revenue.sql
              - reuse saved parse
          -   - models/revenue_by_location.sql
              - reuse saved parse
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        dbt reads the project before it runs SQL, and partial parsing lets it reuse the last read.
      evidence:
        - src-1
        - src-2
        - src-5
        - src-6
        - src-3
        - src-4
        - alignment-0-15-0
      code:
        - language: yaml
          filename: profiles.yml (global config excerpt)
          content: |
            config:
              partial_parse: true
          highlight_lines:
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt --partial-parse run
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
    - id: events
      title: Print the run as machine-readable events
      explanation: |-
        Highlighted lines 2 to 4 of json-format-example.json separate level, message and optional context into fields. This is an authored format excerpt, not a terminal log or a claim about an emitted event. The command puts --log-format json before run. The panel maps those fields to their meanings.
      state:
        kind: comparison
        title: Human text becomes readable fields (authored example)
        columns:
          - field
          - example meaning
        rows:
          -   - levelname
              - 'INFO: information'
          -   - message
              - text describing an event
          -   - extra
              - optional model context
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >-
        The JSON format gives tools named fields to read instead of one unstructured line.
      evidence:
        - src-1
        - src-2
        - src-5
        - src-6
        - src-3
        - src-4
        - alignment-0-15-0
      code:
        - language: json
          filename: reference/json-format-example.json (authored field excerpt)
          content: |
            {
              "levelname": "INFO",
              "message": "Example model event for revenue_by_location",
              "extra": {"model_name": "revenue_by_location"}
            }
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt --log-format json run
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
      - src-6
      - alignment-0-15-0
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The JSON panel is deliberately a field excerpt with authored message text, not synthetic terminal output or a complete LogMessage. Timestamp, process and thread fields are omitted, not invented. The per-file reuse assumes a valid prior cache and no environment/project-wide invalidation. Python 2 retirement stays in release context (src-1).
      review-0.15-02: Original 0.15.0 main.py confirms --log-format and --partial-parse are root flags before run. Keep this order and cite it. Evidence: src-1, src-2, src-3, src-4, src-5, src-6, alignment-0-15-0.
      historical-0.15-02: Python 2 retirement remains in the chapter’s release claims; not a walkthrough demonstration. Evidence: src-1, src-2, src-3, src-4, src-5, src-6, alignment-0-15-0.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Ask dbt to reuse what it learned from the last read of the project, instead of reading every file
        again from scratch.
      - Ask dbt to print each run event as a line of JSON, so another program can read the log.
    scenario: >
      Someone edits the description of the revenue model. The SQL and the numbers do not change. Jaffle Shop
      uses this small edit to show two things: dbt can skip re-reading unchanged files, and it can report
      what
      it did in a form that tools can parse.
    outcome: |-
      See the per-file parse decision and a labeled example of JSON fields, without a fabricated run log or speed claim.
  title: >-
    Demo: reuse unchanged project files and inspect the JSON log format
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
default_milestone: 0.15.0
