walkthrough:
  id: wt-0.11
  learning_objective: |
    Find the revenue definition and its upstream dependencies.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: meaning
    title: Write down the measure
    explanation: |
      The description makes the unit and refund treatment explicit.
    state:
      kind: table
      title: 'Order 1042: partial refund'
      columns:
      - order_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1042
        - Old Port
        - 1200
        - 200
        - 1000
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Documentation turns an implicit assumption into a visible definition.
    code:
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: order_revenue
            description: One row per order.
            columns:
              - name: revenue_cents
                description: Successful payments minus refunds, in cents.
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    evidence:
    - src-1
    - src-2
  - id: lineage
    title: Trace the inputs
    explanation: |
      Payments and refunds are aggregated before joining orders.
    state:
      kind: diagram
      title: Revenue lineage
      columns: []
      rows: []
      result_status: null
      diagram:
        nodes:
        - id: orders
          label: orders
        - id: payments
          label: payments_by_order
        - id: refunds
          label: refunds_by_order
        - id: revenue
          label: order_revenue
        edges:
        - from: orders
          to: revenue
        - from: payments
          to: revenue
        - from: refunds
          to: revenue
        highlight: []
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A reader can follow where the number came from.
    evidence:
    - src-1
    - src-2
    code:
    - language: sql
      filename: models/payments_by_order.sql
      content: |
        select order_id, sum(amount_cents) as payment_cents
        from {{ ref("payments") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/refunds_by_order.sql
      content: |
        select order_id, sum(amount_cents) as refund_cents
        from {{ ref("refunds") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select o.order_id, o.location_id,
            coalesce(p.payment_cents, 0) - coalesce(r.refund_cents, 0) as revenue_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
  - id: publish
    title: Generate project documentation
    explanation: |
      Commands are presented as historical examples; the app does not execute them.
    state:
      kind: comparison
      title: Generate project documentation
      columns:
      - artifact view
      - reader learns
      rows:
      - - model page
        - definition and columns
      - - lineage graph
        - upstream and downstream relationships
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Documentation becomes a project output.
    code:
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: revenue_by_location
            description: Payments minus refunds, in cents.
            columns:
              - name: revenue_cents
                description: Net successful payments after refunds.
      highlight_lines:
      - 4
      - 6
      - 7
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt docs generate
        dbt docs serve
      highlight_lines:
      - 1
      - 2
    evidence:
    - src-1
    - src-2
  evidence:
