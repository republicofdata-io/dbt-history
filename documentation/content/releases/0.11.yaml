    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Write a plain-English description of each model and each column in a YAML file next to the code.
      - Generate a website for the project that shows those descriptions.
      - 'See a lineage graph in that website: a picture of which models feed which.'
    scenario: >
      The revenue number is right, but a second analyst asks two questions: what exactly does revenue_cents
      mean, and which tables does it come from? Waffle Shop writes the refund rule as a description next to
      the column and generates documentation that shows the answer and the lineage.
    outcome: >
      Read the description, follow the SQL references that make up the lineage, and see what the generated
      documentation shows.
  title: |
    Demo: a written description and a lineage graph explain where the revenue number comes from
status: reviewed
