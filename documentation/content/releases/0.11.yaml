walkthrough:
  id: wt-0.11
  learning_objective: |
    Find the revenue definition and its upstream dependencies.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: meaning
    title: Write down the measure
    explanation: |
      The description makes the unit and refund treatment explicit.
    state:
      kind: table
      title: 'Order 1042: partial refund'
      columns:
      - order_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1042
        - Old Port
        - 1200
        - 200
        - 1000
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Documentation turns an implicit assumption into a visible definition.
    code:
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: order_revenue
            description: One row per order.
            columns:
              - name: revenue_cents
                description: Successful payments minus refunds, in cents.
      highlight_lines: []
    evidence:
    - src-1
    - src-2
  - id: lineage
    title: Trace the inputs
    explanation: |
      Payments and refunds are aggregated before joining orders.
    state:
      kind: diagram
      title: Revenue lineage
      columns: []
      rows: []
      result_status: null
      diagram:
        nodes:
        - id: orders
          label: orders
        - id: payments
          label: payments_by_order
        - id: refunds
          label: refunds_by_order
        - id: revenue
          label: order_revenue
        edges:
        - from: orders
          to: revenue
        - from: payments
          to: revenue
        - from: refunds
          to: revenue
        highlight: []
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A reader can follow where the number came from.
    evidence:
    - src-1
    - src-2
  - id: publish
    title: Generate project documentation
    explanation: |
      Commands are presented as historical examples; the app does not execute them.
    state:
      kind: comparison
      title: Generate project documentation
      columns:
      - artifact view
      - reader learns
      rows:
      - - model page
        - definition and columns
      - - lineage graph
        - upstream and downstream relationships
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Documentation becomes a project output.
    code:
    - language: shell
      filename: commands.sh
      content: |
        dbt docs generate
        dbt docs serve
      highlight_lines: []
    evidence:
    - src-1
    - src-2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
