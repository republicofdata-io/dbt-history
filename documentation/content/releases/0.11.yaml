  intro:
    can_now:
    - Write model and column descriptions in version 2 schema YAML.
    - Generate browsable project documentation with lineage.
    scenario: |
      The revenue calculation is correct, but another analyst needs to understand what the number means and where it came from. The shop documents the refund rule next to its column.
    outcome: |
      Read the definition and the SQL references behind the lineage graph.
