walkthrough:
  id: wt-0.11
  learning_objective: >
    Read a model description written next to the code, then follow the lineage graph to see which tables feed
    the revenue number.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: meaning
      title: Write down what the revenue column means
      explanation: >-
        Highlighted lines 6 and 7 of schema.yml name revenue_cents and define it as successful payments minus
        refunds, in cents. order_1042.sql is a plain query for inspecting an existing result, not a model. Its
        highlighted lines 2 and 5 select the amounts for order 1042. The panel makes the definition concrete:
        1,200 minus 200 equals 1,000 cents.
      state:
        kind: table
        title: One order that shows the refund rule
        columns:
          - order_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - 1042
            - Old Port
            - 1200
            - 200
            - 1000
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        The refund rule is now written next to the column it describes, so a reader does not have to guess it
        from the SQL.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: order_revenue
                description: One row per order.
                columns:
                  - name: revenue_cents
                    description: Successful payments minus refunds, in cents.
          highlight_lines:
            - 6
            - 7
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: inspection/order_1042.sql
          content: |
            select r.order_id, l.name as location,
                r.payment_cents, r.refund_cents, r.revenue_cents
            from jaffle.order_revenue as r
            join raw.locations as l on r.location_id = l.location_id
            where r.order_id = 1042
          highlight_lines:
            - 2
            - 5
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
    - id: lineage
      title: Follow the inputs behind the number
      explanation: >-
        Highlighted lines 5 to 7 of order_revenue link orders to the payment and refund totals. Each ref()
        records a dependency, meaning this model waits for that input. The diagram uses the same model names
        to show all three inputs feeding order_revenue. Their SQL doesn't need to be repeated to see those
        links.
      state:
        kind: diagram
        title: 'Lineage graph: what feeds order_revenue'
        columns: []
        rows: []
        result_status: null
        diagram:
          nodes:
            - id: orders
              label: orders
            - id: payments_by_order
              label: payments_by_order
            - id: refunds_by_order
              label: refunds_by_order
            - id: order_revenue
              label: order_revenue
          edges:
            - from: orders
              to: order_revenue
            - from: payments_by_order
              to: order_revenue
            - from: refunds_by_order
              to: order_revenue
          highlight: []
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        The lineage graph is built from the ref calls in the SQL, so it shows exactly which tables feed the
        revenue number.
      evidence:
        - src-1
        - src-2
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select o.order_id, o.location_id,
                coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents,
                coalesce(p.payment_cents, 0) - coalesce(r.refund_cents, 0) as revenue_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r on o.order_id = r.order_id
          highlight_lines:
            - 5
            - 6
            - 7
          purpose: authored executable syntax; illustration only
    - id: publish
      title: Generate the documentation website
      explanation: >-
        Highlighted lines 4, 6 and 7 of the schema file describe the revenue model and its revenue column. The
        command generates the documentation and opens it in a browser. The panel lists what that site
        contains: model descriptions, columns and a dependency graph from the project's ref() calls. The
        commands are historical examples; this app doesn't run them.
      state:
        kind: comparison
        title: What the generated documentation shows
        columns:
          - artifact view
          - reader learns
        rows:
          - - model page
            - definition and columns
          - - lineage graph
            - upstream and downstream relationships
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        One command turns the descriptions and ref links into a browsable website with a page per model and a
        lineage graph.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
                columns:
                  - name: revenue_cents
                    description: Net successful payments after refunds.
          highlight_lines:
            - 4
            - 6
            - 7
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt docs generate
            dbt docs serve
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      The documentation example deliberately retains a direct raw.locations join; that table is not a ref node
      in the displayed lineage. Each chapter is an independent prepared project slice, not a cumulative
      runnable checkout (src-1, docs lineage from ref dependencies).

      historical-0.11-01: Deliberately retain raw.locations in this standalone slice; the diagram only
      promises model ref dependencies and does not draw a seed edge. Evidence: src-1, src-2.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Write a plain-English description of each model and each column in a YAML file next to the code.
      - Generate a website for the project that shows those descriptions.
      - 'See a lineage graph in that website: a picture of which models feed which.'
    scenario: >
      The revenue number is right, but a second analyst asks two questions: what exactly does revenue_cents
      mean, and which tables does it come from? Jaffle Shop writes the refund rule as a description next to
      the column and generates documentation that shows the answer and the lineage.
    outcome: >
      Read the description, follow the SQL references that make up the lineage, and see what the generated
      documentation shows.
  title: |
    Demo: a written description and a lineage graph explain where the revenue number comes from
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
