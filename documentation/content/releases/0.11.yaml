id: '0.11'
label: v0.11
title: Generated documentation
lead: |
  Generated documentation and lineage make the project easier to navigate. The refund definition can live beside the column it describes.
problem_then: |
  A correct table is hard to trust when its meaning and dependencies live only in someone’s memory.
what_changed:
- id: change-1
  summary: Auto-generated project documentation and lineage.
  introduced_in: 0.11.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Schema YAML version 2 adds model/column descriptions.
  introduced_in: 0.11.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Document model and column meaning, then browse the generated project graph.
technical_detail: |
  Schema YAML version 2 introduces this richer documentation structure. Generated docs describe the project; they are not the later hosted Explorer/Catalog product.
milestones:
- id: 0.11.0
  kind: package
  date: '2018-09-06'
  precision: day
  title: First published package
  evidence:
  - src-2
sources:
