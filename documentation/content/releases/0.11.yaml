walkthrough:
  id: wt-0.11
  learning_objective: >
    Read a model description written next to the code, then follow the lineage graph to see which tables feed
    the revenue number.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: meaning
      title: Write down what the revenue column means
      explanation: >
        You are looking at a YAML file that describes a model. The highlighted lines 1 to 4 start a version 2
        schema file and name the order_revenue model with a one-line description. Below, lines 6 and 7
        describe the revenue_cents column: successful payments minus refunds, in cents. The result panel shows
        one order that makes the rule concrete. Order 1042 paid 1,200 cents, refunded 200, so revenue is
        1,000.
      state:
        kind: table
        title: One order that shows the refund rule
        columns:
          - order_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - 1042
            - Old Port
            - 1200
            - 200
            - 1000
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        The refund rule is now written next to the column it describes, so a reader does not have to guess it
        from the SQL.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: order_revenue
                description: One row per order.
                columns:
                  - name: revenue_cents
                    description: Successful payments minus refunds, in cents.
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
      evidence:
        - src-1
        - src-2
    - id: lineage
      title: Follow the inputs behind the number
      explanation: >
        Three model files are shown. The first two, highlighted on lines 1 and 2, add up payments and refunds
        per order. The third, highlighted on lines 3 to 5, joins orders to those two totals. Each ref call is
        a link from one model to the model it reads from. dbt collects those links into the lineage graph in
        the result panel: orders, payments and refunds all flow into order_revenue.
      state:
        kind: diagram
        title: 'Lineage graph: what feeds order_revenue'
        columns: []
        rows: []
        result_status: null
        diagram:
          nodes:
            - id: orders
              label: orders
            - id: payments
              label: payments_by_order
            - id: refunds
              label: refunds_by_order
            - id: revenue
              label: order_revenue
          edges:
            - from: orders
              to: revenue
            - from: payments
              to: revenue
            - from: refunds
              to: revenue
          highlight: []
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        The lineage graph is built from the ref calls in the SQL, so it shows exactly which tables feed the
        revenue number.
      evidence:
        - src-1
        - src-2
      code:
        - language: sql
          filename: models/payments_by_order.sql
          content: |
            select order_id, sum(amount_cents) as payment_cents
            from {{ ref("payments") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select o.order_id, o.location_id,
                coalesce(p.payment_cents, 0) - coalesce(r.refund_cents, 0) as revenue_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
    - id: publish
      title: Generate the documentation website
      explanation: >
        Three files are shown. The YAML file, highlighted on lines 4, 6 and 7, describes the
        revenue-by-location model and its revenue column. The SQL file, highlighted on lines 3 to 5, sums
        payments, refunds and revenue per location. The command file runs dbt docs generate, which builds the
        documentation site, and dbt docs serve, which opens it in a browser. The result panel lists what a
        reader finds there: a page per model with its description and columns, and a lineage graph. The
        commands are shown as historical examples. The app does not run them.
      state:
        kind: comparison
        title: What the generated documentation shows
        columns:
          - artifact view
          - reader learns
        rows:
          - - model page
            - definition and columns
          - - lineage graph
            - upstream and downstream relationships
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        One command turns the descriptions and ref links into a browsable website with a page per model and a
        lineage graph.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
                columns:
                  - name: revenue_cents
                    description: Net successful payments after refunds.
          highlight_lines:
            - 4
            - 6
            - 7
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt docs generate
            dbt docs serve
          highlight_lines:
            - 1
            - 2
      evidence:
        - src-1
        - src-2
