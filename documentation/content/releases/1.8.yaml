walkthrough:
  id: wt-1.8
  learning_objective: |
    See a controlled fixture catch an incorrect refund calculation.
  context: |
    Order 1042 at Old Port has a 1,200-cent payment and a 200-cent partial refund. Its correct revenue is 1,000 cents.
  dataset_variant: base
  steps:
  - id: refund
    title: The refund problem
    explanation: |
      Revenue must subtract the refund from the successful payment.
    state:
      kind: table
      title: 'Order 1042: partial refund'
      columns:
      - order_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1042
        - Old Port
        - 1200
        - 200
        - 1000
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The business expectation is 1,200 - 200 = 1,000 cents.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: models/order_amounts.sql
      content: |
        with paid as (
            select order_id, sum(amount_cents) as payment_cents
            from raw.payments group by order_id
        ), refunded as (
            select order_id, sum(amount_cents) as refund_cents
            from raw.refunds group by order_id
        )
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from raw.orders as o
        left join paid as p on o.order_id = p.order_id
        left join refunded as r on o.order_id = r.order_id
      highlight_lines:
      - 2
      - 5
      - 8
      - 9
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/order_1042.sql
      content: |
        select order_id, payment_cents, refund_cents,
            payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
        where order_id = 1042
      highlight_lines:
      - 2
      - 4
      purpose: authored executable syntax; illustration only
  - id: bug
    title: The calculation has a bug
    explanation: |
      The plus sign produces 1,400 cents for this order.
    state:
      kind: result
      title: Incorrect result
      columns:
      - order_id
      - expected_cents
      - actual_cents
      rows:
      - - 1042
        - 1000
        - 1400
      result_status: fail
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A plausible-looking query can apply the wrong business rule.
    code:
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select
            order_id,
            payment_cents + refund_cents as revenue_cents
        from {{ ref('order_amounts') }}
      highlight_lines:
      - 3
    - language: yaml
      filename: models/order_revenue.yml
      content: |
        version: 2
        unit_tests:
          - name: subtract_partial_refund
            model: order_revenue
            given:
              - input: ref('order_amounts')
                rows:
                  - {order_id: 1042, payment_cents: 1200, refund_cents: 200}
            expect:
              rows:
                - {order_id: 1042, revenue_cents: 1000}
      highlight_lines:
      - 8
      - 11
    evidence:
    - src-1
    - src-2
    - src-3
  - id: fixture
    title: Describe the case in YAML
    explanation: |
      The fixture supplies the input and the expected output for this model.
    state:
      kind: result
      title: Unit-test expectation
      columns:
      - order_id
      - payment_cents
      - refund_cents
      - expected_cents
      - actual_buggy_cents
      rows:
      - - 1042
        - 1200
        - 200
        - 1000
        - 1400
      result_status: fail
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A small fixture makes the failure easy to explain.
    code:
    - language: yaml
      filename: models/order_revenue.yml
      content: |
        version: 2
        unit_tests:
          - name: subtract_partial_refund
            model: order_revenue
            given:
              - input: ref('order_amounts')
                rows:
                  - {order_id: 1042, payment_cents: 1200, refund_cents: 200}
            expect:
              rows:
                - {order_id: 1042, revenue_cents: 1000}
      highlight_lines:
      - 8
      - 11
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select
            order_id,
            payment_cents + refund_cents as revenue_cents
        from {{ ref('order_amounts') }}
      highlight_lines:
      - 3
    evidence:
    - src-1
    - src-2
    - src-3
  - id: fixed
    title: Apply the corrected calculation
    explanation: |
      Subtracting the refund gives the expected result for the same input.
    state:
      kind: result
      title: Corrected unit-test illustration
      columns:
      - order_id
      - expected_cents
      - actual_cents
      rows:
      - - 1042
        - 1000
        - 1000
      result_status: pass
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The test protects the refund rule when the model changes again.
    code:
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select
            order_id,
            payment_cents - refund_cents as revenue_cents
        from {{ ref('order_amounts') }}
      highlight_lines:
      - 3
    - language: yaml
      filename: models/order_revenue.yml
      content: |
        version: 2
        unit_tests:
          - name: subtract_partial_refund
            model: order_revenue
            given:
              - input: ref('order_amounts')
                rows:
                  - {order_id: 1042, payment_cents: 1200, refund_cents: 200}
            expect:
              rows:
                - {order_id: 1042, revenue_cents: 1000}
      highlight_lines:
      - 8
      - 11
    evidence:
    - src-1
    - src-2
    - src-3
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
