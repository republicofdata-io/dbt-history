walkthrough:
  id: wt-1.8
  learning_objective: >
    See how a small, fixed set of input rows can prove a model's calculation right or wrong without building
    the whole project.
  context: >
    Order 1042 at Old Port has a 1,200-cent payment and a 200-cent partial refund. Its correct revenue is
    1,000 cents.
  dataset_variant: base
  steps:
    - id: refund
      title: What the right answer looks like
      explanation: >
        You are looking at the model that assembles each order's payment and refund totals. The highlighted
        lines sum payments and refunds per order and attach them to the order, using zero when there is none.
        The small query below it pulls out order 1042. The result panel shows the correct picture: 1,200 paid,
        200 refunded, 1,000 cents of revenue.
      state:
        kind: table
        title: Order 1042 with its partial refund
        columns:
          - order_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - 1042
            - Old Port
            - 1200
            - 200
            - 1000
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        Revenue for order 1042 must be 1,200 minus 200, or 1,000 cents. That is the rule the test will
        protect.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: sql
          filename: models/order_amounts.sql
          content: |
            with paid as (
                select order_id, sum(amount_cents) as payment_cents
                from raw.payments group by order_id
            ), refunded as (
                select order_id, sum(amount_cents) as refund_cents
                from raw.refunds group by order_id
            )
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from raw.orders as o
            left join paid as p on o.order_id = p.order_id
            left join refunded as r on o.order_id = r.order_id
          highlight_lines:
            - 2
            - 5
            - 8
            - 9
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: analyses/order_1042.sql
          content: |
            select order_id, payment_cents, refund_cents,
                payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
            where order_id = 1042
          highlight_lines:
            - 2
            - 4
          purpose: authored executable syntax; illustration only
    - id: bug
      title: A plus sign creeps in
      explanation: >
        The highlighted line in order_revenue now adds the refund instead of subtracting it. Below it is a
        unit test written in YAML. Its highlighted lines give one input row for order 1042 and one expected
        output row with revenue of 1,000 cents. The result panel compares expected to actual: the buggy model
        returns 1,400 cents, so the test fails.
      state:
        kind: result
        title: Test result on the buggy model
        columns:
          - order_id
          - expected_cents
          - actual_cents
        rows:
          - - 1042
            - 1000
            - 1400
        result_status: fail
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        A one-character mistake in the SQL gives a wrong answer, and a unit test with one row exposes it.
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select
                order_id,
                payment_cents + refund_cents as revenue_cents
            from {{ ref('order_amounts') }}
          highlight_lines:
            - 3
        - language: yaml
          filename: models/order_revenue.yml
          content: |
            version: 2
            unit_tests:
              - name: subtract_partial_refund
                model: order_revenue
                given:
                  - input: ref('order_amounts')
                    rows:
                      - {order_id: 1042, payment_cents: 1200, refund_cents: 200}
                expect:
                  rows:
                    - {order_id: 1042, revenue_cents: 1000}
          highlight_lines:
            - 8
            - 11
      evidence:
        - src-1
        - src-2
        - src-3
    - id: fixture
      title: How the test describes the case
      explanation: >
        This step reads the unit test file more slowly. The first highlighted line, under given, is the input
        row: order 1042, 1,200 cents paid, 200 refunded. The second highlighted line, under expect, is the row
        dbt should get back: 1,000 cents. dbt runs the model against only that one row, so no real data is
        needed. The result panel puts the input, the expected value and the buggy value side by side.
      state:
        kind: result
        title: Input row, expected row, buggy result
        columns:
          - order_id
          - payment_cents
          - refund_cents
          - expected_cents
          - actual_buggy_cents
        rows:
          - - 1042
            - 1200
            - 200
            - 1000
            - 1400
        result_status: fail
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        A unit test is a tiny worked example: this row in, that row out. It makes the failure easy to read.
      code:
        - language: yaml
          filename: models/order_revenue.yml
          content: |
            version: 2
            unit_tests:
              - name: subtract_partial_refund
                model: order_revenue
                given:
                  - input: ref('order_amounts')
                    rows:
                      - {order_id: 1042, payment_cents: 1200, refund_cents: 200}
                expect:
                  rows:
                    - {order_id: 1042, revenue_cents: 1000}
          highlight_lines:
            - 8
            - 11
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select
                order_id,
                payment_cents + refund_cents as revenue_cents
            from {{ ref('order_amounts') }}
          highlight_lines:
            - 3
      evidence:
        - src-1
        - src-2
        - src-3
    - id: fixed
      title: Restore the minus sign and the test passes
      explanation: >
        The highlighted line in order_revenue subtracts the refund again. The unit test is unchanged. The
        result panel shows the test now passing: expected 1,000 cents, actual 1,000 cents.
      state:
        kind: result
        title: Test result on the corrected model
        columns:
          - order_id
          - expected_cents
          - actual_cents
        rows:
          - - 1042
            - 1000
            - 1000
        result_status: pass
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        With the subtraction restored the test passes, and it will fail again if anyone breaks the refund rule
        later.
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select
                order_id,
                payment_cents - refund_cents as revenue_cents
            from {{ ref('order_amounts') }}
          highlight_lines:
            - 3
        - language: yaml
          filename: models/order_revenue.yml
          content: |
            version: 2
            unit_tests:
              - name: subtract_partial_refund
                model: order_revenue
                given:
                  - input: ref('order_amounts')
                    rows:
                      - {order_id: 1042, payment_cents: 1200, refund_cents: 200}
                expect:
                  rows:
                    - {order_id: 1042, revenue_cents: 1000}
          highlight_lines:
            - 8
            - 11
      evidence:
        - src-1
        - src-2
        - src-3
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
