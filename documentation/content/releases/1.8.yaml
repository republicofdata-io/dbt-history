    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - 'Write a unit test for a model: give it a few input rows and the rows you expect back.'
      - Run those tests quickly, without loading the real data.
      - Build every model with zero rows using the --empty flag, to check the SQL is valid before a full run.
    scenario: >
      Order 1042 at Old Port has a 1,200-cent payment and a 200-cent partial refund, so its revenue should be
      1,000 cents. Someone edits the revenue model and types a plus where a minus belongs. Revenue for that
      order jumps to 1,400 cents. A unit test with one input row catches the mistake.
    outcome: >
      See the correct expectation, the buggy model, the unit test that fails on it, and the same test passing
      once the minus sign is back.
  title: |
    Demo: a unit test catches a refund bug before a full build
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
default_milestone: 1.8.0
