    scenario: |
      Order 1042 has a 1,200-cent payment and a 200-cent refund. A plus sign mistakenly turns its correct 1,000-cent revenue into 1,400 cents.
    outcome: |
      See the model, fixture and expected rows catch the error, then pass after subtraction is restored.
