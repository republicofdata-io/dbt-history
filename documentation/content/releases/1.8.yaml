walkthrough:
  id: wt-1.8
  learning_objective: >
    See how a small, fixed set of input rows can prove a model's calculation right or wrong without building
    the whole project.
  context: >
    Order 1042 at Old Port has a 1,200-cent payment and a 200-cent partial refund. Its correct revenue is
    1,000 cents.
  dataset_variant: base
  steps:
    - id: refund
      title: What the right answer looks like
      explanation: >-
        order_1042.sql is an inspection query: a plain query under analyses that reads data without building a
        model. Highlighted line 2 subtracts refunds from payments; line 4 selects order 1042. The panel shows
        1,200 cents paid, 200 refunded and the correct 1,000-cent answer. That's the rule the unit test will
        protect.
      state:
        kind: table
        title: Order 1042 with its partial refund
        columns:
          - order_id
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - 1042
            - 1200
            - 200
            - 1000
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        Revenue for order 1042 must be 1,200 minus 200, or 1,000 cents. That is the rule the test will
        protect.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-empty
      code:
        - language: sql
          filename: analyses/order_1042.sql
          content: |
            select order_id, payment_cents, refund_cents,
                payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
            where order_id = 1042
          highlight_lines:
            - 2
            - 4
          purpose: authored executable syntax; illustration only
    - id: bug
      title: A plus sign creeps in
      explanation: >-
        Highlighted line 3 of order_revenue.sql adds refunds by mistake. Highlighted lines 8 and 11 of
        order_revenue.yml supply one test input and its expected 1,000-cent output. The command first builds
        zero-row upstream relations so dbt can inspect column types, then runs the unit test. The panel shows
        the incorrect 1,400-cent result and a failure.
      state:
        kind: result
        title: Test result on the buggy model
        columns:
          - order_id
          - expected_cents
          - actual_cents
        rows:
          - - 1042
            - 1000
            - 1400
        result_status: fail
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        A one-character mistake in the SQL gives a wrong answer, and a unit test with one row exposes it.
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select
                order_id,
                payment_cents + refund_cents as revenue_cents
            from {{ ref('order_amounts') }}
          highlight_lines:
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: yaml
          filename: models/order_revenue.yml
          content: |
            version: 2
            unit_tests:
              - name: subtract_partial_refund
                model: order_revenue
                given:
                  - input: ref('order_amounts')
                    rows:
                      - {order_id: 1042, payment_cents: 1200, refund_cents: 200}
                expect:
                  rows:
                    - {order_id: 1042, revenue_cents: 1000}
          highlight_lines:
            - 8
            - 11
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt run --empty --select +order_revenue
            dbt test --select test_type:unit
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-empty
    - id: fixture
      title: How the test describes the case
      explanation: >-
        Highlighted lines 8 and 11 of order_revenue.yml define one input row and one expected output. dbt
        substitutes that input when evaluating the model. The panel compares 1,000 cents expected with the
        1,400 returned by the buggy SQL on the previous screen. A warehouse connection and upstream schemas
        are still required; the earlier --empty build supplies the schemas without business rows.
      state:
        kind: result
        title: Input row, expected row, buggy result
        columns:
          - order_id
          - payment_cents
          - refund_cents
          - expected_cents
          - actual_buggy_cents
        rows:
          - - 1042
            - 1200
            - 200
            - 1000
            - 1400
        result_status: fail
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        A unit test is a tiny worked example: this row in, that row out. It makes the failure easy to read.
      code:
        - language: yaml
          filename: models/order_revenue.yml
          content: |
            version: 2
            unit_tests:
              - name: subtract_partial_refund
                model: order_revenue
                given:
                  - input: ref('order_amounts')
                    rows:
                      - {order_id: 1042, payment_cents: 1200, refund_cents: 200}
                expect:
                  rows:
                    - {order_id: 1042, revenue_cents: 1000}
          highlight_lines:
            - 8
            - 11
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-empty
    - id: fixed
      title: Restore the minus sign and the test passes
      explanation: >-
        Highlighted line 3 of order_revenue.sql restores subtraction. The command reruns the unchanged unit
        test from the previous screen. The panel now shows a pass: expected 1,000 cents, actual 1,000 cents.
      state:
        kind: result
        title: Test result on the corrected model
        columns:
          - order_id
          - expected_cents
          - actual_cents
        rows:
          - - 1042
            - 1000
            - 1000
        result_status: pass
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        With the subtraction restored the test passes, and it will fail again if anyone breaks the refund rule
        later.
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select
                order_id,
                payment_cents - refund_cents as revenue_cents
            from {{ ref('order_amounts') }}
          highlight_lines:
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt test --select test_type:unit
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-empty
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
      - alignment-empty
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      Unit tests need an adapter/warehouse and relation schemas for type discovery. --empty supplies zero-row
      model relations; it is not an offline engine. Raw source relations still have to exist. The
      order_amounts chain now consistently uses aggregate model refs. The selected unit_test command is
      test_type:unit, verified in the 1.8 upgrade reference (src-1).
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Write a unit test for a model with a few supplied input rows and expected output rows.
      - Test the model calculation with only the rows supplied in the unit test.
      - Build every model with zero rows using the --empty flag, to check the SQL is valid before a full run.
    scenario: >
      Order 1042 at Old Port has a 1,200-cent payment and a 200-cent partial refund, so its revenue should be
      1,000 cents. Someone edits the revenue model and types a plus where a minus belongs. Revenue for that
      order jumps to 1,400 cents. A unit test with one input row catches the mistake.
    outcome: >-
      See zero-row setup for warehouse column types, a one-row unit test fail, and the same test pass after
      restoring subtraction.
  title: |
    Demo: a unit test catches a refund bug before a full build
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
default_milestone: 1.8.0
