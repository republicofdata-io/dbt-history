id: '1.8'
label: v1.8
title: Native unit tests
lead: |
  Small input fixtures can test SQL logic before a full data build. A refund edge case becomes a focused unit test.
problem_then: |
  Tests over existing warehouse data can miss a case that has not arrived yet, or make the cause hard to isolate.
what_changed:
- id: unit-tests
  summary: Native SQL unit tests with controlled YAML fixtures.
  introduced_in: 1.8.0
  adapter_constraints: SQL model execution uses a supported target adapter; fixture/type limitations are adapter-specific.
  evidence:
  - src-1
  confidence: high
- id: empty
  summary: Schema-only --empty builds and independently evolving Core/adapter internals.
  introduced_in: 1.8.0
  adapter_constraints: --empty still connects to and executes on a database.
  evidence:
  - src-1
  confidence: high
in_practice: |
  The author specifies inputs and expected rows next to the model. A failure points directly to the business rule under test.
technical_detail: |
  Native SQL unit tests arrive in 1.8.0. They execute SQL through the target adapter; they are not an offline SQL validator. The fixture below isolates an existing order from the base data. --empty is also introduced here and still uses a database.
milestones:
