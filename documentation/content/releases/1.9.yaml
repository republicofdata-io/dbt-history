id: '1.9'
label: v1.9
title: Microbatch and simpler snapshots
lead: |
  Microbatch models process event-time windows. The shop can revisit a trading day when a late order arrives.
problem_then: |
  One large incremental query can make backfills and repairs hard to isolate.
what_changed:
- id: change-1
  summary: Microbatch incremental strategy and batch retry.
  introduced_in: 1.9.0
  adapter_constraints: Requires supported adapter and correctly configured event-time inputs; concurrency support
    varies.
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: YAML snapshots and new snapshot configuration.
  introduced_in: 1.9.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Define event time and batch policy, then reason about which windows need rebuilding.
technical_detail: |
  Microbatch execution and parallelism depend on adapter support and event-time configuration on inputs. This walkthrough is a logical batch comparison, not a runnable cross-adapter recipe. YAML snapshot definitions are another release feature.
