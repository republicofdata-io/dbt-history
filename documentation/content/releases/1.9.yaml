walkthrough:
  id: wt-1.9
  learning_objective: >
    See how a model split into daily batches can rebuild one past day when a late order arrives, without
    touching the other days.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is late-order. Each state below is an authored illustration.
  dataset_variant: late-order
  steps:
    - id: days
      title: Two trading days, before the late order
      explanation: >-
        This microbatch example assumes Snowflake with its matching 1.9 adapter. Highlighted lines 3 to 5
        of order_revenue.yml identify ordered_at as event time. Lines 1 to 4 of daily_revenue choose one batch
        per day and a one-day lookback. The day-total query produces the panel: 12,500 cents on March 8 and
        1,900 on March 9 before the late order.
      state:
        kind: comparison
        title: Revenue per day before the late order
        columns:
          - day
          - before late order revenue_cents
        rows:
          -   - '2016-03-08'
              - 12500
          -   - '2016-03-09'
              - 1900
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Each order lands in the batch for the day it happened, not the day it showed up in the database.
      evidence:
        - src-1
        - src-2
        - src-7
        - src-3
        - src-4
        - src-5
        - src-6
        - alignment-1-9-0
        - alignment-event-filter
      code:
        - language: yaml
          filename: models/order_revenue.yml
          content: |
            version: 2
            models:
              - name: order_revenue
                config:
                  event_time: ordered_at
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/daily_revenue.sql
          content: |
            {{ config(materialized="incremental",
                incremental_strategy="microbatch",
                event_time="ordered_at", batch_size="day",
                begin="2016-03-08", lookback=1) }}
            select order_id, location_id, ordered_at, revenue_cents
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: analyses/revenue_by_day.sql
          content: |
            select cast(ordered_at as date) as trading_day,
                sum(revenue_cents) as revenue_cents
            from {{ ref("daily_revenue") }}
            group by cast(ordered_at as date)
            order by trading_day
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
      data_context:
        dataset_variant: second-day
        phase: Existing daily_revenue before late order 1055 arrives.
    - id: late
      title: The late order belongs to March 8
      explanation: >-
        Highlighted lines 1 and 4 of the inspection query select order 1055 and its event day. The panel contrasts
        that March 8 event with its declared March 9 arrival, worth 600 cents. The supporting microbatch settings
        remain unchanged; the existing March 8 output has not yet included this order.
      state:
        kind: comparison
        title: 'Order 1055: event day versus arrival day'
        columns:
          - order_id
          - event_day
          - arrival_day
          - revenue_cents
        rows:
          -   - 1055
              - '2016-03-08'
              - '2016-03-09'
              - 600
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >-
        Order 1055 belongs to March 8. A March 9 run with lookback=1 would revisit it; the next step uses
        explicit bounds to demonstrate precise control.
      evidence:
        - src-1
        - src-2
        - src-7
        - src-3
        - src-4
        - src-5
        - src-6
        - alignment-1-9-0
        - alignment-event-filter
      code:
        - language: sql
          filename: analyses/late_order.sql
          content: |
            select order_id, cast(ordered_at as date) as event_day,
                revenue_cents
            from {{ ref("order_revenue") }}
            where order_id = 1055
          highlight_lines:
            - 1
            - 4
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: models/order_revenue.yml
          content: |
            version: 2
            models:
              - name: order_revenue
                config:
                  event_time: ordered_at
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/daily_revenue.sql
          content: |
            {{ config(materialized="incremental",
                incremental_strategy="microbatch",
                event_time="ordered_at", batch_size="day",
                begin="2016-03-08", lookback=1) }}
            select order_id, location_id, ordered_at, revenue_cents
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
            - 6
          purpose: authored executable syntax; illustration only
      data_context:
        dataset_variant: late-order
        phase: Upstream order_revenue has the late order; the batch target has not been repaired.
    - id: repair
      title: Rebuild only March 8
      explanation: >-
        Highlighted command line 2 refreshes the upstream order model. Lines 3 to 5 rebuild daily_revenue
        from March 8 up to, but not including, March 9. The supporting day-total and all-days queries produce
        the panel: March 8 rises to 13,100 cents, March 9 stays at 1,900, and the total reaches 15,000.
      state:
        kind: comparison
        title: Revenue per day after the repair
        columns:
          - day
          - after repair revenue_cents
        rows:
          -   - '2016-03-08'
              - 13100
          -   - '2016-03-09'
              - 1900
          -   - all days
              - 15000
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >
        Rebuilding the March 8 batch adds the 600 cents, leaves March 9 untouched and brings the total to
        15,000 cents.
      evidence:
        - src-1
        - src-2
        - src-7
        - src-3
        - src-4
        - src-5
        - src-6
        - alignment-1-9-0
        - alignment-event-filter
      code:
        - language: yaml
          filename: models/order_revenue.yml
          content: |
            version: 2
            models:
              - name: order_revenue
                config:
                  event_time: ordered_at
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/daily_revenue.sql
          content: |
            {{ config(materialized="incremental",
                incremental_strategy="microbatch",
                event_time="ordered_at", batch_size="day",
                begin="2016-03-08", lookback=1) }}
            select order_id, location_id, ordered_at, revenue_cents
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: analyses/revenue_by_day.sql
          content: |
            select cast(ordered_at as date) as trading_day,
                sum(revenue_cents) as revenue_cents
            from {{ ref("daily_revenue") }}
            group by cast(ordered_at as date)
            order by trading_day
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: analyses/all_days.sql
          content: |
            select sum(revenue_cents) as all_days_cents
            from {{ ref("daily_revenue") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            # First refresh order_revenue from the late-order fixture.
            dbt run --select +order_revenue
            dbt run --select daily_revenue \
              --event-time-start "2016-03-08" \
              --event-time-end "2016-03-09"
          highlight_lines:
            - 2
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
      data_context:
        dataset_variant: late-order
        phase: After refreshing the input and rebuilding the March 8 batch.
    - id: yaml_snapshot
      title: Define customer history in YAML
      explanation: Highlighted lines 2 and 4 define a snapshot directly in YAML and point it at
        customers_current. Lines 7 to 9 identify the row and its update timestamp. The supporting setup
        view supplies the declared customer-city-change timestamps. After observations before and after
        the move, the panel shows the same two customer versions, now configured without a SQL snapshot
        block.
      state:
        kind: table
        title: Prepared YAML snapshot history
        columns:
          - customer_id
          - city
          - dbt_valid_from
          - dbt_valid_to
        rows:
          -   - 1
              - Montréal
              - 2016-03-08 07:00
              - 2016-03-09 09:00
          -   - 1
              - Québec
              - 2016-03-09 09:00
              -
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: A YAML snapshot entry can preserve both customer versions using an existing model as its
        input.
      code:
        - language: yaml
          filename: snapshots/customers.yml
          content: |
            version: 2
            snapshots:
              - name: customers_history
                relation: ref("customers_current")
                config:
                  schema: snapshots
                  unique_key: customer_id
                  strategy: timestamp
                  updated_at: updated_at
          highlight_lines:
            - 2
            - 4
            - 7
            - 8
            - 9
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/customers_current.sql
          content: |
            select customer_id, name, city, updated_at
            from archive_input.customers
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: setup/archive_input.sql
          content: |
            create view archive_input.customers as
            select c.*, case
                when customer_id = 1 and city = 'Québec'
                  then cast('2016-03-09 09:00:00' as timestamp)
                else cast('2016-03-08 07:00:00' as timestamp)
            end as updated_at
            from raw.customers as c;
          highlight_lines:
            - 3
            - 4
            - 5
            - 6
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: inspection/customer_history.sql
          content: |
            select customer_id, city, dbt_valid_from, dbt_valid_to
            from jaffle_snapshots.customers_history
            where customer_id = 1 order by dbt_valid_from
          highlight_lines:
            - 1
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt run --select customers_current
            dbt snapshot
            # Apply customer-city-change, then refresh and snapshot again.
            dbt run --select customers_current
            dbt snapshot
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
            - 5
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - src-7
        - alignment-1-9-0
        - alignment-event-filter
      data_context:
        dataset_variant: customer-city-change
        phase: 'Separate snapshot example: observe the base customer before and after the declared city update;
          target schema jaffle.'
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
      - src-6
      - src-7
      - alignment-1-9-0
      - alignment-event-filter
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The added recipe targets Snowflake with a matching 1.9 adapter that implements microbatch. order_revenue must be refreshed from the selected fixture before the bounded repair; event_time is declared on that immediate input so automatic filtering applies. The March 8 repair ends at the exclusive March 9 boundary and leaves the existing March 9 batch intact.
      The end date is exclusive: the adapter event-time wrapper renders field >= start and field < end. With a March 9 clock and lookback=1, March 8 is already eligible; explicit bounds demonstrate control, not necessity. The snapshot step switches to the named customer-city-change variant and uses target.schema=jaffle, yielding jaffle_snapshots. Batch retry and later snapshot options are not demonstrated (alignment-1-9-0).
      review-1.9-02: Exclusive end verified: adapter relation wrapper uses >= start and < end. Keep March 9 as the exclusive boundary and cite the source. Evidence: src-1, src-2, src-3, src-4, src-5, src-6, src-7, alignment-1-9-0, alignment-event-filter.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Build a large model in batches, one per day, based on when each event happened.
      - Rebuild only the days affected by late data, by naming a start and end date on the command line.
      - Define snapshots, the tables that keep a history of changes, in YAML instead of SQL.
    scenario: >
      The shop has processed two trading days. Then a 600-cent order from the first day arrives late, during
      the second day. The daily revenue model needs to add it to March 8, not March 9, and it should not
      disturb the March 9 figures while doing so.
    outcome: >-
      See an explicitly bounded day rebuild bring revenue to 15,000 cents, then a YAML snapshot retain both
      customer cities.
  title: |-
    Demo: repair one trading day and define customer history in YAML
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
