walkthrough:
  id: wt-1.9
  learning_objective: |
    Repair a late order by revisiting its event-time day.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is late-order. Each state below is an authored illustration.
  dataset_variant: late-order
  steps:
  - id: days
    title: Separate the first two trading days
    explanation: |
      The late-order variant extends the second day and adds one late first-day order.
    state:
      kind: comparison
      title: Separate the first two trading days
      columns:
      - day
      - before late order revenue_cents
      rows:
      - - '2016-03-08'
        - 12500
      - - '2016-03-09'
        - 1900
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Batch boundaries follow event time, not arrival time.
    evidence:
    - src-1
    - src-2
    - src-7
    code:
    - language: yaml
      filename: models/order_revenue.yml
      content: |
        version: 2
        models:
          - name: order_revenue
            config:
              event_time: ordered_at
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/daily_revenue.sql
      content: |
        -- Fixture phase: Existing daily_revenue before late order 1055 arrives.
        {{ config(materialized="incremental",
            incremental_strategy="microbatch",
            event_time="ordered_at", batch_size="day",
            begin="2016-03-08", lookback=1) }}
        select order_id, location_id, ordered_at, revenue_cents
        from {{ ref("order_revenue") }}
      highlight_lines:
      - 2
      - 3
      - 4
      - 5
      - 7
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/revenue_by_day.sql
      content: |
        -- Fixture phase: Existing daily_revenue before late order 1055 arrives.
        select cast(ordered_at as date) as trading_day,
            sum(revenue_cents) as revenue_cents
        from {{ ref("daily_revenue") }}
        group by cast(ordered_at as date)
        order by trading_day
      highlight_lines:
      - 2
      - 3
      purpose: authored executable syntax; illustration only
    data_context:
      dataset_variant: second-day
      phase: Existing daily_revenue before late order 1055 arrives.
  - id: late
    title: Assign the late order to its original day
    explanation: |
      Order 1055 arrives on March 9 but belongs to March 8.
    state:
      kind: comparison
      title: Assign the late order to its original day
      columns:
      - order_id
      - event_day
      - arrival_day
      - revenue_cents
      rows:
      - - 1055
        - '2016-03-08'
        - '2016-03-09'
        - 600
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A lookback or explicit backfill must include the affected day.
    evidence:
    - src-1
    - src-2
    - src-7
    code:
    - language: yaml
      filename: models/order_revenue.yml
      content: |
        version: 2
        models:
          - name: order_revenue
            config:
              event_time: ordered_at
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/daily_revenue.sql
      content: |
        -- Fixture phase: Upstream order_revenue has the late order; the batch target has not been repaired.
        {{ config(materialized="incremental",
            incremental_strategy="microbatch",
            event_time="ordered_at", batch_size="day",
            begin="2016-03-08", lookback=1) }}
        select order_id, location_id, ordered_at, revenue_cents
        from {{ ref("order_revenue") }}
      highlight_lines:
      - 2
      - 3
      - 4
      - 5
      - 7
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/late_order.sql
      content: |
        -- Fixture phase: Upstream order_revenue has the late order; the batch target has not been repaired.
        select order_id, cast(ordered_at as date) as event_day,
            revenue_cents
        from {{ ref("order_revenue") }}
        where order_id = 1055
      highlight_lines:
      - 2
      - 5
      purpose: authored executable syntax; illustration only
    data_context:
      dataset_variant: late-order
      phase: Upstream order_revenue has the late order; the batch target has not been repaired.
  - id: repair
    title: Replace the affected batch result
    explanation: |
      Recomputing March 8 adds 600 cents without duplicating March 9.
    state:
      kind: comparison
      title: Replace the affected batch result
      columns:
      - day
      - after repair revenue_cents
      rows:
      - - '2016-03-08'
        - 13100
      - - '2016-03-09'
        - 1900
      - - all days
        - 15000
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The repaired location totals are 4,500, 5,700 and 4,800 cents.
    evidence:
    - src-1
    - src-2
    - src-7
    code:
    - language: yaml
      filename: models/order_revenue.yml
      content: |
        version: 2
        models:
          - name: order_revenue
            config:
              event_time: ordered_at
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/daily_revenue.sql
      content: |
        -- Fixture phase: After refreshing the input and rebuilding the March 8 batch.
        {{ config(materialized="incremental",
            incremental_strategy="microbatch",
            event_time="ordered_at", batch_size="day",
            begin="2016-03-08", lookback=1) }}
        select order_id, location_id, ordered_at, revenue_cents
        from {{ ref("order_revenue") }}
      highlight_lines:
      - 2
      - 3
      - 4
      - 5
      - 7
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/revenue_by_day.sql
      content: |
        -- Fixture phase: After refreshing the input and rebuilding the March 8 batch.
        select cast(ordered_at as date) as trading_day,
            sum(revenue_cents) as revenue_cents
        from {{ ref("daily_revenue") }}
        group by cast(ordered_at as date)
        order by trading_day
      highlight_lines:
      - 2
      - 3
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        # First refresh order_revenue from the late-order fixture.
        dbt run --select +order_revenue
        dbt run --select daily_revenue \
          --event-time-start "2016-03-08" \
          --event-time-end "2016-03-09"
      highlight_lines:
      - 2
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    data_context:
      dataset_variant: late-order
      phase: After refreshing the input and rebuilding the March 8 batch.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
