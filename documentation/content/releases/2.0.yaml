walkthrough:
  id: wt-2.0
  learning_objective: |
    Separate engine convergence, distribution choice and earlier SQL feedback.
  context: |
    The prepared order_revenue relation contains revenue_cents, not revenue_amount_cents. Waffle Shop base revenue remains 12,500 cents.
  dataset_variant: base
  steps:
  - id: distributions
    title: Choose the distribution
    explanation: |
      Full dbt and dbt OSS are distinct packages; this illustration makes no installer or timing claim.
    state:
      kind: comparison
      title: v2 choices
      columns:
      - distribution
      - licence category
      - SQL comprehension
      rows:
      - - dbt
        - Product Licensing Agreement
        - full features with documented access conditions
      - - dbt OSS
        - Apache 2.0 subset
        - not the proprietary SQL-comprehension feature set
      result_status: null
      diagram: null
    takeaway: |
      One engine story still has two distributions.
  - id: typo
    title: Reference a missing column
    explanation: |
      The model asks for a name absent from the upstream schema.
    state:
      kind: result
      title: Prepared schema mismatch
      columns:
      - requested_column
      - available_column
      - assessment
      rows:
      - - revenue_amount_cents
        - revenue_cents
        - missing column
      result_status: fail
      diagram: null
    takeaway: |
      This illustrates the kind of SQL problem the full engine can detect.
    code:
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select location_id, sum(revenue_amount_cents) as revenue_cents
        from {{ ref('order_revenue') }}
        group by location_id
      highlight_lines:
      - 1
  - id: correction
    title: Use the known column
    explanation: |
      With the model definition corrected, the same base fixture has the same business result.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
    takeaway: |
      Earlier feedback changes the workflow, not the revenue definition.
    code:
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select location_id, sum(revenue_cents) as revenue_cents
        from {{ ref('order_revenue') }}
        group by location_id
      highlight_lines:
      - 1
  - id: boundary
    title: Read the wider offering carefully
    explanation: |
      GA engine availability does not make every adjacent product GA.
    state:
      kind: comparison
      title: At the September 16 Summit
      columns:
      - offering
      - status
      rows:
      - - dbt v2
        - GA
      - - dbt State
        - GA
      - - Lake Compute
        - private beta in detailed announcement
      - - dbt Charts
        - public beta
      - - Fivetran Context Layer
        - private beta
      result_status: null
      diagram: null
    takeaway: |
      The catalogue and ecosystem tabs show the expanding footprint and its limits.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
    limitations: |
      All states are authored illustrations. No full/OSS engine was run and no diagnostic text is an original terminal log. SQL-comprehension behavior depends on the full distribution, login, metadata and supported adapter. No speed comparison is claimed.
default_milestone: summit-ga
