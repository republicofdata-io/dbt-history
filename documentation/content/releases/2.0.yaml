  intro:
    can_now:
    - Use the GA Rust engine through separate full dbt and dbt OSS distributions.
    - With full dbt and its documented access requirements, catch SQL column problems through SQL comprehension.
    scenario: |
      The location model asks for revenue_amount_cents, but its input contains revenue_cents. The example fixes that mismatch and distinguishes the engine release from adjacent products with different maturity.
    outcome: |
      Compare the distribution choices, inspect the column reference and retain the 12,500-cent business expectation.
