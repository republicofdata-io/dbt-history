walkthrough:
  id: wt-2.0
  learning_objective: |
    Separate engine convergence, distribution choice and earlier SQL feedback.
  context: |
    The prepared order_revenue relation contains revenue_cents, not revenue_amount_cents. Waffle Shop base revenue remains 12,500 cents.
  dataset_variant: base
  steps:
  - id: distributions
    title: Choose the distribution
    explanation: |
      Full dbt and dbt OSS are distinct packages; this illustration makes no installer or timing claim.
    state:
      kind: comparison
      title: v2 choices
      columns:
      - distribution
      - licence category
      - SQL comprehension
      rows:
      - - dbt
        - Product Licensing Agreement
        - full features with documented access conditions
      - - dbt OSS
        - Apache 2.0 subset
        - not the proprietary SQL-comprehension feature set
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      One engine story still has two distributions.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
    - src-6
    - src-7
    code:
