    limitations: >
      All states are authored illustrations. No full/OSS engine was run and no diagnostic text is an original
      terminal log. SQL-comprehension behavior depends on the full distribution, login, metadata and supported
      adapter. No speed comparison is claimed.

      The distribution requirements are alternative environments at the 2.0.2 September 15 checkpoint, never a
      combined installation instruction. reference/summit-availability.yml is the authored data behind the
      product-status comparison, not dbt project syntax or output. Product maturity comes from the cited
      announcement, not SQL execution.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Install the new Rust-based dbt v2 as either full dbt or the open-source dbt OSS.
      - With full dbt, get told about a column that does not exist before the query is sent to the database.
    scenario: >
      The location revenue model asks for a column called revenue_amount_cents, but the table it reads from
      has revenue_cents. The walkthrough shows the two distributions, the mistake, the fix, and where the new
      engine sits among the other products announced with it.
    outcome: >
      Compare the two distributions, watch the column mistake get caught and fixed, and confirm the base total
      is still 12,500 cents.
  title: |
    Demo: dbt v2 spots a misspelled column before the query runs
default_milestone: summit-ga
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
