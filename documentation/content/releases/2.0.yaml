id: '2.0'
label: v2.0
title: One engine, two distributions
lead: >
  The Rust engine becomes dbt v2. Its full distribution and open-source subset share a lineage but expose
  different capabilities.
problem_then: |
  Teams face two engine names and must understand when SQL mistakes will be detected.
what_changed:
  - id: rust-v2
    summary: Rust-based dbt v2 is distributed as full dbt and dbt OSS.
    introduced_in: 2.0.0
    adapter_constraints: GA adapter coverage differs from v1; PostgreSQL is coming soon in the Summit announcement.
    evidence:
      - src-1
    confidence: high
  - id: sql-comprehension
    summary: Full-distribution SQL comprehension supports earlier SQL feedback.
    introduced_in: 2.0.0
    adapter_constraints: Full distribution plus documented login/access and adapter requirements; not a dbt OSS promise.
    evidence:
      - src-2
      - src-5
    confidence: high
in_practice: >
  The full distribution can provide SQL comprehension, while dbt OSS contains the Apache-licensed subset. The
  shop still asks the same revenue question.
technical_detail: >
  Keep the September 14 artifact, September 15 naming change and September 16 GA announcement separate. Full
  SQL analysis has a documented login gate; do not attribute it to OSS or promise it works unauthenticated.
  DuckDB is a local target at GA; PostgreSQL is listed as coming soon. v1 remains maintained.
