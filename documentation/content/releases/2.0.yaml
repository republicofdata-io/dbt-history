walkthrough:
  id: wt-2.0
  learning_objective: >
    See the two ways to install dbt v2, and how the full version reads SQL closely enough to catch a missing
    column early.
  context: >
    The prepared order_revenue relation contains revenue_cents, not revenue_amount_cents. Jaffle Shop base
    revenue remains 12,500 cents.
  dataset_variant: base
  steps:
    - id: distributions
      title: Two ways to install one engine
      explanation: |-
        Highlighted line 1 of requirements-full.txt pins full dbt, while line 1 of requirements-oss.txt pins dbt-oss, both at 2.0.2. They belong in separate environments. This chapter assumes DuckDB, not PostgreSQL support. The panel distinguishes their licences and full dbt's SQL checks, which operate before execution under the documented login and metadata conditions.
      state:
        kind: comparison
        title: Full dbt versus dbt OSS
        columns:
          - distribution
          - licence category
          - SQL comprehension
        rows:
          -   - dbt
              - Product Licensing Agreement
              - full features with documented access conditions
          -   - dbt OSS
              - Apache 2.0 subset
              - not the proprietary SQL-comprehension feature set
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        One engine, two packages: full dbt with the SQL checks, and dbt OSS without them.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - src-7
        - alignment-static
      code:
        - language: text
          filename: requirements-full.txt
          content: |
            dbt==2.0.2
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: text
          filename: requirements-oss.txt
          content: |
            dbt-oss==2.0.2
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
    - id: typo
      title: Ask for a column that does not exist
      explanation: |-
        Highlighted line 1 of revenue_by_location requests revenue_amount_cents, while highlighted line 1 of order_revenue defines revenue_cents. The command compiles with full dbt's strict SQL analysis. It can reject the unresolved column before executing the model query in DuckDB. The panel compares requested and available names. Metadata lookup may still contact the database; no exact engine error text is fabricated.
      state:
        kind: result
        title: Missing column caught
        columns:
          - requested_column
          - available_column
          - assessment
        rows:
          -   - revenue_amount_cents
              - revenue_cents
              - missing column
        result_status: fail
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        Full dbt’s SQL analysis can catch the missing column during compilation, before executing the model query.
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select location_id, sum(revenue_amount_cents) as revenue_cents
            from {{ ref('order_revenue') }}
            group by location_id
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: dbt compile --select revenue_by_location --static-analysis strict
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - src-7
        - alignment-static
    - id: correction
      title: Use the real column name
      explanation: |-
        Highlighted line 1 of revenue_by_location now sums the real revenue_cents column. The panel shows 3,400, 4,300 and 4,800 cents, totalling 12,500. Earlier feedback changed how quickly the mistake was found, not what revenue means.
      state:
        kind: table
        title: Corrected query output
        columns:
          - location_id
          - revenue_cents
        rows:
          -   - 1
              - 3400
          -   - 2
              - 4300
          -   - 3
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        With the column name fixed, the model gives the base total of 12,500 cents.
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select location_id, sum(revenue_cents) as revenue_cents
            from {{ ref('order_revenue') }}
            group by location_id
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - src-7
        - alignment-static
    - id: boundary
      title: Not everything announced is finished
      explanation: |-
        Highlighted lines 3 to 7 of summit-availability.yml record the September 16 announcement. The panel shows dbt v2 and dbt State as generally available, Lake Compute and the Fivetran Context Layer in private beta, and dbt Charts in public beta. Generally available describes release maturity; it doesn't mean every feature is free or accessible without conditions.
      state:
        kind: comparison
        title: Product status at the September 16 Summit
        columns:
          - offering
          - status
        rows:
          -   - dbt v2
              - GA
          -   - dbt State
              - GA
          -   - Lake Compute
              - private beta in detailed announcement
          -   - dbt Charts
              - public beta
          -   - Fivetran Context Layer
              - private beta
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        The engine and State are generally available, while the three other listed offerings remain in their stated beta programs.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - src-7
        - alignment-static
      code:
        - language: yaml
          filename: reference/summit-availability.yml
          content: |
            as_of: "2026-09-16"
            products:
              - {name: dbt v2, maturity: ga}
              - {name: dbt State, maturity: ga}
              - {name: Lake Compute, maturity: beta, scope: private}
              - {name: dbt Charts, maturity: beta, scope: public}
              - {name: Fivetran Context Layer, maturity: beta, scope: private}
          highlight_lines:
            - 3
            - 4
            - 5
            - 6
            - 7
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
