        dbt==2.0.2
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: text
      filename: requirements-oss.txt
      content: |
        dbt-oss==2.0.2
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: dbt_project.yml
      content: |
        name: waffle_shop
        version: "1.0"
        config-version: 2
        model-paths: [models]
      highlight_lines:
      - 1
      - 3
      - 4
      purpose: authored executable syntax; illustration only
  - id: typo
    title: Reference a missing column
    explanation: |
      The model asks for a name absent from the upstream schema.
    state:
      kind: result
      title: Prepared schema mismatch
      columns:
      - requested_column
      - available_column
      - assessment
      rows:
      - - revenue_amount_cents
        - revenue_cents
        - missing column
      result_status: fail
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      This illustrates the kind of SQL problem the full engine can detect.
    code:
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select location_id, sum(revenue_amount_cents) as revenue_cents
        from {{ ref('order_revenue') }}
        group by location_id
      highlight_lines:
