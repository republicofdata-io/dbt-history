walkthrough:
  id: wt-2.0
  learning_objective: >
    See the two ways to install dbt v2, and how the full version reads SQL closely enough to catch a missing
    column early.
  context: >
    The prepared order_revenue relation contains revenue_cents, not revenue_amount_cents. Waffle Shop base
    revenue remains 12,500 cents.
  dataset_variant: base
  steps:
    - id: distributions
      title: Two ways to install one engine
      explanation: >
        You are looking at two install files and the project file. The highlighted line in each requirements
        file names a different package: dbt for the full distribution, dbt-oss for the open-source one. Both
        run the same Rust engine. The highlighted lines in dbt_project.yml are unchanged from before, which is
        the point: the project does not need rewriting. The result panel compares the two on licence and on
        SQL comprehension, the feature that reads SQL and checks it before it runs. Only the full distribution
        has it, and it comes with its own access conditions.
      state:
        kind: comparison
        title: Full dbt versus dbt OSS
        columns:
          - distribution
          - licence category
          - SQL comprehension
        rows:
          - - dbt
            - Product Licensing Agreement
            - full features with documented access conditions
          - - dbt OSS
            - Apache 2.0 subset
            - not the proprietary SQL-comprehension feature set
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        One engine, two packages: full dbt with the SQL checks, and dbt OSS without them.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - src-7
      code:
        - language: text
          filename: requirements-full.txt
          content: |
            dbt==2.0.2
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: text
          filename: requirements-oss.txt
          content: |
            dbt-oss==2.0.2
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: dbt_project.yml
          content: |
            name: waffle_shop
            version: "1.0"
            config-version: 2
            model-paths: [models]
          highlight_lines:
            - 1
            - 3
            - 4
          purpose: authored executable syntax; illustration only
    - id: typo
      title: Ask for a column that does not exist
      explanation: >
        The highlighted line sums revenue_amount_cents. The table it reads, order_revenue, has no such column.
        The real name is revenue_cents. The result panel shows what SQL comprehension can report: the column
        requested, the column available and the verdict, missing column. In earlier versions this mistake
        would only surface when the database rejected the query.
      state:
        kind: result
        title: Missing column caught
        columns:
          - requested_column
          - available_column
          - assessment
        rows:
          - - revenue_amount_cents
            - revenue_cents
            - missing column
        result_status: fail
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Full dbt can flag a missing column while reading the SQL, before anything runs in the database.
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select location_id, sum(revenue_amount_cents) as revenue_cents
            from {{ ref('order_revenue') }}
            group by location_id
          highlight_lines:
            - 1
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - src-7
    - id: correction
      title: Use the real column name
      explanation: >
        The highlighted line now sums revenue_cents. The result panel shows the base figures again: 3,400,
        4,300 and 4,800 cents, 12,500 in total. Earlier feedback changed how quickly the mistake was found,
        not what revenue means.
      state:
        kind: table
        title: Base revenue by location
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - 1
            - Old Port
            - 4400
            - 1000
            - 3400
          - - 2
            - Mile End
            - 4600
            - 300
            - 4300
          - - 3
            - Riverside
            - 4800
            - 0
            - 4800
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        With the column name fixed, the model gives the base total of 12,500 cents.
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select location_id, sum(revenue_cents) as revenue_cents
            from {{ ref('order_revenue') }}
            group by location_id
          highlight_lines:
            - 1
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - src-7
    - id: boundary
      title: Not everything announced is finished
      explanation: >
        The highlighted lines list the products announced alongside dbt v2 at the September 16 Summit, each
        with its maturity. The result panel reads them out. dbt v2 and dbt State are generally available,
        meaning released for everyone. Lake Compute, dbt Charts and the Fivetran Context Layer are still in
        beta. A finished engine does not make its neighbours finished too.
      state:
        kind: comparison
        title: Product status at the September 16 Summit
        columns:
          - offering
          - status
        rows:
          - - dbt v2
            - GA
          - - dbt State
            - GA
          - - Lake Compute
            - private beta in detailed announcement
          - - dbt Charts
            - public beta
          - - Fivetran Context Layer
            - private beta
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        dbt v2 is released for everyone, but three of the products announced with it are still in beta.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - src-7
      code:
        - language: yaml
          filename: reference/summit-availability.yml
          content: |
            as_of: "2026-09-16"
            products:
              - {name: dbt v2, maturity: ga}
              - {name: dbt State, maturity: ga}
              - {name: Lake Compute, maturity: beta, scope: private}
              - {name: dbt Charts, maturity: beta, scope: public}
              - {name: Fivetran Context Layer, maturity: beta, scope: private}
          highlight_lines:
            - 3
            - 4
            - 5
            - 6
            - 7
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
