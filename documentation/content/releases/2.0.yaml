    limitations: |
      All states are authored illustrations. No full/OSS engine was run and no diagnostic text is an original terminal log. SQL-comprehension behavior depends on the full distribution, login, metadata and supported adapter. No speed comparison is claimed.
      The distribution requirements are alternative environments at the 2.0.2 September 15 checkpoint, never a combined installation instruction. reference/summit-availability.yml is the authored data behind the product-status comparison, not dbt project syntax or output. Product maturity comes from the cited announcement, not SQL execution.
      The 2.0.2 distributions were published before the cutoff: full dbt on 2026-09-15 at 09:35:22 UTC and dbt-oss at 16:09:45 UTC (src-6, src-7 PyPI metadata). Full distribution licensing and the September 16 maturity statuses remain qualified by src-2, src-3 and src-5. The example now explicitly assumes DuckDB; the GA material did not promise PostgreSQL support. The final product-status step is deliberately retained as a short bridge to the catalogue/ecosystem, not as a SQL demo or proof of unrestricted access.
      The example explicitly requests --static-analysis strict after login. Baseline mode may surface findings as warnings; the prepared failure panel is not a promise about every default invocation (alignment-static).
      review-2.0-03: Confirmed both 2.0.2 PyPI uploads on September 15, the Product Licensing Agreement/Apache distinction, and Summit maturity levels. Kept access and beta qualifications. Evidence: src-1, src-2, src-3, src-4, src-5, src-6, src-7, alignment-static.
      historical-2.0-01: Confirmed both 2.0.2 PyPI uploads on September 15, the Product Licensing Agreement/Apache distinction, and Summit maturity levels. Kept access and beta qualifications. Evidence: src-1, src-2, src-3, src-4, src-5, src-6, src-7, alignment-static.
      historical-2.0-03: Retain the final product-status screen as an explicit short bridge to catalogue/ecosystem, not a dbt execution demo. Evidence: src-1, src-2, src-3, src-4, src-5, src-6, src-7, alignment-static.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Install the new Rust-based dbt v2 as either full dbt or the open-source dbt OSS.
      - With full dbt, get told about a column that does not exist before the query is sent to the
        database.
    scenario: >-
      This chapter assumes DuckDB, a supported target for the shown dbt v2 example. The location model asks
      for revenue_amount_cents, but its input has revenue_cents. The walkthrough compares the distributions,
      the full distribution’s pre-execution SQL check, the corrected result and the announcement’s product-status
      boundary.
    outcome: >
      Compare the two distributions, watch the column mistake get caught and fixed, and confirm the base total
      is still 12,500 cents.
  title: |
    Demo: dbt v2 spots a misspelled column before the query runs
default_milestone: summit-ga
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
