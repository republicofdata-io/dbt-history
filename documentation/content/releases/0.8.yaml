    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      Separate transactions are adapter behavior, not a user-written transaction toggle. The two model files
      and two-thread profile are the inputs to that behavior. No concurrency measurement or transaction log is
      fabricated.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Run models in parallel with each one wrapped in its own transaction, a bundle of database changes that
        either fully happens or is fully undone.
      - >-
        Change how a model is written to the warehouse by editing a macro, because materializations are now
        macros.
      - From patch 0.8.3, point the project at BigQuery.
    scenario: >
      Payments per order and refunds per order are independent work, so dbt runs them side by side. This
      chapter looks at what keeps them from interfering: each model's changes are committed on their own.
      Revenue still waits for both.
    outcome: >
      See two branches with separate transactions, and the revenue model that still waits for both before
      producing 12,500 cents.
  title: |
    Demo: each model gets its own database transaction, so parallel branches cannot trip each other up
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
