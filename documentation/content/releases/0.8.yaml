walkthrough:
  id: wt-0.8
  learning_objective: >
    Connect parallel builds with per-model transactions, and see why the combining step still waits for both
    inputs.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: independent
      title: Two totals that need nothing from each other
      explanation: >
        Highlighted lines 1 and 2 of payments_by_order total payments per order. The same lines of
        refunds_by_order total refunds. Neither reads the other. Highlighted lines 5 and 6 of the profile show
        a Redshift connection with 2 threads, so both can run at once. The result panel shows the size of each
        job: 13 payment rows grouped into 12 orders, and 3 refund rows grouped into 3 orders.
      state:
        kind: comparison
        title: Two independent totals
        columns:
          - model
          - source rows
          - grouped orders
        rows:
          - - payments_by_order
            - 13
            - 12
          - - refunds_by_order
            - 3
            - 3
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        The two totals read different tables, so dbt can build them at the same time.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
      code:
        - language: sql
          filename: models/payments_by_order.sql
          content: |
            select order_id, sum(amount_cents) as payment_cents
            from {{ ref("payments") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: profiles.yml (target excerpt)
          content: |
            waffle_shop:
              target: dev
              outputs:
                dev:
                  type: redshift
                  threads: 2
          highlight_lines:
            - 5
            - 6
          purpose: authored executable syntax; illustration only
    - id: transactions
      title: One transaction per model
      explanation: >
        The SQL is the same as in the last step. What changed is how dbt runs it. A transaction is a bundle of
        database changes that either all take effect or are all undone. From 0.8.0 each model gets its own, so
        a failure in refunds_by_order rolls back only refunds_by_order, and payments_by_order keeps its
        finished table. The result panel shows each model with its own transaction boundary.
      state:
        kind: comparison
        title: Each model commits on its own
        columns:
          - model
          - transaction boundary
        rows:
          - - payments_by_order
            - its own model transaction
          - - refunds_by_order
            - its own model transaction
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Each model commits or rolls back on its own, which is what makes running them side by side safe.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
      code:
        - language: sql
          filename: models/payments_by_order.sql
          content: |
            select order_id, sum(amount_cents) as payment_cents
            from {{ ref("payments") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: profiles.yml (target excerpt)
          content: |
            waffle_shop:
              target: dev
              outputs:
                dev:
                  type: redshift
                  threads: 2
          highlight_lines:
            - 5
            - 6
          purpose: authored executable syntax; illustration only
    - id: combine
      title: Revenue still waits for both
      explanation: >
        Highlighted lines 3, 4 and 6 of order_amounts join orders to both totals, so this model cannot start
        until both branches are done. Highlighted line 1 of order_revenue subtracts refunds from payments.
        Highlighted lines 3 to 5 of the location model add it all up. The result panel shows the usual 12,500
        cents across three locations.
      state:
        kind: table
        title: Revenue by location once both branches are done
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - 1
            - Old Port
            - 4400
            - 1000
            - 3400
          - - 2
            - Mile End
            - 4600
            - 300
            - 4300
          - - 3
            - Riverside
            - 4800
            - 0
            - 4800
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Running in parallel does not loosen the order of work; the join still waits for both inputs.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
      code:
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
