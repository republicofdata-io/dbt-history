id: '0.8'
label: v0.8
title: Concurrency and adapter growth
lead: |
  Concurrency becomes more reliable through per-model transactions. Materializations also move into macros, and BigQuery arrives in a later patch.
problem_then: |
  Scheduling parallel work is not enough when database transaction handling prevents useful concurrency.
what_changed:
- id: change-1
  summary: Per-model transactions and macro-based materializations.
  introduced_in: 0.8.0
  adapter_constraints: Transaction semantics remain adapter-dependent.
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: BigQuery support.
  introduced_in: 0.8.3
  adapter_constraints: BigQuery capability is added in this patch.
  evidence:
  - src-4
  confidence: high
in_practice: |
  Independent models get independent transaction boundaries.
technical_detail: |
  0.8.0 changes transaction handling and materialization internals. BigQuery support is 0.8.3, not the initial package. The diagram explains isolation without asserting a measured speedup.
milestones:
