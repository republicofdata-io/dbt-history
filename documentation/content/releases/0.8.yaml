walkthrough:
  id: wt-0.8
  learning_objective: >
    Connect parallel builds with per-model transactions, and see why the combining step still waits for both
    inputs.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: independent
      title: Two totals that need nothing from each other
      explanation: >
        Highlighted lines 1 and 2 of payments_by_order total payments per order. The same lines of
        refunds_by_order total refunds. Neither reads the other. Highlighted lines 5 and 6 of the profile
        show
        a Redshift connection with 2 threads, so both can run at once. The result panel shows the size of
        each
        job: 13 payment rows grouped into 12 orders, and 3 refund rows grouped into 3 orders.
      state:
        kind: comparison
        title: Two independent totals
        columns:
          - model
          - source rows
          - grouped orders
        rows:
          -   - payments_by_order
              - 13
              - 12
          -   - refunds_by_order
              - 3
              - 3
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The two totals read different tables, so dbt can build them at the same time.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-0-8-0
        - alignment-0-8-3
      code:
        - language: sql
          filename: models/payments_by_order.sql
          content: |
            select order_id, sum(amount_cents) as payment_cents
            from {{ ref("payments") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: profiles.yml (target excerpt)
          content: |
            jaffle_shop:
              target: dev
              outputs:
                dev:
                  type: redshift
                  threads: 2
          highlight_lines:
            - 5
            - 6
          purpose: authored executable syntax; illustration only
    - id: transactions
      title: One transaction per model
      explanation: >-
        Highlighted lines 5 and 6 of the profile select Redshift and two workers. Each SQL file is one independent
        model. The panel is an illustrative statement schedule: each worker begins, creates its model, and
        commits separately. The 0.8 release fixes shared-transaction behavior that had limited parallel work;
        these phases are not measured times or a captured log.
      state:
        kind: comparison
        title: Prepared transaction schedule, not a log
        columns:
          - phase
          - worker
          - model
          - statement
        rows:
          -   - 1
              - 1
              - payments_by_order
              - BEGIN
          -   - 1
              - 2
              - refunds_by_order
              - BEGIN
          -   - 2
              - 1
              - payments_by_order
              - CREATE model relation
          -   - 2
              - 2
              - refunds_by_order
              - CREATE model relation
          -   - 3
              - 1
              - payments_by_order
              - COMMIT
          -   - 3
              - 2
              - refunds_by_order
              - COMMIT
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        Each model commits separately, so one branch no longer shares the other branch’s transaction.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-0-8-0
        - alignment-0-8-3
      code:
        - language: yaml
          filename: profiles.yml (target excerpt)
          content: |
            jaffle_shop:
              target: dev
              outputs:
                dev:
                  type: redshift
                  threads: 2
          highlight_lines:
            - 5
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/payments_by_order.sql
          content: |
            select order_id, sum(amount_cents) as payment_cents
            from {{ ref("payments") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt run
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
    - id: combine
      title: Revenue still waits for both
      explanation: >
        Highlighted lines 3, 4 and 6 of order_amounts join orders to both totals, so this model cannot start
        until both branches are done. Highlighted line 1 of order_revenue subtracts refunds from payments.
        Highlighted lines 3 to 5 of the location model add it all up. The result panel shows the usual 12,500
        cents across three locations.
      state:
        kind: table
        title: Revenue by location once both branches are done
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          -   - 1
              - Old Port
              - 4400
              - 1000
              - 3400
          -   - 2
              - Mile End
              - 4600
              - 300
              - 4300
          -   - 3
              - Riverside
              - 4800
              - 0
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Running in parallel does not loosen the order of work; the join still waits for both inputs.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-0-8-0
        - alignment-0-8-3
      code:
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
    - id: bigquery
      title: '0.8.3: connect the project to BigQuery'
      explanation: Highlighted lines 5 to 8 select BigQuery, OAuth authentication, a project and a
        schema. In 0.8.3 the profile calls the BigQuery dataset schema, not dataset. The panel adds
        BigQuery to the three existing targets at this patch; no BigQuery execution is claimed.
      state:
        kind: comparison
        title: Targets after patch 0.8.3
        columns:
          - target
          - available
        rows:
          -   - Redshift
              - before 0.8.3
          -   - PostgreSQL
              - before 0.8.3
          -   - Snowflake
              - before 0.8.3
          -   - BigQuery
              - from 0.8.3
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: BigQuery joins the supported targets in 0.8.3, using that release’s schema field.
      code:
        - language: yaml
          filename: profiles.yml (BigQuery excerpt)
          content: |
            jaffle_shop:
              target: dev
              outputs:
                dev:
                  type: bigquery
                  method: oauth
                  project: jaffle-demo
                  schema: jaffle
                  threads: 2
          highlight_lines:
            - 5
            - 6
            - 7
            - 8
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-0-8-0
        - alignment-0-8-3
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - alignment-0-8-0
      - alignment-0-8-3
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      Separate transactions are adapter behavior, not a user-written transaction toggle. The two model files and two-thread profile are the inputs to that behavior. No concurrency measurement or transaction log is fabricated.
      The base has 13 payments across 12 orders because order 1043 has two payments. Transaction rows are explanatory phases, not native logs or a benchmark. Materializations being macros is release context only (src-1). BigQuery uses schema in the 0.8.3 contract; the suggested dataset key would be anachronistic.
      review-0.8-02: Fixture confirms 13 payment rows for 12 orders; order 1043 has two payments. Kept the count and documented why. Evidence: src-1, src-2, src-3, src-4, alignment-0-8-0, alignment-0-8-3.
      historical-0.8-02: Materializations-as-macros is retained in release context and removed from intro promises. Evidence: src-1, src-2, src-3, src-4, alignment-0-8-0, alignment-0-8-3.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Run models in parallel with each one wrapped in its own transaction, a bundle of database changes
        that
        either fully happens or is fully undone.
      - >-
        From patch 0.8.3, point the project at BigQuery.
    scenario: >
      Payments per order and refunds per order are independent work, so dbt runs them side by side. This
      chapter looks at what keeps them from interfering: each model's changes are committed on their own.
      Revenue still waits for both.
    outcome: >-
      See the independent transaction schedule and the BigQuery profile added in 0.8.3.
  title: |-
    Demo: give parallel models separate transactions, then add BigQuery
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
