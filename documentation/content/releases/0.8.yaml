walkthrough:
  id: wt-0.8
  learning_objective: |
    Connect concurrency with transaction boundaries.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: independent
    title: Identify separate aggregates
    explanation: |
      Both aggregates read money events, but neither needs the other.
    state:
      kind: comparison
      title: Identify separate aggregates
      columns:
      - model
      - source rows
      - grouped orders
      rows:
      - - payments_by_order
        - 13
        - 12
      - - refunds_by_order
        - 3
        - 3
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The two branches can make progress independently.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    code:
    - language: sql
      filename: models/payments_by_order.sql
      content: |
        select order_id, sum(amount_cents) as payment_cents
        from {{ ref("payments") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/refunds_by_order.sql
      content: |
        select order_id, sum(amount_cents) as refund_cents
        from {{ ref("refunds") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: profiles.yml (target excerpt)
      content: |
        waffle_shop:
          target: dev
          outputs:
            dev:
              type: redshift
              threads: 2
      highlight_lines:
      - 5
      - 6
      purpose: authored executable syntax; illustration only
  - id: transactions
    title: Give each model its transaction
    explanation: |
      This is a logical scheduling comparison.
    state:
      kind: comparison
      title: Give each model its transaction
      columns:
      - model
      - transaction boundary
      rows:
      - - payments_by_order
        - its own model transaction
      - - refunds_by_order
        - its own model transaction
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Transaction design makes concurrency meaningful.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    code:
    - language: sql
      filename: models/payments_by_order.sql
      content: |
        select order_id, sum(amount_cents) as payment_cents
        from {{ ref("payments") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/refunds_by_order.sql
      content: |
        select order_id, sum(amount_cents) as refund_cents
        from {{ ref("refunds") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: profiles.yml (target excerpt)
      content: |
        waffle_shop:
          target: dev
          outputs:
            dev:
              type: redshift
              threads: 2
      highlight_lines:
      - 5
      - 6
      purpose: authored executable syntax; illustration only
  - id: combine
    title: Wait before combining
    explanation: |
      The final model still waits for both aggregates.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Correct dependencies remain necessary even when branches run concurrently.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    code:
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
  evidence:
