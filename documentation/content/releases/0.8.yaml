    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      Separate transactions are adapter behavior, not a user-written transaction toggle. The two model files and two-thread profile are the inputs to that behavior. No concurrency measurement or transaction log is fabricated.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Give independently running models separate transaction boundaries.
    - Extend materialization behavior through macros.
    - From 0.8.3, target BigQuery.
    scenario: |
      The payment and refund aggregates are independent work. The example follows the SQL on each branch and the transaction boundaries that allow it to proceed separately.
    outcome: |
      See why parallel scheduling still waits for both inputs before producing revenue.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
