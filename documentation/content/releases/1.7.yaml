walkthrough:
  id: wt-1.7
  learning_objective: >
    See how dbt records the exact packages it installed, and how documentation can be generated as a single
    file to share.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: range
      title: 'An allowed version range and one resolved version'
      explanation: >-
        Highlighted lines 2 and 3 request dbt_utils from the package registry and allow versions from 1.1.0
        up to, but not including, 1.2.0. The panel contrasts that range with the prepared choice 1.1.1, a
        real release available by this chapter’s date. No registry resolution run is claimed.
      state:
        kind: comparison
        title: Request and prepared resolution
        columns:
          - package
          - allowed versions
          - chosen version
        rows:
          -   - dbt-labs/dbt_utils
              - '>=1.1.0, <1.2.0'
              - 1.1.1
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        A package request says what is allowed. It does not, by itself, say what was installed.
      evidence:
        - src-1
        - src-2
        - alignment-1-7-0
        - alignment-utils
      code:
        - language: yaml
          filename: packages.yml
          content: |
            packages:
              - package: dbt-labs/dbt_utils
                version: [">=1.1.0", "<1.2.0"]
          highlight_lines:
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
    - id: lock
      title: Write the lock file with dbt deps
      explanation: >-
        Highlighted line 3 of package-lock.yml records version 1.1.1. Line 4 is the request hash, computed
        here with dbt 1.7.0’s own hashing function. It lets dbt detect a changed request; it is not a checksum
        of the package download. The panel distinguishes the allowed range from the exact version subsequent
        installs retain.
      state:
        kind: comparison
        title: Two files, distinct version values
        columns:
          - file
          - version meaning
        rows:
          -   - packages.yml
              - 'allowed: >=1.1.0, <1.2.0'
          -   - package-lock.yml
              - 'prepared pin: 1.1.1'
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        dbt deps now writes a lock file, so every install of the project gets the same packages.
      code:
        - language: yaml
          filename: package-lock.yml (prepared resolution)
          content: |
            packages:
              - package: dbt-labs/dbt_utils
                version: 1.1.1
            sha1_hash: 8e960f4c4ea40b5053519db298fb731a42c67717
          highlight_lines:
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: yaml
          filename: packages.yml
          content: |
            packages:
              - package: dbt-labs/dbt_utils
                version: [">=1.1.0", "<1.2.0"]
          highlight_lines:
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt deps
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - alignment-1-7-0
        - alignment-utils
    - id: share
      title: Generate the docs as one file
      explanation: >-
        Highlighted lines 4, 6 and 7 of schema.yml provide the descriptions; lines 3 to 5 of the model total
        the amounts they describe. Highlighted command line 1 adds --static to docs generate. The panel identifies
        target/static_index.html, the single HTML file containing the definitions and model dependency picture.
      state:
        kind: comparison
        title: What the static docs contain
        columns:
          - command output
          - reader sees
        rows:
          -   - target/static_index.html
              - shop definitions and lineage
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The --static flag produces one documentation file that can be emailed or put on any web host.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
                columns:
                  - name: revenue_cents
                    description: Net successful payments after refunds.
          highlight_lines:
            - 4
            - 6
            - 7
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt docs generate --static
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - alignment-1-7-0
        - alignment-utils
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - alignment-1-7-0
      - alignment-utils
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The prepared lock pin is illustrative, not a captured dbt deps resolution. The request hash is verified by executing _create_sha1_hash with RegistryPackage(package="dbt-labs/dbt_utils", version=[">=1.1.0", "<1.2.0"], install_prerelease=False) in dbt-core 1.7.0, yielding 8e960f4c4ea40b5053519db298fb731a42c67717. This limited helper execution is not a warehouse runtime capture. Both locking and --static are present at 1.7.0 (alignment-1-7-0, alignment-utils).
      review-1.7-02: Both features verified at 1.7.0 in task/deps.py and task/generate.py. Lock resolution remains illustrative; only the request hash was computed with the actual versioned helper. Evidence: src-1, src-2, alignment-1-7-0, alignment-utils.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Keep a lock file, package-lock.yml, that records exactly which package versions were installed.
      - Get the same packages on every machine, because installs follow the lock file.
      - Generate the documentation site as a single HTML file that opens without a server.
    scenario: >
      The shop uses a shared package for common macros. It wants every teammate to install the same version
      of
      it. It also wants to send the project documentation to a colleague who cannot run a docs server. This
      walkthrough shows the files behind both.
    outcome: >-
      Compare a real package range with its prepared exact pin and request hash, then see the command that
      produces static_index.html.
  title: |
    Demo: a lock file pins packages, and docs ship as one HTML file
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
