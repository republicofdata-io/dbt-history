id: '1.7'
label: v1.7
title: Reproducible dependencies and shareable docs
lead: |
  Package locking makes resolved dependencies explicit. Static documentation is easier to share as a single generated file.
problem_then: |
  Two environments can resolve a package range differently, complicating review and reproduction.
what_changed:
- id: change-1
  summary: Package dependency locking and static documentation.
  introduced_in: 1.7.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Saved-query semantic metadata; configurable seed delimiters.
  introduced_in: 1.7.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Commit the dependency lock when appropriate, then share documentation without needing a docs server.
technical_detail: |
  package-lock.yml records resolved dependencies. Do not hand-author a fake checksum or claim a fictional package existed in 2023. The example is a workflow comparison; actual lock content is omitted.
