      - src-2
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      The local shared_shop dependency is authored teaching material; it must exist at the shown sibling path.
      dbt deps resolves the project’s declarations; no lock-file hash or historical public package version is
      invented.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Keep a lock file, package-lock.yml, that records exactly which package versions were installed.
      - Get the same packages on every machine, because installs follow the lock file.
      - Generate the documentation site as a single HTML file that opens without a server.
    scenario: >
      The shop uses a shared package for common macros. It wants every teammate to install the same version of
      it. It also wants to send the project documentation to a colleague who cannot run a docs server. This
      walkthrough shows the files behind both.
    outcome: >
      Read the package request, the command that writes the lock file and the command that produces a
      standalone docs page. No lock-file hashes are shown, because none were captured.
  title: |
    Demo: a lock file pins packages, and docs ship as one HTML file
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
