  intro:
    can_now:
    - Record resolved dependencies in package-lock.yml.
    - Generate a self-contained static documentation page.
    scenario: |
      The shop wants a repeatable dependency choice and documentation that can be shared without a docs server. The example shows the configuration behind both outputs.
    outcome: |
      Follow dependency resolution and static documentation generation without fabricating lock-file hashes.
