walkthrough:
  id: wt-1.7
  learning_objective: >
    See how dbt records the exact packages it installed, and how documentation can be generated as a single
    file to share.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: range
      title: 'Two ideas: what you asked for and what you got'
      explanation: >
        You are looking at two files. The highlighted lines in packages.yml ask for a package. Here it is a
        local folder called shared_shop, standing in for any shared package. The highlighted lines in the
        package's own project file show its name and config version. The result panel separates two ideas: the
        request written in packages.yml, and the exact version dbt settles on when it installs.
      state:
        kind: comparison
        title: Request versus resolution
        columns:
          - concept
          - meaning
        rows:
          - - requested dependency
            - allowed package/version specification
          - - resolved dependency
            - specific version selected by dependency resolution
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        A package request says what is allowed. It does not, by itself, say what was installed.
      evidence:
        - src-1
        - src-2
      code:
        - language: yaml
          filename: packages.yml
          content: |
            packages:
              - local: ../shared_shop
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: ../shared_shop/dbt_project.yml
          content: |
            name: shared_shop
            version: "1.0"
            config-version: 2
            macro-paths: [macros]
          highlight_lines:
            - 1
            - 3
          purpose: authored executable syntax; illustration only
    - id: lock
      title: Write the lock file with dbt deps
      explanation: >
        The package files are unchanged. The new line is the highlighted command, dbt deps. It installs the
        packages and writes package-lock.yml next to packages.yml. The result panel shows the two files and
        their jobs: packages.yml holds the request, package-lock.yml holds the exact result. Commit both, and
        the next install matches this one.
      state:
        kind: comparison
        title: Two files, two jobs
        columns:
          - project file
          - purpose
        rows:
          - - packages.yml
            - requested dependencies
          - - package-lock.yml
            - resolved dependency record
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        dbt deps now writes a lock file, so every install of the project gets the same packages.
      code:
        - language: yaml
          filename: packages.yml
          content: |
            packages:
              - local: ../shared_shop
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: ../shared_shop/dbt_project.yml
          content: |
            name: shared_shop
            version: "1.0"
            config-version: 2
            macro-paths: [macros]
          highlight_lines:
            - 1
            - 3
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt deps
          highlight_lines:
            - 1
      evidence:
        - src-1
        - src-2
    - id: share
      title: Generate the docs as one file
      explanation: >
        The highlighted lines in schema.yml are the descriptions that will appear in the documentation. The
        highlighted lines in the model are the totals they describe. The highlighted command, dbt docs
        generate with the --static flag, builds the documentation as a single HTML file. The result panel
        shows what a reader gets: the shop's definitions and the links between models, with no server to run.
      state:
        kind: comparison
        title: What the static docs contain
        columns:
          - command output
          - reader sees
        rows:
          - - static documentation HTML
            - shop definitions and lineage
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        The --static flag produces one documentation file that can be emailed or put on any web host.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
                columns:
                  - name: revenue_cents
                    description: Net successful payments after refunds.
          highlight_lines:
            - 4
            - 6
            - 7
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt docs generate --static
          highlight_lines:
            - 1
      evidence:
        - src-1
        - src-2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
