walkthrough:
  id: wt-1.7
  learning_objective: |
    See how a project becomes easier to reproduce and share.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: range
    title: Separate request from resolution
    explanation: |
      The fictional shared shop package stands for a dependency in this example.
    state:
      kind: comparison
      title: Separate request from resolution
      columns:
      - concept
      - meaning
      rows:
      - - requested dependency
        - allowed package/version specification
      - - resolved dependency
        - specific version selected by dependency resolution
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A version range is not an exact resolved environment.
    evidence:
    - src-1
    - src-2
    code:
    - language: yaml
      filename: packages.yml
      content: |
        packages:
          - local: ../shared_shop
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: ../shared_shop/dbt_project.yml
      content: |
        name: shared_shop
        version: "1.0"
        config-version: 2
        macro-paths: [macros]
      highlight_lines:
      - 1
      - 3
      purpose: authored executable syntax; illustration only
  - id: lock
    title: Record the resolved dependencies
    explanation: |
      dbt deps creates or updates the lock file as appropriate.
    state:
      kind: comparison
      title: Record the resolved dependencies
      columns:
      - project file
      - purpose
      rows:
      - - packages.yml
        - requested dependencies
      - - package-lock.yml
        - resolved dependency record
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Review the lock when dependency resolution changes.
    code:
    - language: yaml
      filename: packages.yml
      content: |
        packages:
          - local: ../shared_shop
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: ../shared_shop/dbt_project.yml
      content: |
        name: shared_shop
        version: "1.0"
        config-version: 2
        macro-paths: [macros]
      highlight_lines:
      - 1
      - 3
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt deps
      highlight_lines:
      - 1
    evidence:
    - src-1
    - src-2
  - id: share
    title: Generate static documentation
    explanation: |
      The output can be shared as project documentation, subject to its contents.
    state:
      kind: comparison
      title: Generate static documentation
      columns:
      - command output
      - reader sees
      rows:
      - - static documentation HTML
        - shop definitions and lineage
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Documentation can travel without a running docs server.
    code:
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: revenue_by_location
            description: Payments minus refunds, in cents.
            columns:
              - name: revenue_cents
                description: Net successful payments after refunds.
      highlight_lines:
      - 4
      - 6
      - 7
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt docs generate --static
      highlight_lines:
      - 1
    evidence:
    - src-1
    - src-2
