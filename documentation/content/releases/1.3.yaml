  intro:
    can_now:
    - Build Python models inside the dbt graph on supported adapters.
    - Use supported incremental materializations for Python models.
    scenario: |
      The shop passes a defined SQL dataset into a small Python dataframe model. The selected columns and accounting values stay the same.
    outcome: |
      Read the SQL input and Snowpark-shaped Python model with its adapter boundary visible.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
