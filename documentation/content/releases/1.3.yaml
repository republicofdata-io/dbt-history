walkthrough:
  id: wt-1.3
  learning_objective: >
    See a model written in Python sit in the same chain as the SQL models, reading from one and producing the
    same numbers.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: input
      title: The SQL model that the Python model will read
      explanation: >-
        Highlighted line 1 of order_revenue subtracts refunds from payments supplied by order_amounts.
        order_1042.sql is an inspection query: a plain query under analyses that reads data without building a
        model. Its highlighted lines 2 and 4 work through order 1042. The panel shows 1,200 cents paid, 200
        refunded and 1,000 net, the value the Python model will receive.
      state:
        kind: table
        title: Order 1042 before the Python model
        columns:
          - order_id
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - 1042
            - 1200
            - 200
            - 1000
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        Before any Python runs, net revenue per order is already defined in SQL, and order 1042 is worth 1,000
        cents.
      evidence:
        - src-1
        - src-2
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: analyses/order_1042.sql
          content: |
            select order_id, payment_cents, refund_cents,
                payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
            where order_id = 1042
          highlight_lines:
            - 2
            - 4
          purpose: authored executable syntax; illustration only
    - id: python
      title: A four-line Python model
      explanation: >-
        Highlighted line 1 of python_order_revenue.py defines the model function that dbt calls. Line 2 stores
        its output as a table; line 3 reads order_revenue using dbt.ref, recording the dependency. Line 4
        returns order_id and revenue_cents. The panel shows those two columns and the SQL model they came
        from.
      state:
        kind: comparison
        title: Two columns kept, read from order_revenue
        columns:
          - selected columns
          - source
        rows:
          - - order_id, revenue_cents
            - order_revenue
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        The Python model reads a SQL model through the same ref mechanism, so dbt places it in the chain like
        any other model.
      code:
        - language: python
          filename: models/python_order_revenue.py
          content: |
            def model(dbt, session):
                dbt.config(materialized="table")
                orders = dbt.ref("order_revenue")
                return orders.select("order_id", "revenue_cents")
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
    - id: scope
      title: Same numbers, and a note on which warehouses can run it
      explanation: >-
        python_totals.sql checks the output of the Python model from the previous screen. Highlighted line 1
        sums revenue, and line 4 selects order 1042. The panel shows 1,000 cents for that order and 12,500
        across all 12 orders. This example assumes Snowflake's Snowpark Python engine; a warehouse without
        Python support can't run the model.
      state:
        kind: comparison
        title: Values unchanged; runs on Snowflake with Snowpark
        columns:
          - check
          - expected
        rows:
          - - order 1042 revenue_cents
            - 1000
          - - all 12 orders total_cents
            - 12500
          - - example adapter
            - Snowflake / Snowpark
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        The Python model changed no values, but it only works on a warehouse that can run Python.
      evidence:
        - src-1
        - src-2
      code:
        - language: sql
          filename: inspection/python_totals.sql
          content: |
            select sum(revenue_cents) as total_cents
            from python_order_revenue;
            select order_id, revenue_cents from python_order_revenue
            where order_id = 1042;
          highlight_lines:
            - 1
            - 4
          purpose: authored executable syntax; illustration only
    - id: metric
      title: 'Also new: define revenue as a metric'
      explanation: >
        Highlighted lines 5 to 8 of metrics.yml declare a metric named revenue on the order_revenue model: a
        sum (the calculation_method), of revenue_cents (the expression), by day or month over ordered_at,
        sliceable by location. In v1.3 these property names replaced the earlier type and sql. The panel shows
        what the definition promises for the base day: 12,500 cents in total, 3,400, 4,300 and 4,800 by
        location. Querying it in 2022 needed the dbt_metrics package or the hosted Semantic Layer, which
        entered public preview that October.
      code:
        - language: yaml
          filename: models/metrics.yml
          content: |
            version: 2
            metrics:
              - name: revenue
                label: Revenue
                model: ref('order_revenue')
                calculation_method: sum
                expression: revenue_cents
                timestamp: ordered_at
                time_grains: [day, month]
                dimensions: [location_id]
          highlight_lines:
            - 5
            - 6
            - 7
            - 8
          purpose: authored 1.3-era metric definition; illustration only
      state:
        kind: comparison
        title: What the revenue metric would report for the base day
        columns:
          - grain
          - location
          - revenue_cents
        rows:
          - - day 2016-03-08
            - all
            - 12500
          - - day 2016-03-08
            - Old Port
            - 3400
          - - day 2016-03-08
            - Mile End
            - 4300
          - - day 2016-03-08
            - Riverside
            - 4800
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values, not a Semantic Layer query result
      takeaway: >
        The revenue rule now exists as a named metric the project can serve to other tools, the first shape of
        the Semantic Layer.
      evidence:
        - src-sl-1
        - src-sl-2
        - src-sl-3
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-sl-1
      - src-sl-2
      - src-sl-3
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      The base fixture contains exactly 12 orders; the two payments on order 1043 do not add an order.
      Snowpark select(column-name strings) is the Snowflake recipe shown. No Python-on-Postgres execution or
      historical capture is claimed (src-1).

      review-1.3-01: Confirmed exactly 12 base orders and kept the result; it remains a Snowflake/Snowpark
      illustration, not a captured Python run. Evidence: src-1, src-2.

      historical-1.3-01: Confirmed exactly 12 base orders and kept the result; it remains a Snowflake/Snowpark
      illustration, not a captured Python run. Evidence: src-1, src-2.

      historical-1.3-02: Retain the Snowpark string-column select recipe and its explicit Snowflake
      restriction. Evidence: src-1, src-2. The metric step shows a definition in the v1.3 property names; no
      metric query was executed, and the values are the fixture's base-day totals.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Write a model in Python instead of SQL, on warehouses that can run Python, such as Snowflake.
      - Have that Python model read from a SQL model and be read by others, exactly like any other model.
      - >-
        Define revenue as a metric in YAML, with its calculation, time grain and dimensions, in the shape the
        Semantic Layer serves.
    scenario: >
      The shop has its net revenue per order in a SQL model. It adds a small Python model that reads that
      result, keeps two columns, and returns them unchanged. The values must stay the same. The point is to
      show the Python file is just another link in the chain, and that it only runs on a warehouse that
      supports Python.
    outcome: >
      The walkthrough shows the SQL input, the Python model, and a check that order 1042 and the 12,500-cent
      total come through untouched. Then see the revenue rule written once more, this time as a metric
      definition rather than a model.
  title: |
    Demo: a Python model reads a SQL model and gives the same totals, and revenue is defined once as a metric
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
