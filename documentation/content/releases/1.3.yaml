walkthrough:
  id: wt-1.3
  learning_objective: |
    Recognize a Python model as another graph node.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: input
    title: Start from the SQL model
    explanation: |
      The input is the derived order_revenue relation.
    state:
      kind: table
      title: 'Order 1042: partial refund'
      columns:
      - order_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1042
        - Old Port
        - 1200
        - 200
        - 1000
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Python receives a defined upstream dataset.
    evidence:
    - src-1
    - src-2
    code:
    - language: sql
      filename: models/order_amounts.sql
      content: |
        with paid as (
            select order_id, sum(amount_cents) as payment_cents
            from raw.payments group by order_id
        ), refunded as (
            select order_id, sum(amount_cents) as refund_cents
            from raw.refunds group by order_id
        )
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from raw.orders as o
        left join paid as p on o.order_id = p.order_id
        left join refunded as r on o.order_id = r.order_id
      highlight_lines:
      - 2
      - 5
      - 8
      - 9
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/order_1042.sql
      content: |
        select order_id, payment_cents, refund_cents,
            payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
        where order_id = 1042
      highlight_lines:
      - 2
      - 4
      purpose: authored executable syntax; illustration only
  - id: python
    title: Add a simple dataframe step
    explanation: |
      The example selects the order key and net revenue without changing either.
    state:
      kind: comparison
      title: Add a simple dataframe step
      columns:
      - selected columns
      - source
      rows:
      - - order_id, revenue_cents
        - order_revenue
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The ref call keeps the dependency explicit.
    code:
    - language: python
      filename: models/python_order_revenue.py
      content: |
        def model(dbt, session):
            dbt.config(materialized="table")
            orders = dbt.ref("order_revenue")
            return orders.select("order_id", "revenue_cents")
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    evidence:
    - src-1
    - src-2
  - id: scope
    title: Keep adapter support visible
    explanation: |
      The identity transformation preserves the fixture values.
    state:
      kind: comparison
      title: Keep adapter support visible
      columns:
      - check
      - expected
      rows:
      - - order 1042 revenue_cents
        - 1000
      - - all 12 orders total_cents
        - 12500
      - - example adapter
        - Snowflake / Snowpark
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Language choice does not remove warehouse-specific requirements.
    evidence:
    - src-1
    - src-2
    code:
    - language: python
      filename: models/python_order_revenue.py
      content: |
        def model(dbt, session):
            dbt.config(materialized="table")
            orders = dbt.ref("order_revenue")
            return orders.select("order_id", "revenue_cents")
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    - language: sql
      filename: inspection/python_totals.sql
      content: |
        select sum(revenue_cents) as total_cents
        from python_order_revenue;
        select order_id, revenue_cents from python_order_revenue
        where order_id = 1042;
      highlight_lines:
      - 1
      - 4
      purpose: authored executable syntax; illustration only
  evidence:
