id: '1.3'
label: v1.3
title: Python models
lead: |
  Python models join SQL models on supported platforms. Both can participate in the project’s dependency graph.
problem_then: |
  Some transformations are more natural in a dataframe API, but separate notebooks can lose the project’s dependency context.
what_changed:
- id: change-1
  summary: Python models, including incremental support where implemented.
  introduced_in: 1.3.0
  adapter_constraints: Supported Python platforms include Snowflake, BigQuery and Databricks; APIs and materializations
    differ.
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Additional portable macros and .dbtignore.
  introduced_in: 1.3.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Use Python where it earns its place and keep the upstream references visible.
technical_detail: |
  Python model support depends on the adapter; initial supported platforms include Snowflake, BigQuery and Databricks. This Snowpark-shaped example is not a PostgreSQL or universal Python example. No Python runtime was executed.
milestones:
