walkthrough:
  id: wt-1.3
  learning_objective: |
    Recognize a Python model as another graph node.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: input
    title: Start from the SQL model
    explanation: |
      The input is the derived order_revenue relation.
    state:
      kind: table
      title: 'Order 1042: partial refund'
      columns:
      - order_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1042
        - Old Port
        - 1200
        - 200
        - 1000
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Python receives a defined upstream dataset.
    evidence:
    - src-1
    - src-2
  - id: python
    title: Add a simple dataframe step
    explanation: |
      The example selects the order key and net revenue without changing either.
    state:
      kind: comparison
      title: Add a simple dataframe step
      columns:
      - selected columns
      - source
      rows:
      - - order_id, revenue_cents
        - order_revenue
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The ref call keeps the dependency explicit.
    code:
    - language: python
      filename: models/python_order_revenue.py
      content: |
        def model(dbt, session):
            dbt.config(materialized="table")
            orders = dbt.ref("order_revenue")
            return orders.select("order_id", "revenue_cents")
      highlight_lines: []
    evidence:
    - src-1
    - src-2
  - id: scope
    title: Keep adapter support visible
    explanation: |
      The identity transformation preserves the fixture values.
    state:
      kind: comparison
      title: Keep adapter support visible
      columns:
      - check
      - expected
      rows:
      - - order 1042 revenue_cents
        - 1000
      - - all 12 orders total_cents
        - 12500
      - - example adapter
        - Snowflake / Snowpark
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Language choice does not remove warehouse-specific requirements.
    evidence:
    - src-1
    - src-2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
