id: '1.3'
label: v1.3
title: Python models
lead: >
  Python models join SQL models on supported platforms, and metric definitions are reworked for the Semantic
  Layer, which enters public preview the same month.
problem_then: >
  Some transformations are more natural in a dataframe API, but separate notebooks can lose the project’s
  dependency context.
what_changed:
  - id: change-1
    summary: Python models, including incremental support where implemented.
    introduced_in: 1.3.0
    adapter_constraints: Supported Python platforms include Snowflake, BigQuery and Databricks; APIs and materializations differ.
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Additional portable macros and .dbtignore.
    introduced_in: 1.3.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
  - id: metrics-for-semantic-layer
    summary: >-
      Metric definitions are reworked for the Semantic Layer: type becomes calculation_method, sql becomes
      expression, and a window property is added.
    introduced_in: 1.3.0
    adapter_constraints: >-
      Defining a metric needs no special adapter; querying it in 2022 needed the dbt_metrics package or the
      hosted Semantic Layer preview.
    evidence:
      - src-sl-1
      - src-sl-2
    confidence: high
in_practice: >
  On supported platforms a model could be written in Python, read other models with dbt.ref, and take its
  place in the same dependency graph. Metrics defined in the project gained the shape the new Semantic Layer
  would serve: a calculation, an expression, a time grain and dimensions.
technical_detail: >
  Python model support depends on the adapter; initial supported platforms include Snowflake, BigQuery and
  Databricks. This Snowpark-shaped example is not a PostgreSQL or universal Python example. No Python runtime
  was executed.
milestones:
  - id: 1.3.0
    kind: package
    date: '2022-10-12'
    precision: day
    title: First published package
    evidence:
      - src-2
  - id: product-2022-10-semantic-layer
    kind: product_event
    date: 2022-10
    precision: month
    title: dbt Semantic Layer public preview
    evidence:
      - src-sl-3
    note: A hosted service in dbt Cloud, dated to the month; it serves the metric definitions v1.3 reworked.
