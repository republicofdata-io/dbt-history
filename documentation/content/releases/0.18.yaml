walkthrough:
  id: wt-0.18
  learning_objective: |
    Separate changed code, deferred references and downstream consumers.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: change
    title: Change the refund definition
    explanation: |
      Assume the refund model SQL changes while orders and payments remain unchanged.
    state:
      kind: comparison
      title: Change the refund definition
      columns:
      - resource
      - definition status
      rows:
      - - refunds_by_order
        - modified
      - - order_revenue
        - downstream
      - - revenue_by_location
        - downstream
      - - orders
        - unchanged
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Saved state identifies a code-change boundary.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
    - src-6
    code:
    - language: sql
      filename: models/refunds_by_order.sql
      content: |
        select order_id, sum(amount_cents) as refund_cents
        from {{ ref("refunds") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
  - id: build
    title: Build the affected branch
    explanation: |
      The prepared selection includes descendants; eligible unselected parents resolve using saved state.
    state:
      kind: comparison
      title: Build the affected branch
      columns:
      - behavior
      - prepared choice
      rows:
      - - build
        - refunds_by_order, order_revenue, revenue_by_location
      - - reuse eligible parent
        - orders from saved production state
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Deferral supports a smaller development build.
    code:
    - language: sql
      filename: models/refunds_by_order.sql
      content: |
        select order_id, sum(amount_cents) as refund_cents
        from {{ ref("refunds") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
    - language: shell
      filename: commands.sh
      content: |
        dbt run --models state:modified+ --state ./state-prod --defer
      highlight_lines:
      - 1
    evidence:
