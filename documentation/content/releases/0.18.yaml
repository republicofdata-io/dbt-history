walkthrough:
  id: wt-0.18
  learning_objective: >
    Use a saved copy of the production project to find what changed, build only that branch, and name the
    dashboard that depends on it.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: change
      title: The refund model changes
      explanation: >
        Four model files are shown. The refund model, highlighted on lines 1 and 2, is the one that was
        edited. Its SQL is compared to a saved copy of the project from the last production run. The other
        three models are unchanged, but the highlighted lines show how they read from the refund model,
        directly or through order_amounts. The result panel classifies each model: the refund model is
        modified, order_revenue and revenue_by_location are downstream of it, and orders is unchanged.
      state:
        kind: comparison
        title: Which models changed and which depend on them
        columns:
          - resource
          - definition status
        rows:
          - - refunds_by_order
            - modified
          - - order_revenue
            - downstream
          - - revenue_by_location
            - downstream
          - - orders
            - unchanged
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        Comparing against the saved production state tells dbt which model changed and which models sit
        downstream of it.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
      code:
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
    - id: build
      title: Build only the changed branch
      explanation: >
        The same four model files are shown. The command file runs dbt with three options. state:modified+
        selects the changed model and everything downstream of it. The state option points at the saved
        production copy to compare against. The defer option tells dbt that unselected inputs, such as orders,
        should be read from the production tables instead of being rebuilt. The result panel lists what gets
        built and what gets reused.
      state:
        kind: comparison
        title: What is built and what is reused
        columns:
          - behavior
          - prepared choice
        rows:
          - - build
            - refunds_by_order, order_revenue, revenue_by_location
          - - reuse eligible parent
            - orders from saved production state
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        The changed branch is rebuilt, and unchanged inputs are borrowed from production, so the development
        build stays small.
      code:
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
        - language: shell
          filename: commands.sh
          content: |
            dbt run --models state:modified+ --state ./state-prod --defer
          highlight_lines:
            - 1
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
    - id: consumer
      title: Name the dashboard that uses the result (added in 0.18.1)
      explanation: >
        Two files are shown. The YAML file, highlighted on lines 2, 5 and 6, declares an exposure: a named
        downstream use of the project, here a daily dashboard, with the model it depends on. The SQL file is
        the revenue-by-location model it reads, highlighted on its sum lines. The result panel shows the
        exposure and its dependency. Exposures were added in patch 0.18.1, after the main release.
      state:
        kind: comparison
        title: The dashboard as an exposure
        columns:
          - resource
          - kind
          - depends on
        rows:
          - - shop_daily_dashboard
            - exposure at 0.18.1
            - revenue_by_location
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        An exposure records that the daily dashboard reads revenue_by_location. It documents the dependency
        but does not build the dashboard.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
      code:
        - language: yaml
          filename: models/exposures.yml (0.18.1)
          content: |
            version: 2
            exposures:
              - name: shop_daily_dashboard
                type: dashboard
                depends_on:
                  - ref("revenue_by_location")
                owner:
                  name: Waffle Shop finance
                  email: finance@example.invalid
          highlight_lines:
            - 2
            - 5
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
  evidence:
