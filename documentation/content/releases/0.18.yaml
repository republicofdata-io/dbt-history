id: '0.18'
label: v0.18
title: State-aware selection and downstream context
lead: >
  Saved project state helps select changed work and reuse existing relations. A later patch makes dashboards
  visible as exposures.
problem_then: >
  A small change often needs only part of a project rebuilt, but the project still needs valid upstream
  relations.
what_changed:
  - id: change-1
    summary: State selection, deferral and YAML selectors.
    introduced_in: 0.18.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Exposures represent downstream consumers.
    introduced_in: 0.18.1
    adapter_constraints: null
    evidence:
      - src-4
    confidence: high
in_practice: >
  dbt could compare the project with a saved production state and build only what changed, borrowing unchanged
  upstream tables from production. Patch 0.18.1 let a dashboard be declared as an exposure.
technical_detail: >
  state:modified compares project definitions, not new business rows. --defer resolves eligible unselected
  references through saved state. Exposures arrive in 0.18.1. Keep saved state separate from the current
  output directory.
