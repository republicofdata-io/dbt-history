  intro:
    can_now:
    - Select changed model definitions by comparing saved project state.
    - Reuse eligible unselected production relations through deferral.
    - From 0.18.1, describe downstream dashboards as exposures.
    scenario: |
      The refund model changes while its other inputs stay stable. The shop builds the affected branch and records which dashboard consumes the result.
    outcome: |
      Connect the model edit, state-based command and patch-specific exposure definition.
