walkthrough:
  id: wt-0.18
  learning_objective: |
    Separate changed code, deferred references and downstream consumers.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: change
    title: Change the refund definition
    explanation: |
      Assume the refund model SQL changes while orders and payments remain unchanged.
    state:
      kind: comparison
      title: Change the refund definition
      columns:
      - resource
      - definition status
      rows:
      - - refunds_by_order
        - modified
      - - order_revenue
        - downstream
      - - revenue_by_location
        - downstream
      - - orders
        - unchanged
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Saved state identifies a code-change boundary.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
  - id: build
    title: Build the affected branch
    explanation: |
      The prepared selection includes descendants; eligible unselected parents resolve using saved state.
    state:
      kind: comparison
      title: Build the affected branch
      columns:
      - behavior
      - prepared choice
      rows:
      - - build
        - refunds_by_order, order_revenue, revenue_by_location
      - - reuse eligible parent
        - orders from saved production state
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Deferral supports a smaller development build.
    code:
    - language: shell
      filename: commands.sh
      content: |
        dbt run --models state:modified+ --state ./state-prod --defer
      highlight_lines: []
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
  - id: consumer
    title: Name the dashboard at 0.18.1
    explanation: |
      The fictional daily dashboard consumes the location result.
    state:
      kind: comparison
      title: Name the dashboard at 0.18.1
      columns:
      - resource
      - kind
      - depends on
      rows:
      - - shop_daily_dashboard
        - exposure at 0.18.1
        - revenue_by_location
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Exposures describe downstream use; they do not build the dashboard.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    - src-3
    - src-4
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
