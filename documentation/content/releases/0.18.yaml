walkthrough:
  id: wt-0.18
  learning_objective: >
    Use a saved copy of the production project to find what changed, build only that branch, and name the
    dashboard that depends on it.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: change
      title: The refund model changes
      explanation: >-
        Highlighted lines 1 and 2 of models/refunds_by_order.sql add coalesce, which treats a missing amount
        as zero. Compare models/refunds_by_order.sql (saved production version): its highlighted lines 1 and 2
        show the earlier sum and the same input. The base has no missing amounts, so values stay unchanged.
        The panel identifies the changed model, its three descendants and unchanged inputs.
      state:
        kind: comparison
        title: Saved definition compared with current definition
        columns:
          - resource
          - definition status
        rows:
          - - refunds_by_order
            - 'modified: added coalesce'
          - - order_amounts
            - downstream
          - - order_revenue
            - downstream
          - - revenue_by_location
            - downstream
          - - orders, payments_by_order, refunds
            - unchanged inputs
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        Comparing against the saved production state tells dbt which model changed and which models sit
        downstream of it.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
      code:
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            -- Treat missing amounts as zero.
            select order_id, sum(coalesce(amount_cents, 0)) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/refunds_by_order.sql (saved production version)
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
    - id: build
      title: Build only the changed branch
      explanation: >-
        Highlighted lines 1 and 2 of refunds_by_order retain the change from the previous screen. The command
        selects changed models with state:modified and their descendants with +. It also enables deferral,
        which borrows eligible unselected inputs from saved production state. With no development copies of
        those parents, the panel shows the rebuilt branch and the three inputs read from production.
      state:
        kind: comparison
        title: Development build and reused production inputs
        columns:
          - behavior
          - models
        rows:
          - - build in development
            - refunds_by_order, order_amounts, order_revenue, revenue_by_location
          - - read from saved production relations
            - orders, payments_by_order, refunds
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        The changed branch is rebuilt, and unchanged inputs are borrowed from production, so the development
        build stays small.
      code:
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            -- Treat missing amounts as zero.
            select order_id, sum(coalesce(amount_cents, 0)) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt run --models state:modified+ --state ./state-prod --defer
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
    - id: consumer
      title: Name the dashboard that uses the result (added in 0.18.1)
      explanation: >-
        Highlighted lines 2, 5 and 6 of exposures.yml declare an exposure: a named use of the project, here a
        daily dashboard, with the model it reads. The panel shows the dashboard depending on
        revenue_by_location. Exposures arrived in patch 0.18.1. The definition documents the dependency; it
        doesn't build the dashboard.
      state:
        kind: comparison
        title: The dashboard as an exposure
        columns:
          - resource
          - kind
          - depends on
        rows:
          - - shop_daily_dashboard
            - exposure at 0.18.1
            - revenue_by_location
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        An exposure records that the daily dashboard reads revenue_by_location. It documents the dependency
        but does not build the dashboard.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
      code:
        - language: yaml
          filename: models/exposures.yml (0.18.1)
          content: |
            version: 2
            exposures:
              - name: shop_daily_dashboard
                type: dashboard
                depends_on:
                  - ref("revenue_by_location")
                owner:
                  name: Jaffle Shop finance
                  email: finance@example.invalid
          highlight_lines:
            - 2
            - 5
            - 6
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
      - src-6
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      This example assumes saved production relations exist and unselected parents have no development copies.
      Deferral applies to model ref calls, not direct raw table names; raw.locations is deliberately a direct
      warehouse input. YAML selectors are release context only (src-1).
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Compare the project to a saved copy from production and select only the models whose code changed.
      - >-
        Build those changed models in a development schema while reading unchanged inputs from production,
        instead of rebuilding them. dbt calls this deferral.
      - >-
        From version 0.18.1, list a dashboard or report in YAML as an exposure, so the lineage shows who uses
        a model.
    scenario: >
      The refund model changes. Orders and payments do not. Jaffle Shop wants to rebuild only the refund model
      and the models that depend on it, reuse the rest from production, and record that the daily dashboard
      reads the result.
    outcome: >
      See the edited model, the command that builds only the changed branch, and the exposure that names the
      dashboard.
  title: >
    Demo: dbt builds only the models changed since the last production run, and records which dashboard uses
    the result
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
