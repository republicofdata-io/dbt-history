    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Compare the project to a saved copy from production and select only the models whose code changed.
      - >-
        Build those changed models in a development schema while reading unchanged inputs from production,
        instead of rebuilding them. dbt calls this deferral.
      - >-
        From version 0.18.1, list a dashboard or report in YAML as an exposure, so the lineage shows who uses
        a model.
    scenario: >
      The refund model changes. Orders and payments do not. Waffle Shop wants to rebuild only the refund model
      and the models that depend on it, reuse the rest from production, and record that the daily dashboard
      reads the result.
    outcome: >
      See the edited model, the command that builds only the changed branch, and the exposure that names the
      dashboard.
  title: >
    Demo: dbt builds only the models changed since the last production run, and records which dashboard uses
    the result
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
