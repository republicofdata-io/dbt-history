    - src-4
    - src-5
    - src-6
  - id: consumer
    title: Name the dashboard at 0.18.1
    explanation: |
      The fictional daily dashboard consumes the location result.
    state:
      kind: comparison
      title: Name the dashboard at 0.18.1
      columns:
      - resource
      - kind
      - depends on
      rows:
      - - shop_daily_dashboard
        - exposure at 0.18.1
        - revenue_by_location
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Exposures describe downstream use; they do not build the dashboard.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
    - src-6
    code:
    - language: yaml
      filename: models/exposures.yml (0.18.1)
      content: |
        version: 2
        exposures:
          - name: shop_daily_dashboard
            type: dashboard
            depends_on:
              - ref("revenue_by_location")
            owner:
              name: Waffle Shop finance
              email: finance@example.invalid
      highlight_lines:
      - 2
      - 5
      - 6
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
