walkthrough:
  id: wt-1.10
  learning_objective: |
    See how a repeated key in a YAML file makes a model's meaning ambiguous, and how dbt now points it out.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: duplicate
      title: Two descriptions for one model
      explanation: >
        You are looking at the model's YAML file. The highlighted lines are the normal shape: version, the
        models list, the model name and a description. Line 5 repeats the description key with a different
        sentence. In YAML a repeated key is not two values, it is an ambiguity, and earlier versions would
        quietly keep one of them. The result panel counts the problem: one key, two occurrences.
      state:
        kind: comparison
        title: The duplicated key
        columns:
          - key
          - occurrences
          - problem
        rows:
          - - description
            - 2
            - duplicate mapping key
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        A duplicated key in YAML leaves dbt guessing which value you meant.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Revenue before refunds.
                description: Payments minus refunds, in cents.
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
      evidence:
        - src-1
        - src-2
    - id: warning
      title: dbt points out the ambiguity
      explanation: >
        The file is unchanged. The result panel shows what the check looks for: one description key per model,
        but two found. The panel is a plain-language illustration of the warning, not the exact text dbt
        prints.
      state:
        kind: result
        title: The duplicate-key check
        columns:
          - check
          - expected
          - actual
        rows:
          - - description keys per mapping
            - 1
            - 2
        result_status: warn
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        The check surfaces the duplicated key so it gets fixed before anyone relies on the description.
      evidence:
        - src-1
        - src-2
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Revenue before refunds.
                description: Payments minus refunds, in cents.
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
    - id: correct
      title: Keep the accounting definition
      explanation: >
        The highlighted lines are the corrected file. The wrong description is gone. The one that remains is
        the shop's accounting rule: payments minus refunds, in cents. The result panel confirms the base total
        is still 12,500 cents. The fix changed a description, not a calculation.
      state:
        kind: comparison
        title: One definition, same total
        columns:
          - model
          - description
          - base total
        rows:
          - - revenue_by_location
            - Payments minus refunds, in cents.
            - 12500
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        One description remains, and the revenue total is unchanged at 12,500 cents.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
      evidence:
        - src-1
        - src-2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
      - src-6
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Get a warning when a YAML file repeats a key, instead of one value silently winning.
      - Turn on checks that macros are called with the right argument names and types.
      - Write your own SQL query to tell dbt how fresh a source table is.
    scenario: >
      The revenue model's YAML file has two description lines, and they disagree. One says revenue before
      refunds, the other says payments minus refunds. The shop removes the wrong one and keeps the accounting
      definition. The numbers never change, only the configuration does.
    outcome: |
      See the duplicated key, the warning it produces, and the single corrected definition.
  title: |
    Demo: dbt warns about a duplicated setting in a YAML file
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
