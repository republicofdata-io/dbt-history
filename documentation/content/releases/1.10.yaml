walkthrough:
  id: wt-1.10
  learning_objective: |
    See how a repeated key in a YAML file makes a model's meaning ambiguous, and how dbt now points it out.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: sample
      title: Build only the March 8 event window
      explanation: Highlighted line 5 of the input properties marks ordered_at as event time, the time
        the order happened. Highlighted line 3 of daily_revenue reads that input. The --sample command
        filters it from March 8 up to, but not including, March 9. The panel shows 12 included orders
        worth 12,500 cents and two excluded orders worth 1,900. At 1.10.0 this initial feature’s flag is
        hidden from command help.
      state:
        kind: comparison
        title: Prepared March 8 sampling window
        columns:
          - source trading day
          - orders
          - revenue_cents
          - in sample output
        rows:
          -   - '2016-03-08'
              - 12
              - 12500
              - true
          -   - '2016-03-09'
              - 2
              - 1900
              - false
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: The sample build contains one chosen trading day while the stored input still contains
        both days.
      code:
        - language: yaml
          filename: models/order_revenue.yml
          content: |
            version: 2
            models:
              - name: order_revenue
                config:
                  event_time: ordered_at
          highlight_lines:
            - 5
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/daily_revenue.sql
          content: |
            {{ config(materialized="table", event_time="ordered_at") }}
            select order_id, location_id, ordered_at, revenue_cents
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 1
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: inspection/sample_totals.sql
          content: |
            select count(*) as orders, sum(revenue_cents) as revenue_cents
            from jaffle.daily_revenue;
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt run --select daily_revenue --sample "{'start': '2016-03-08', 'end': '2016-03-09'}"
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - alignment-1-10-0
      data_context:
        dataset_variant: second-day
        phase: Both days already exist in order_revenue; a separate sample output includes March 8 only.
    - id: duplicate
      title: Two descriptions for one model
      explanation: >-
        Highlighted lines 4 and 5 repeat the description key in one YAML mapping. The two sentences disagree
        about refunds. The panel counts two occurrences of a key that should appear once; the next step exposes
        the deprecation warning.
      state:
        kind: comparison
        title: The duplicated key
        columns:
          - key
          - occurrences
          - problem
        rows:
          -   - description
              - 2
              - duplicate mapping key
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        Two descriptions compete for the same YAML key.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Revenue before refunds.
                description: Payments minus refunds, in cents.
          highlight_lines:
            - 4
            - 5
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - alignment-1-10-0
    - id: warning
      title: dbt points out the ambiguity
      explanation: >-
        Highlighted lines 4 and 5 are still the duplicate description. A fresh parse surfaces DuplicateYAMLKeysDeprecation,
        named in the panel. The second command shows the optional warning-category setting that promotes it
        to an error. This panel summarizes the diagnostic; it is not copied terminal output.
      state:
        kind: result
        title: Prepared duplicate-key diagnostic
        columns:
          - category
          - expected descriptions
          - actual descriptions
        rows:
          -   - DuplicateYAMLKeysDeprecation
              - 1
              - 2
        result_status: warn
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The check surfaces the duplicated key so it gets fixed before anyone relies on the description.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - alignment-1-10-0
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Revenue before refunds.
                description: Payments minus refunds, in cents.
          highlight_lines:
            - 4
            - 5
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt parse --no-partial-parse
            # Optional: treat this warning category as an error.
            dbt parse --no-partial-parse --warn-error-options '{"include": ["DuplicateYAMLKeysDeprecation"]}'
          highlight_lines:
            - 1
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
    - id: correct
      title: Keep the accounting definition
      explanation: >-
        Highlighted line 4 is now the only description and states the accounting rule correctly. The supporting
        model and total query show the unchanged base calculation. The panel confirms one description and
        12,500 cents. This screen returns to the base fixture; the earlier sample screen used the named second-day
        variant.
      state:
        kind: comparison
        title: One definition, same total
        columns:
          - model
          - description
          - base total
        rows:
          -   - revenue_by_location
              - Payments minus refunds, in cents.
              - 12500
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        One description remains, and the revenue total is unchanged at 12,500 cents.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
          highlight_lines:
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: inspection/total.sql
          content: |
            select sum(revenue_cents) as total_cents
            from jaffle.revenue_by_location
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - src-6
        - alignment-1-10-0
      data_context:
        dataset_variant: base
        phase: Documentation correction on the base project; independent of the sample-output table.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
      - src-6
      - alignment-1-10-0
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      At 1.10.0 --sample is an initial implementation with hidden=True in help, not behind an additional enabling flag. The example intentionally uses a table output and an event-time-declared existing parent so sampling is distinct from microbatch repair. Macro argument validation and custom freshness SQL remain release context, not intro promises (alignment-1-10-0).
      historical-1.10-02: Verified the initial --sample implementation: accepted directly, hidden from help, no second enable flag; qualified in the step and limitations. Evidence: src-1, src-2, src-3, src-4, src-5, src-6, alignment-1-10-0.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Build models over a chosen event-time window with the initial --sample feature.
      - See a deprecation warning for duplicated YAML keys.
      - Choose to promote that warning category to an error.
    scenario: >-
      Jaffle Shop first checks a single trading day from a two-day input. It then cleans up conflicting model
      descriptions before stricter configuration checks make them harder to ignore.
    outcome: |-
      See March 8 included and March 9 excluded, then the duplicate-key warning and its corrected definition.
  title: |-
    Demo: sample one trading day and correct a duplicate setting
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
default_milestone: 1.10.0
