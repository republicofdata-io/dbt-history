walkthrough:
  id: wt-1.10
  learning_objective: |
    Recognize a configuration problem without inventing a data discrepancy.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: duplicate
    title: Find an ambiguous setting
    explanation: |
      The proposed YAML repeats the model description key; it is shown as invalid teaching input.
    state:
      kind: comparison
      title: Find an ambiguous setting
      columns:
      - key
      - occurrences
      - problem
      rows:
      - - description
        - 2
        - duplicate mapping key
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A duplicated key makes the intended configuration ambiguous.
    code:
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: revenue_by_location
            description: Revenue before refunds.
            description: Payments minus refunds, in cents.
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    evidence:
    - src-1
    - src-2
  - id: warning
    title: Make the ambiguity visible
    explanation: |
      This is an explanatory assessment, not original dbt diagnostic text.
    state:
      kind: result
      title: Make the ambiguity visible
      columns:
      - check
      - expected
      - actual
      rows:
      - - description keys per mapping
        - 1
        - 2
      result_status: warn
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Resolve the config ambiguity before relying on its interpretation.
    evidence:
    - src-1
    - src-2
    code:
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: revenue_by_location
            description: Revenue before refunds.
            description: Payments minus refunds, in cents.
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
  - id: correct
    title: Keep one clear definition
    explanation: |
      Use the shared accounting definition.
    state:
      kind: comparison
      title: Keep one clear definition
      columns:
      - model
      - description
      - base total
      rows:
      - - revenue_by_location
        - Payments minus refunds, in cents.
        - 12500
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Configuration validation protects intent; accounting tests protect the calculation.
    code:
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: revenue_by_location
            description: Payments minus refunds, in cents.
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    evidence:
    - src-1
    - src-2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
    - src-6
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Detect duplicate or misplaced configuration keys more explicitly.
    - Opt into checks of documented macro argument names and types.
    - Calculate source freshness through a custom SQL query.
    scenario: |
      The revenue model’s YAML contains two descriptions with conflicting meanings. The shop removes the ambiguity while keeping the accounting definition unchanged.
    outcome: |
      See the invalid mapping and its corrected single definition.
