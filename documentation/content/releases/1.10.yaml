id: '1.10'
label: v1.10
title: Configuration checks and migration readiness
lead: |
  More configuration checks help projects prepare for stricter validation. A duplicate or misplaced setting becomes easier to notice.
problem_then: |
  Lenient configuration can hide mistakes that later upgrades expose.
what_changed:
- id: change-1
  summary: Duplicate-key checks, configuration deprecations and opt-in macro argument validation.
  introduced_in: 1.10.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Initial sample-mode implementation and custom freshness SQL queries.
  introduced_in: 1.10.0
  adapter_constraints: Initial implementation does not establish universal hosted-feature availability or adapter
    support.
  evidence:
  - src-1
  confidence: high
in_practice: |
  Review warnings as project-maintenance work, while keeping them distinct from failures in the business data.
technical_detail: |
  This release adds initial sample-mode implementation, custom freshness queries and opt-in macro argument validation. The walkthrough focuses on documented duplicate-key checking rather than claiming a universally available sampling CLI. Warning severity depends on configuration and behavior flags.
