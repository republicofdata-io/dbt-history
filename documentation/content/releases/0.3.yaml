    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      Profiles are excerpts: warehouse credentials and database/schema are omitted. The deliberately invalid refund_amount_cents column is absent from the fixture; no original error log or timing is claimed. Boolean materialized is retained before 0.4.
      The 0.3.0 loader merges the default user profile and selects outputs using run-target, not the later target key. This early profile shape was checked directly in project.py and targets.py.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Build independent models concurrently with up to eight threads.
    - Skip descendants of a failed model while unrelated branches can continue.
    scenario: |
      Payments and refunds can be aggregated separately before calculating revenue. A broken refund model shows why parallel work still needs dependency-aware failure handling.
    outcome: |
      Follow two independent branches, a blocked dependent model and the repaired revenue result.
status: reviewed
