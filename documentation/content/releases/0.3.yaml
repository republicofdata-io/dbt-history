walkthrough:
  id: wt-0.3
  learning_objective: |
    Understand parallel work without pretending dependencies disappear.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: branches
    title: Find independent work
    explanation: |
      Payments and refunds can be aggregated separately.
    state:
      kind: diagram
      title: Ready branches
      columns: []
      rows: []
      result_status: null
      diagram:
        nodes:
        - id: payments
          label: payments_by_order
        - id: refunds
          label: refunds_by_order
        - id: revenue
          label: order_revenue
        edges:
        - from: payments
          to: revenue
        - from: refunds
          to: revenue
        highlight:
        - payments
        - refunds
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The revenue model must wait for both inputs.
    evidence:
    - src-1
    - src-2
  - id: failure
    title: Isolate a broken branch
    explanation: |
      Assume the refund model contains invalid SQL; this does not alter the fixture.
    state:
      kind: comparison
      title: Isolate a broken branch
      columns:
      - model
      - prepared scheduling outcome
      rows:
      - - refunds_by_order
        - failed
      - - order_revenue
        - 'skipped: depends on refunds'
      - - payments_by_order
        - independent work may finish
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Failure follows dependencies, not file order.
    evidence:
    - src-1
    - src-2
  - id: fixed
    title: Restore the dependency
    explanation: |
      After repairing the hypothetical SQL problem, the same business rules still apply.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Parallel scheduling changes the workflow, not the answer.
    evidence:
    - src-1
    - src-2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
