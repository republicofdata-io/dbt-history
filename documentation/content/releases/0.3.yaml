walkthrough:
  id: wt-0.3
  learning_objective: |
    Understand parallel work without pretending dependencies disappear.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: branches
    title: Find independent work
    explanation: |
      Payments and refunds can be aggregated separately.
    state:
      kind: diagram
      title: Ready branches
      columns: []
      rows: []
      result_status: null
      diagram:
        nodes:
        - id: payments
          label: payments_by_order
        - id: refunds
          label: refunds_by_order
        - id: revenue
          label: order_revenue
        edges:
        - from: payments
          to: revenue
        - from: refunds
          to: revenue
        highlight:
        - payments
        - refunds
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The revenue model must wait for both inputs.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: models/payments_by_order.sql
      content: |
        select order_id, sum(amount_cents) as payment_cents
        from {{ ref("payments") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: profiles.yml (target excerpt)
      content: |
        user:
          run-target: dev
          outputs:
            dev:
              type: redshift
              threads: 2
      highlight_lines:
      - 1
      - 2
      - 6
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: dbt_project.yml (excerpt)
      content: |
        name: waffle_shop
        version: "1.0"
        model-defaults:
          materialized: true
      highlight_lines:
      - 3
      - 4
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/refunds_by_order.sql
      content: |
        select order_id, sum(amount_cents) as refund_cents
        from {{ ref("refunds") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/refunds.sql
      content: |
        select refund_id, order_id, amount_cents from raw.refunds
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
  - id: failure
    title: Isolate a broken branch
    explanation: |
      Assume the refund model contains invalid SQL; this does not alter the fixture.
    state:
      kind: comparison
      title: Isolate a broken branch
      columns:
      - model
      - prepared scheduling outcome
      rows:
      - - refunds_by_order
        - failed
      - - order_revenue
        - 'skipped: depends on refunds'
      - - payments_by_order
        - independent work may finish
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Failure follows dependencies, not file order.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: models/payments_by_order.sql
      content: |
        select order_id, sum(amount_cents) as payment_cents
        from {{ ref("payments") }}
        group by order_id
      highlight_lines:
      - 1
