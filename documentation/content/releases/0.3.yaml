id: '0.3'
label: v0.3
title: Concurrent model builds
lead: >
  Independent models can build alongside one another. A failed branch no longer prevents every unrelated
  branch from making progress.
problem_then: >
  Running a growing project serially creates unnecessary waiting; one broken dependency should not disguise
  the status of unrelated work.
what_changed:
  - id: change-1
    summary: Parallel model creation with up to eight threads.
    introduced_in: 0.3.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: >-
      Failures skip descendants while independent branches continue; temporary relations reduce unavailable
      time.
    introduced_in: 0.3.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
in_practice: |
  Think in dependencies and runnable branches, not a handwritten sequence of SQL files.
technical_detail: >
  The release supports up to eight threads. Descendants of failed models are skipped while independent
  branches continue. The graph is a scheduling illustration, not a measured run or timing claim.
milestones:
