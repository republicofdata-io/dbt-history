walkthrough:
  id: wt-0.3
  learning_objective: >
    See how dbt runs independent models at the same time, and why a failed model only holds back the models
    that depend on it.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: branches
      title: Two branches that do not need each other
      explanation: |
        Highlighted lines 1 and 2 of the payment and refund models total their separate feeds. Highlighted line 6 of profiles.yml allows two workers. Lines 3, 4 and 6 of order_amounts join both finished totals to orders. The diagram shows both branches meeting at order_amounts, which order_revenue then reads.
      state:
        kind: diagram
        title: Two independent branches meet at order_amounts
        columns: []
        rows: []
        result_status:
        diagram:
          nodes:
            - id: payments_by_order
              label: payments_by_order
            - id: refunds_by_order
              label: refunds_by_order
            - id: order_amounts
              label: order_amounts
            - id: order_revenue
              label: order_revenue
          edges:
            - from: payments_by_order
              to: order_amounts
            - from: refunds_by_order
              to: order_amounts
            - from: order_amounts
              to: order_revenue
          highlight:
            - order_amounts
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Payments and refunds can build at the same time, but revenue has to wait for both.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-0-3-0
      code:
        - language: sql
          filename: models/payments_by_order.sql
          content: |
            select order_id, sum(amount_cents) as payment_cents
            from {{ ref("payments") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: profiles.yml (target excerpt)
          content: |
            user:
              run-target: dev
              outputs:
                dev:
                  type: redshift
                  threads: 2
          highlight_lines:
            - 1
            - 2
            - 6
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            name: jaffle_shop
            version: "1.0"
            model-defaults:
              materialized: true
          highlight_lines:
            - 3
            - 4
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/refunds.sql
          content: |
            select refund_id, order_id, amount_cents from raw.refunds
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
          purpose: Authored era-specific example; illustration only.
    - id: failure
      title: Break the refund branch on purpose
      explanation: >
        The refund model now has a deliberate mistake. Highlighted line 1 sums a column called
        refund_amount_cents, which does not exist, so the database rejects the query. The data itself is
        unchanged. Highlighted lines 4 and 6 of order_amounts show that it needs both branches, and
        highlighted line 1 of order_revenue shows that it needs order_amounts. The result panel shows what
        dbt
        does: the refund model fails, the revenue model is skipped because it depends on refunds, and the
        payment model finishes on its own.
      state:
        kind: comparison
        title: What happens when one branch fails
        columns:
          - model
          - prepared scheduling outcome
        rows:
          -   - refunds_by_order
              - failed
          -   - order_revenue
              - 'skipped: depends on refunds'
          -   - payments_by_order
              - independent work may finish
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        A failure stops only the models downstream of it; unrelated work still completes.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-0-3-0
      code:
        - language: sql
          filename: models/payments_by_order.sql
          content: |
            select order_id, sum(amount_cents) as payment_cents
            from {{ ref("payments") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: profiles.yml (target excerpt)
          content: |
            user:
              run-target: dev
              outputs:
                dev:
                  type: redshift
                  threads: 2
          highlight_lines:
            - 1
            - 2
            - 6
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            name: jaffle_shop
            version: "1.0"
            model-defaults:
              materialized: true
          highlight_lines:
            - 3
            - 4
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/refunds_by_order.sql (deliberately invalid)
          content: |
            select order_id, sum(refund_amount_cents) as refund_cents
            from raw.refunds
            group by order_id
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
          purpose: Authored era-specific example; illustration only.
    - id: fixed
      title: Fix the refund model and read the totals
      explanation: >
        With the column name corrected, the same files build in full. Highlighted lines 4 and 6 of
        order_amounts join both branches back in, and highlighted lines 3 to 5 of the location model add up
        payments, refunds and revenue per location. The result panel shows the familiar figures: 12,500 cents
        across the three locations.
      state:
        kind: table
        title: Revenue by location after the repair
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          -   - 1
              - Old Port
              - 4400
              - 1000
              - 3400
          -   - 2
              - Mile End
              - 4600
              - 300
              - 4300
          -   - 3
              - Riverside
              - 4800
              - 0
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Building in parallel changes how fast the work runs, not the answer it produces.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-0-3-0
      code:
        - language: sql
          filename: models/payments_by_order.sql
          content: |
            select order_id, sum(amount_cents) as payment_cents
            from {{ ref("payments") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: profiles.yml (target excerpt)
          content: |
            user:
              run-target: dev
              outputs:
                dev:
                  type: redshift
                  threads: 2
          highlight_lines:
            - 1
            - 2
            - 6
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            name: jaffle_shop
            version: "1.0"
            model-defaults:
              materialized: true
          highlight_lines:
            - 3
            - 4
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - alignment-0-3-0
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      Profiles are excerpts: warehouse credentials and database/schema are omitted. The deliberately invalid refund_amount_cents column is absent from the fixture; no original error log or timing is claimed. Boolean materialized is retained before 0.4.
      The 0.3.0 loader merges the default user profile and selects outputs using run-target, not the later target key. This early profile shape was checked directly in project.py and targets.py.
      Keep user.run-target at 0.3.0. Later named-profile target keys are a historical change, not an inconsistency. Temporary relation swapping is not demonstrated; the release evidence src-1 describes it.
      historical-0.3-01: Temporary relation swapping remains release context, documented as outside this walkthrough. Evidence: src-1, src-2, src-3, alignment-0-3-0.
      historical-0.3-02: Retained the prepared-scheduling label; this is not a measured schedule or native log. Evidence: src-1, src-2, src-3, alignment-0-3-0.
      historical-0.3-03: Keep named profile target in 0.7.0. Original loader/connection source verifies the change from 0.3 user.run-target; these versions should not be made artificially identical. Evidence: src-1, src-2, src-3, alignment-0-3-0.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Build models that do not depend on each other at the same time, using up to eight parallel workers,
        called threads.
      - >-
        When one model fails, let dbt skip only the models that depend on it while unrelated models keep
        going.
    scenario: >
      Payments per order and refunds per order can be totalled separately; neither needs the other. Revenue
      needs both. The walkthrough breaks the refund model on purpose to show that the payment branch still
      finishes, the revenue model is skipped, and the totals come back once the refund model is fixed.
    outcome: >
      Follow two independent branches, see the revenue model wait when one of them fails, and get the
      12,500-cent result after the repair.
  title: |
    Demo: independent models build side by side, and a broken one only blocks what depends on it
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
