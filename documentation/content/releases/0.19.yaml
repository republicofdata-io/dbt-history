      - src-4
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Have a snapshot mark a record as no longer current when its row vanishes from the source.
      - Keep the old versions of that record, so past orders still have a customer behind them.
      - Point tests at production tables while working locally, the same way models already could.
    scenario: >
      Customer 6, Finn, drops out of the customer feed. Their two old orders are still on the books. A
      snapshot is a table dbt keeps that records each version of a row over time. Before this version, a
      deleted customer stayed marked as current forever. Now the snapshot can close that record while keeping
      its history.
    outcome: >
      By the end you will have seen the one setting that turns this on, and the closed history row it
      produces.
  title: |
    Demo: a snapshot closes a customer's history when the source row is deleted
