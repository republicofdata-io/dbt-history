walkthrough:
  id: wt-0.19
  learning_objective: |
    See how a snapshot records that a customer disappeared from the source, without erasing their past.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is customer-removed. Each state below is an authored illustration.
  dataset_variant: customer-removed
  steps:
    - id: current
      title: 'Before the deletion: the customer is still in the feed'
      explanation: >-
        Highlighted lines 2 and 3 define the customer snapshot and turn on invalidate_hard_deletes. That setting
        closes a saved row when it disappears from the current feed. Highlighted line 2 of the query selects
        customer 6. The panel shows Finn in Montréal before deletion.
      state:
        kind: comparison
        title: Customer 6 as seen before the deletion
        columns:
          - customer_id
          - name
          - city
        rows:
          -   - 6
              - Finn
              - Montréal
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Before anything is deleted, the snapshot holds one open, current version of customer 6.
      evidence:
        - src-1
        - src-2
        - src-4
        - src-3
      code:
        - language: sql
          filename: snapshots/customers_history.sql
          content: |
            {% snapshot customers_history %}
            {{ config(target_schema="snapshots", unique_key="customer_id",
                strategy="check", check_cols=["city"], invalidate_hard_deletes=True) }}
            select * from raw.customers
            {% endsnapshot %}
          highlight_lines:
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: analyses/customer_before_delete.sql
          content: |
            select customer_id, name, city from raw.customers
            where customer_id = 6
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
      data_context:
        dataset_variant: base
        phase: Before the declared customer deletion.
    - id: missing
      title: The source row disappears, but the orders stay
      explanation: >-
        Highlighted lines 2 and 3 keep the same snapshot settings. The customer-removed variant removes only
        Finn’s current customer row. The panel shows that the feed no longer contains customer 6, while orders
        1046 and 1052 remain.
      state:
        kind: comparison
        title: Customer 6 is gone from the feed, orders 1046 and 1052 remain
        columns:
          - customer_id
          - current feed
          - existing orders
        rows:
          -   - 6
              - absent
              - 1046 and 1052 retained
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Deleting a customer from the source feed is not the same as removing or refunding their orders.
      code:
        - language: sql
          filename: snapshots/customers_history.sql
          content: |
            {% snapshot customers_history %}
            {{ config(target_schema="snapshots", unique_key="customer_id",
                strategy="check", check_cols=["city"], invalidate_hard_deletes=True) }}
            select * from raw.customers
            {% endsnapshot %}
          highlight_lines:
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-4
        - src-3
    - id: close
      title: 'Run the snapshot: the history row gets an end date'
      explanation: >-
        Highlighted lines 2 and 3 of the unchanged snapshot enable the deletion check. The inspection query
        reads the saved customer dates, while the added total query checks revenue separately. After the second
        snapshot observation, the panel shows Finn’s history closed at March 9, 09:00 and revenue still 12,500
        cents.
      state:
        kind: comparison
        title: Customer 6 history closed, revenue unchanged
        columns:
          - customer_id
          - history status
          - revenue total
        rows:
          -   - 6
              - closed at March 9 09:00
              - 12500
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >
        The snapshot now says customer 6 was real until March 9 and is no longer current, and every past order
        keeps its history.
      evidence:
        - src-1
        - src-2
        - src-4
        - src-3
      code:
        - language: sql
          filename: snapshots/customers_history.sql
          content: |
            {% snapshot customers_history %}
            {{ config(target_schema="snapshots", unique_key="customer_id",
                strategy="check", check_cols=["city"], invalidate_hard_deletes=True) }}
            select * from raw.customers
            {% endsnapshot %}
          highlight_lines:
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: analyses/closed_customer.sql
          content: |
            select customer_id, city, dbt_valid_from, dbt_valid_to
            from snapshots.customers_history
            where customer_id = 6
            order by dbt_valid_from
          highlight_lines:
            - 1
            - 3
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: inspection/revenue_total.sql
          content: |
            select sum(revenue_cents) as revenue_cents
            from jaffle.order_revenue
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt snapshot
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
      data_context:
        dataset_variant: customer-removed
        phase: After deletion has been observed by the snapshot.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The 2016 timestamps describe fixture observations, not the release date or captured warehouse clocks. Revival and test deferral are not demonstrated; they remain sourced release context (src-1). Snapshot history alone does not create a temporal order join.
      historical-0.19-01: Revival and test deferral remain release context with explicit limitations; the shown event is deletion only. Evidence: src-1, src-2, src-3, src-4.
      historical-0.19-02: 2016 dates are declared fixture observations, not the 2021 release date or a captured warehouse clock. Evidence: src-1, src-2, src-3, src-4.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Have a snapshot mark a record as no longer current when its row vanishes from the source.
      - Keep the old versions of that record, so past orders still have a customer behind them.
    scenario: >
      Customer 6, Finn, drops out of the customer feed. Their two old orders are still on the books. A
      snapshot is a table dbt keeps that records each version of a row over time. Before this version, a
      deleted customer stayed marked as current forever. Now the snapshot can close that record while keeping
      its history.
    outcome: >-
      See the deletion setting and the closed history row it produces.
  title: |
    Demo: a snapshot closes a customer's history when the source row is deleted
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
