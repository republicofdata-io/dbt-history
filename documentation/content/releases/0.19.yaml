walkthrough:
  id: wt-0.19
  learning_objective: |
    Distinguish deleted current data from retained history.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is customer-removed. Each state below is an authored illustration.
  dataset_variant: customer-removed
  steps:
  - id: current
    title: Read the last customer observation
    explanation: |
      Finn is customer 6 in the base fixture.
    state:
      kind: comparison
      title: Read the last customer observation
      columns:
      - customer_id
      - name
      - city
      rows:
      - - 6
        - Finn
        - Montréal
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The snapshot has an active version before deletion.
    evidence:
    - src-1
    - src-2
  - id: missing
    title: Observe a hard delete
    explanation: |
      The customer-removed variant deletes only the customer feed row.
    state:
      kind: comparison
      title: Observe a hard delete
      columns:
      - customer_id
      - current feed
      - existing orders
      rows:
      - - 6
        - absent
        - 1046 and 1052 retained
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Source deletion is different from refunding an order.
    code:
    - language: sql
      filename: snapshots/customers_history.sql
      content: |
        {% snapshot customers_history %}
        {{ config(target_schema="snapshots", unique_key="customer_id",
            strategy="check", check_cols=["city"], invalidate_hard_deletes=True) }}
        select * from raw.customers
        {% endsnapshot %}
      highlight_lines: []
    evidence:
    - src-1
    - src-2
  - id: close
    title: Close the observed active interval
    explanation: |
      The historical row remains, with an end boundary at the deletion observation.
    state:
      kind: comparison
      title: Close the observed active interval
      columns:
      - customer_id
      - history status
      - revenue total
      rows:
      - - 6
        - closed at March 9 09:00
        - 12500
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The past remains queryable without claiming the customer is still current.
    evidence:
    - src-1
    - src-2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    - src-3
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
