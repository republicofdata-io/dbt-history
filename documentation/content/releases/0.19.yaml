id: '0.19'
label: v0.19
title: More complete history and artifacts
lead: |
  Snapshots can invalidate rows when records disappear from a source. A deleted customer need not look current forever.
problem_then: |
  A change-tracking table can retain an open record even after the source row is removed.
what_changed:
- id: change-1
  summary: Snapshot hard-delete invalidation and revival.
  introduced_in: 0.19.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Deferral extends to tests; versioned artifact schemas and project config migrations.
  introduced_in: 0.19.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Choose how the snapshot represents hard deletes instead of leaving the meaning implicit.
technical_detail: |
  invalidate_hard_deletes closes the active interval when disappearance is observed. It does not remove historical records or erase existing orders. Artifact schemas also become versioned; deferral extends to tests.
