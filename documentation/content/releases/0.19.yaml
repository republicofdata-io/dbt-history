walkthrough:
  id: wt-0.19
  learning_objective: |
    See how a snapshot records that a customer disappeared from the source, without erasing their past.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is customer-removed. Each state below is an authored illustration.
  dataset_variant: customer-removed
  steps:
    - id: current
      title: 'Before the deletion: the customer is still in the feed'
      explanation: >
        You are looking at two files. The first is the snapshot definition. The highlighted lines 2 to 5 set
        it up: it watches the customers table, keyed by customer_id, and records a new version whenever the
        city changes. The setting invalidate_hard_deletes=True is the new part. It tells dbt to also react
        when a row disappears. The second file is a plain query for customer 6. The highlighted line 3 picks
        that customer. The result panel shows the row as it is today: Finn, in Montréal.
      state:
        kind: comparison
        title: Customer 6 as seen before the deletion
        columns:
          - customer_id
          - name
          - city
        rows:
          - - 6
            - Finn
            - Montréal
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Before anything is deleted, the snapshot holds one open, current version of customer 6.
      evidence:
        - src-1
        - src-2
        - src-4
      code:
        - language: sql
          filename: snapshots/customers_history.sql
          content: |
            -- Fixture phase: Before the declared customer deletion.
            {% snapshot customers_history %}
            {{ config(target_schema="snapshots", unique_key="customer_id",
                strategy="check", check_cols=["city"], invalidate_hard_deletes=True) }}
            select * from raw.customers
            {% endsnapshot %}
          highlight_lines:
            - 2
            - 3
            - 4
            - 5
        - language: sql
          filename: analyses/customer_before_delete.sql
          content: |
            -- Fixture phase: Before the declared customer deletion.
            select customer_id, name, city from raw.customers
            where customer_id = 6
          highlight_lines:
            - 3
          purpose: authored executable syntax; illustration only
      data_context:
        dataset_variant: base
        phase: Before the declared customer deletion.
    - id: missing
      title: The source row disappears, but the orders stay
      explanation: >
        The snapshot code is unchanged. The highlighted lines 1 to 4 are the same definition as before, still
        with the hard-delete setting on. What changed is the data. In this dataset variant, customer 6 has
        been removed from the customer feed only. The result panel shows the two sides: the customer is absent
        from the feed, while orders 1046 and 1052 still exist. Nobody refunded them and nobody deleted them.
      state:
        kind: comparison
        title: Customer 6 is gone from the feed, orders 1046 and 1052 remain
        columns:
          - customer_id
          - current feed
          - existing orders
        rows:
          - - 6
            - absent
            - 1046 and 1052 retained
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Deleting a customer from the source feed is not the same as removing or refunding their orders.
      code:
        - language: sql
          filename: snapshots/customers_history.sql
          content: |
            {% snapshot customers_history %}
            {{ config(target_schema="snapshots", unique_key="customer_id",
                strategy="check", check_cols=["city"], invalidate_hard_deletes=True) }}
            select * from raw.customers
            {% endsnapshot %}
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
      evidence:
        - src-1
        - src-2
        - src-4
    - id: close
      title: 'Run the snapshot: the history row gets an end date'
      explanation: >
        The command dbt snapshot runs the snapshot again and compares the feed with what it recorded last
        time. The highlighted lines 2 to 5 of the snapshot are the same definition. The hard-delete setting is
        what makes the next part happen. The query in the second file reads the snapshot table for customer 6.
        The highlighted lines 2 and 4 pick the customer and the two date columns, dbt_valid_from and
        dbt_valid_to, which mark when each version started and ended. The result panel shows the outcome: the
        history row for customer 6 is closed at March 9, 09:00. Nothing was deleted from the snapshot. Revenue
        is still 12,500 cents because the orders were never touched.
      state:
        kind: comparison
        title: Customer 6 history closed, revenue unchanged
        columns:
          - customer_id
          - history status
          - revenue total
        rows:
          - - 6
            - closed at March 9 09:00
            - 12500
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        The snapshot now says customer 6 was real until March 9 and is no longer current, and every past order
        keeps its history.
      evidence:
        - src-1
        - src-2
        - src-4
      code:
        - language: sql
          filename: snapshots/customers_history.sql
          content: |
            -- Fixture phase: After deletion has been observed by the snapshot.
            {% snapshot customers_history %}
            {{ config(target_schema="snapshots", unique_key="customer_id",
                strategy="check", check_cols=["city"], invalidate_hard_deletes=True) }}
            select * from raw.customers
            {% endsnapshot %}
          highlight_lines:
            - 2
            - 3
            - 4
            - 5
        - language: sql
          filename: analyses/closed_customer.sql
          content: |
            -- Fixture phase: After deletion has been observed by the snapshot.
            select customer_id, city, dbt_valid_from, dbt_valid_to
            from snapshots.customers_history
            where customer_id = 6
            order by dbt_valid_from
          highlight_lines:
            - 2
            - 4
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt snapshot
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
      data_context:
        dataset_variant: customer-removed
        phase: After deletion has been observed by the snapshot.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
