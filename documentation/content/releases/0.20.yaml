id: '0.20'
label: v0.20
title: Actionable data-test failures
lead: >
  Failed test rows can be stored for inspection. The shop can investigate the actual orphan payment instead
  of
  stopping at a failure count.
problem_then: |
  A red test tells a team something is wrong, but finding the offending records can require another query.
what_changed:
  - id: change-1
    summary: Store test failures in the database.
    introduced_in: 0.20.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Test where/limit/warn_if/error_if/fail_calc configuration; experimental parser.
    introduced_in: 0.20.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
in_practice: |
  Keep the failures as an inspectable relation where the adapter and permissions allow it.
technical_detail: >
  The singular test below returns violating rows. store_failures persists those rows; the displayed relation
  name is illustrative, not a promise about a target schema. Test thresholds and row filters are additional
  release features.
milestones:
  - id: 0.20.0
    kind: package
    date: '2021-07-12'
    precision: day
    title: First published package
    evidence:
      - src-2
sources:
  - id: src-1
    title: dbt 0.20 release evidence
    url: https://github.com/dbt-labs/dbt/releases/tag/v0.20.0
