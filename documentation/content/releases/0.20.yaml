walkthrough:
  id: wt-0.20
  learning_objective: |
    Move from a failure count to the offending record.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is orphan-payment. Each state below is an authored illustration.
     In this snippet, ref("payments") and ref("orders") mean pass-through staging models with exactly the corresponding raw fixture rows.
  dataset_variant: orphan-payment
  steps:
  - id: count
    title: See the failed relationship
    explanation: |
      The orphan-payment variant contains one missing order reference.
    state:
      kind: result
      title: See the failed relationship
      columns:
      - assertion
      - expected failures
      - actual failures
      rows:
      - - payments have orders
        - 0
        - 1
      result_status: fail
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      One failed row needs investigation.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: tests/payments_have_orders.sql
      content: |
        select p.payment_id, p.order_id, p.amount_cents
        from {{ ref("payments") }} as p
        left join {{ ref("orders") }} as o on p.order_id = o.order_id
        where o.order_id is null
      highlight_lines:
      - 3
      - 4
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/count_orphans.sql
      content: |
        select count(*) as actual_violations
        from {{ ref("payments") }} as p
        left join {{ ref("orders") }} as o on p.order_id = o.order_id
        where o.order_id is null
      highlight_lines:
      - 1
      - 4
      purpose: authored executable syntax; illustration only
  - id: test
    title: Store the failing rows
    explanation: |
      The test returns only payments without matching orders.
    state:
      kind: comparison
      title: Store the failing rows
      columns:
      - test configuration
      - value
      rows:
      - - store_failures
        - true
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The test query defines the records worth keeping.
    code:
    - language: sql
      filename: tests/payments_have_orders.sql
      content: |
        {{ config(store_failures=true) }}
        select p.payment_id, p.order_id, p.amount_cents
        from {{ ref("payments") }} p
        left join {{ ref("orders") }} o on p.order_id = o.order_id
        where o.order_id is null
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    evidence:
    - src-1
    - src-2
    - src-3
  - id: inspect
    title: Inspect the prepared failure relation
    explanation: |
      This is the one violation calculated from the fixture.
       Expected violations: 0; actual violations: 1.
    state:
      kind: result
      title: Inspect the prepared failure relation
      columns:
      - payment_id
      - order_id
      - amount_cents
      rows:
      - - 2099
        - 9999
        - 400
      result_status: fail
      diagram: null
      expected_actual:
        expected_violations: 0
        actual_violations: 1
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The 400 cents stay unattributed until the missing relationship is resolved.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: tests/payments_have_orders.sql
      content: |
        {{ config(store_failures=true) }}
        select p.payment_id, p.order_id, p.amount_cents
        from {{ ref("payments") }} p
        left join {{ ref("orders") }} o on p.order_id = o.order_id
        where o.order_id is null
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    - language: sql
      filename: inspection/stored_failures.sql
      content: |
        -- Default audit schema with target.schema = waffle.
        select payment_id, order_id, amount_cents
        from waffle_dbt_test__audit.payments_have_orders;
      highlight_lines:
      - 2
      - 3
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt test --select payments_have_orders
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    - src-3
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The stored-failure inspection assumes the default audit schema and target.schema=waffle; permissions must allow its creation. A custom schema macro would change the physical name.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Save failing test rows in the database for inspection.
    - Configure test filters, limits and warning or error thresholds.
    scenario: |
      A relationship test finds one payment whose order is missing. The shop needs the offending row, not just a red test count.
    outcome: |
      See the test SQL, persistence setting and the exact 400-cent violation.
status: reviewed
