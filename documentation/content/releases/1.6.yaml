walkthrough:
  id: wt-1.6
  learning_objective: >
    See how dbt retry reruns only the models that failed or were skipped, without redoing the work that
    succeeded.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: partial
      title: Look at what the failed run left behind
      explanation: |-
        Highlighted lines 1 and 2 of refunds_by_order and payments_by_order total their separate feeds. The panel shows a prepared connection-outage scenario: payments succeeded, refunds errored, and the three models downstream of refunds were skipped. The failure is assumed to come from the connection, not a change in either calculation.
      state:
        kind: comparison
        title: Prepared prior run record
        columns:
          - model
          - prior result
        rows:
          -   - payments_by_order
              - success
          -   - refunds_by_order
              - error
          -   - order_amounts
              - skipped
          -   - order_revenue
              - skipped
          -   - revenue_by_location
              - skipped
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >
        dbt keeps a record of which models succeeded, failed or were skipped, and that record is what a retry
        works from.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-1-6-0
        - alignment-postgres
      code:
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/payments_by_order.sql
          content: |
            select order_id, sum(amount_cents) as payment_cents
            from {{ ref("payments") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
    - id: repair
      title: Fix the cause, then run dbt retry
      explanation: |-
        Highlighted line 1 of the command runs dbt retry. With the connection restored, it uses the saved result record to rerun failed and skipped work. The panel confirms those prerequisites: a repaired connection and the prior results available. The SQL happens to be unchanged here, but unchanged SQL isn't a requirement for retry.
      state:
        kind: comparison
        title: Prepared recovery context
        columns:
          - item
          - state
        rows:
          -   - connection
              - restored
          -   - cause
              - outside the business SQL
          -   - prior run_results.json
              - available
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        With the connection restored, retry can use the prior result record to finish the failed branch.
      code:
        - language: shell
          filename: commands.sh
          content: |
            dbt retry
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-1-6-0
        - alignment-postgres
    - id: finish
      title: Check the recovered numbers
      explanation: |
        After the retry, the refunds total and the revenue model are built. Highlighted lines 3 to 5 in revenue_by_location sum payments, refunds and revenue for each location. The result panel shows the base figures: 3,400, 4,300 and 4,800 cents, which add up to 12,500. A recovered run should land on exactly the numbers a clean run would.
      state:
        kind: table
        title: Base revenue by location
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          -   - 1
              - Old Port
              - 4400
              - 1000
              - 3400
          -   - 2
              - Mile End
              - 4600
              - 300
              - 4300
          -   - 3
              - Riverside
              - 4800
              - 0
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        After the retry, revenue by location matches the base figures, so the recovery is complete.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-1-6-0
        - alignment-postgres
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
    - id: materialized_view
      title: Store the query result as a PostgreSQL materialized view
      explanation: |-
        Highlighted line 1 of revenue_by_location selects materialized_view, a database object that stores a query's result. The command creates it on the first PostgreSQL 1.6 run and can refresh it on a later run. The panel contrasts an ordinary view with this stored result. PostgreSQL doesn't refresh it automatically after every input change.
      state:
        kind: comparison
        title: View compared with a PostgreSQL materialized view
        columns:
          - object
          - on read
          - refresh
        rows:
          -   - view
              - execute its SELECT
              - read current inputs each time
          -   - materialized view
              - read stored result
              - REFRESH MATERIALIZED VIEW on an appropriate dbt run
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: The model can use PostgreSQL’s stored-view result, with refreshes handled explicitly.
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            {{ config(materialized="materialized_view") }}
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt run --select revenue_by_location
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-1-6-0
        - alignment-postgres
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - alignment-1-6-0
      - alignment-postgres
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The shown SQL is the work interrupted by an assumed external connection outage. No SQL statement manufactures that outage or proves recovery; retry requires the genuine prior run artifacts in an actual environment.
      The PostgreSQL materialized view stores results until an explicit refresh; it is not continuously updated. Clone is outside this walkthrough because PostgreSQL does not provide the zero-copy clone recipe. The outage remains an assumed scenario, not a captured failure (alignment-postgres and src-1).
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Rerun just the failed and skipped models from the last command, using the record dbt saved.
      - Build a PostgreSQL model as a materialized view, a stored result refreshed explicitly.
    scenario: >
      A run is halfway done when the database connection drops. The payments total finished, but the refunds
      total failed and the revenue model never ran. Once the connection is back, the shop wants to finish
      the
      run without rebuilding what already worked.
    outcome: >-
      See failed and skipped work retried, the restored 12,500-cent result, and a PostgreSQL materialized-view
      definition.
  title: |-
    Demo: retry an interrupted branch and store a materialized view
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
