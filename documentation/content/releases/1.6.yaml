walkthrough:
  id: wt-1.6
  learning_objective: >
    See how dbt retry reruns only the models that failed or were skipped, without redoing the work that
    succeeded.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: partial
      title: Look at what the failed run left behind
      explanation: >
        You are looking at the three models the run touches. The highlighted lines show how they depend on
        each other. refunds_by_order reads the raw refunds. order_amounts joins in both the payments and
        refunds totals. order_revenue subtracts one from the other. The result panel shows the state dbt
        recorded: payments_by_order succeeded, refunds_by_order failed, and order_revenue was skipped because
        its input never arrived.
      state:
        kind: comparison
        title: What the last run recorded
        columns:
          - model
          - prior result
        rows:
          - - payments_by_order
            - success
          - - refunds_by_order
            - error
          - - order_revenue
            - skipped
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        dbt keeps a record of which models succeeded, failed or were skipped, and that record is what a retry
        works from.
      evidence:
        - src-1
        - src-2
      code:
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
    - id: repair
      title: Fix the cause, then run dbt retry
      explanation: >
        The SQL is the same as before. Nothing in the business logic was wrong. The only new line is the
        highlighted command, dbt retry. It reruns the failed and skipped models and leaves the successful ones
        alone. The result panel lists what has to be true first: the connection is restored, the SQL is
        unchanged and the saved run record is still there.
      state:
        kind: comparison
        title: Conditions before the retry
        columns:
          - condition
          - prepared state
        rows:
          - - connection
            - restored
          - - business SQL
            - unchanged
          - - prior artifacts
            - available
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Retry finishes the run once the cause is fixed. It does not fix the cause for you.
      code:
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
        - language: shell
          filename: commands.sh
          content: |
            dbt retry
          highlight_lines:
            - 1
      evidence:
        - src-1
        - src-2
    - id: finish
      title: Check the recovered numbers
      explanation: >
        After the retry, the refunds total and the revenue model are built. The highlighted lines in
        revenue_by_location sum payments, refunds and revenue for each location. The result panel shows the
        base figures: 3,400, 4,300 and 4,800 cents, which add up to 12,500. A recovered run should land on
        exactly the numbers a clean run would.
      state:
        kind: table
        title: Base revenue by location
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - 1
            - Old Port
            - 4400
            - 1000
            - 3400
          - - 2
            - Mile End
            - 4600
            - 300
            - 4300
          - - 3
            - Riverside
            - 4800
            - 0
            - 4800
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        After the retry, revenue by location matches the base figures, so the recovery is complete.
      evidence:
        - src-1
        - src-2
      code:
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
