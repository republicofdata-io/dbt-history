    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      The shown SQL is the work interrupted by an assumed external connection outage. No SQL statement
      manufactures that outage or proves recovery; retry requires the genuine prior run artifacts in an actual
      environment.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Rerun just the failed and skipped models from the last command, using the record dbt saved.
      - Copy an existing table or view instead of rebuilding it, on databases that support cloning.
      - >-
        Build a model as a materialized view, a stored query result the database keeps fresh, where the
        database supports it.
    scenario: >
      A run is halfway done when the database connection drops. The payments total finished, but the refunds
      total failed and the revenue model never ran. Once the connection is back, the shop wants to finish the
      run without rebuilding what already worked.
    outcome: >
      Read the three models involved, see which ones need to run again, and check that the recovered revenue
      figures match the base numbers. The outage is an illustration, not captured output.
  title: |
    Demo: a retry picks up where a failed run stopped
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
