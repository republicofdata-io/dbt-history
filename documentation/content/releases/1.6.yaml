walkthrough:
  id: wt-1.6
  learning_objective: |
    Recover from a partial run without pretending the failure disappeared.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: partial
    title: Read the prepared prior results
    explanation: |
      Assume a transient connection failure while building the refund aggregate.
    state:
      kind: comparison
      title: Read the prepared prior results
      columns:
      - model
      - prior result
      rows:
      - - payments_by_order
        - success
      - - refunds_by_order
        - error
      - - order_revenue
        - skipped
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The previous command contains useful progress information.
    evidence:
    - src-1
    - src-2
    code:
    - language: sql
      filename: models/refunds_by_order.sql
      content: |
        select order_id, sum(amount_cents) as refund_cents
        from {{ ref("refunds") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
  - id: repair
    title: Resolve the connection issue
    explanation: |
      The example assumes the external connection is restored before retry.
    state:
      kind: comparison
      title: Resolve the connection issue
      columns:
      - condition
      - prepared state
      rows:
      - - connection
        - restored
      - - business SQL
        - unchanged
      - - prior artifacts
        - available
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Retry is a recovery action, not a substitute for diagnosis.
    code:
    - language: sql
      filename: models/refunds_by_order.sql
      content: |
        select order_id, sum(amount_cents) as refund_cents
        from {{ ref("refunds") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
    - language: shell
      filename: commands.sh
      content: |
        dbt retry
      highlight_lines:
      - 1
    evidence:
    - src-1
    - src-2
  - id: finish
    title: Verify the recovered result
    explanation: |
      The base fixture still defines the expected answer.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Successful recovery should end with the same business checks.
    evidence:
    - src-1
    - src-2
    code:
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    - src-3
    - src-4
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The shown SQL is the work interrupted by an assumed external connection outage. No SQL statement manufactures that outage or proves recovery; retry requires the genuine prior run artifacts in an actual environment.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Retry a prior invocation’s unfinished work using its saved artifacts.
    - Clone relations or manage materialized views where the adapter supports them.
    scenario: |
      A transient connection issue interrupts the refund aggregate after other work finishes. The shop restores the connection and retries the unfinished branch.
    outcome: |
      Read the affected model and recovery command without mistaking a hypothetical outage for captured output.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
