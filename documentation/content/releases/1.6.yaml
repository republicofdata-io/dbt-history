id: '1.6'
label: v1.6
title: Recovery, cloning and semantic-model foundations
lead: |
  A failed command can be retried from its recorded state. Cloning and materialized views also expand deployment choices where adapters support them.
problem_then: |
  A transient failure can leave a large run partially complete. Restarting everything may repeat work unnecessarily.
what_changed:
- id: change-1
  summary: Retry, clone command and materialized-view support.
  introduced_in: 1.6.0
  adapter_constraints: Cloning and materialized-view behavior depend on the adapter.
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Semantic-model parsing and cross-project foundations.
  introduced_in: 1.6.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Inspect the failure, repair its cause and retry the previous invocation’s unfinished work.
technical_detail: |
  retry relies on recorded artifacts from the prior invocation. It is not a promise that retries fix incorrect SQL or that every adapter supports zero-copy cloning. Semantic-model parsing is distinct from hosted Semantic Layer availability.
