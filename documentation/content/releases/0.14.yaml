  intro:
    can_now:
    - Track changing records with the new snapshot workflow, replacing archives.
    - Choose whether a data test warns or errors.
    scenario: |
      Ada’s current city changes from Montréal to Québec. The shop needs to retain both observations without changing the location assigned to old orders.
    outcome: |
      Inspect the check-strategy snapshot and its two historical versions.
