id: '0.14'
label: v0.14
title: Snapshots replace archives
lead: |
  Snapshots preserve changes to mutable source records. Waffle Shop can remember a customer’s old city after the current record changes.
problem_then: |
  Reading only the latest customer table loses earlier values.
what_changed:
- id: change-1
  summary: Snapshots replace archives.
  introduced_in: 0.14.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Resource listing, RPC server and configurable test severity.
  introduced_in: 0.14.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Capture change history instead of overwriting the only available record.
technical_detail: |
  Snapshots replace archives. This check-strategy example watches city. Validity timestamps are conceptual observation boundaries; actual snapshot identifiers and run timestamps are not fabricated. run-operation has conflicting introduction evidence across 0.13 source and 0.14 notes, so no exact first-shipped claim is made here.
