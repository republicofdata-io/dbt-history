walkthrough:
  id: wt-0.14
  learning_objective: |
    Follow one changing customer through a snapshot.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is customer-city-change. Each state below is an authored illustration.
  dataset_variant: customer-city-change
  steps:
  - id: before
    title: Read the original customer
    explanation: |
      The base fixture gives Ada a Montréal address.
    state:
      kind: comparison
      title: Read the original customer
      columns:
      - customer_id
      - name
      - city
      rows:
      - - 1
        - Ada
        - Montréal
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The current source initially contains one value.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: snapshots/customers_history.sql
      content: |
        -- Fixture phase: Before the declared customer-city change.
        {% snapshot customers_history %}
        {{ config(target_schema="snapshots", unique_key="customer_id",
            strategy="check", check_cols=["city"]) }}
        select customer_id, name, city from raw.customers
        {% endsnapshot %}
      highlight_lines:
      - 3
      - 4
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/current_customer.sql
      content: |
        -- Fixture phase: Before the declared customer-city change.
        select customer_id, name, city from raw.customers
        where customer_id = 1
      highlight_lines:
      - 3
      purpose: authored executable syntax; illustration only
    data_context:
      dataset_variant: base
      phase: Before the declared customer-city change.
  - id: change
    title: Observe the declared update
    explanation: |
      The customer-city-change variant changes city at the named second observation.
    state:
      kind: comparison
      title: Observe the declared update
      columns:
      - customer_id
      - before
      - after
      - observed_utc
      rows:
      - - 1
        - Montréal
        - Québec
        - 2016-03-09 09:00
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The source now exposes only the new city.
    code:
    - language: sql
      filename: snapshots/customers_history.sql
      content: |
        {% snapshot customers_history %}
        {{ config(target_schema="snapshots", unique_key="customer_id",
            strategy="check", check_cols=["city"]) }}
        select * from raw.customers
        {% endsnapshot %}
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    evidence:
    - src-1
    - src-2
    - src-3
  - id: history
    title: Keep both versions
    explanation: |
      These are human-readable history intervals, not captured dbt metadata.
    state:
      kind: comparison
      title: Keep both versions
      columns:
      - customer_id
      - city
      - interval
      rows:
      - - 1
        - Montréal
        - first observation until March 9 09:00
      - - 1
        - Québec
        - March 9 09:00 onward
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      History preserves the change; order-location revenue stays 12,500 cents.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: snapshots/customers_history.sql
      content: |
        -- Fixture phase: After the second snapshot observation.
        {% snapshot customers_history %}
        {{ config(target_schema="snapshots", unique_key="customer_id",
            strategy="check", check_cols=["city"]) }}
        select customer_id, name, city from raw.customers
        {% endsnapshot %}
      highlight_lines:
      - 3
      - 4
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/customer_history.sql
      content: |
        -- Fixture phase: After the second snapshot observation.
        select customer_id, city, dbt_valid_from, dbt_valid_to
        from snapshots.customers_history
        where customer_id = 1
        order by dbt_valid_from
      highlight_lines:
      - 2
      - 5
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt snapshot
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    data_context:
      dataset_variant: customer-city-change
      phase: After the second snapshot observation.
  evidence:
