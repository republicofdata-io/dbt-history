walkthrough:
  id: wt-0.14
  learning_objective: |
    Watch one customer record change and see how a snapshot keeps both the old and new value with dates.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is customer-city-change. Each state below is an authored
    illustration.
  dataset_variant: customer-city-change
  steps:
    - id: before
      title: Ada's record before the change
      explanation: >-
        Highlighted lines 2 and 3 set up a snapshot, a table of earlier row versions. customer_id identifies
        the row, and check_cols watches city for changes. Highlighted line 2 of the inspection query picks
        customer 1. The panel shows Ada in Montréal before the declared change.
      state:
        kind: comparison
        title: Ada's record before the change
        columns:
          - customer_id
          - name
          - city
        rows:
          -   - 1
              - Ada
              - Montréal
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >
        Before the change, the source table holds one value for Ada's city, and the snapshot is set to watch
        that column.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-0-14-0
      code:
        - language: sql
          filename: snapshots/customers_history.sql
          content: |
            {% snapshot customers_history %}
            {{ config(target_schema="snapshots", unique_key="customer_id",
                strategy="check", check_cols=["city"]) }}
            select customer_id, name, city from raw.customers
            {% endsnapshot %}
          highlight_lines:
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: analyses/current_customer.sql
          content: |
            select customer_id, name, city from raw.customers
            where customer_id = 1
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
      data_context:
        dataset_variant: base
        phase: Before the declared customer-city change.
    - id: change
      title: The source table is updated
      explanation: >-
        Highlighted lines 2 and 3 are the same snapshot settings. The named customer-city-change variant updates
        Ada’s city to Québec at 09:00 on March 9. The panel shows the old and new values; the current source
        now contains only Québec.
      state:
        kind: comparison
        title: Ada's city before and after the update
        columns:
          - customer_id
          - before
          - after
          - observed_utc
        rows:
          -   - 1
              - Montréal
              - Québec
              - 2016-03-09 09:00
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        After the update, the source table shows only Québec. Without a snapshot, Montréal would be lost.
      code:
        - language: sql
          filename: snapshots/customers_history.sql
          content: |
            {% snapshot customers_history %}
            {{ config(target_schema="snapshots", unique_key="customer_id",
                strategy="check", check_cols=["city"]) }}
            select customer_id, name, city from raw.customers
            {% endsnapshot %}
          highlight_lines:
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-0-14-0
    - id: history
      title: The snapshot keeps both versions
      explanation: >-
        Highlighted lines 2 and 3 keep the snapshot definition unchanged. After the second dbt snapshot observation,
        the inspection query reads its two validity dates, the times each saved version began and ended. The
        panel expresses those intervals in words: Montréal until March 9 at 09:00, then Québec onward.
      state:
        kind: comparison
        title: Ada's two dated rows in the snapshot
        columns:
          - customer_id
          - city
          - interval
        rows:
          -   - 1
              - Montréal
              - first observation until March 9 09:00
          -   - 1
              - Québec
              - March 9 09:00 onward
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >-
        The snapshot now retains both cities and their validity intervals.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-0-14-0
      code:
        - language: sql
          filename: snapshots/customers_history.sql
          content: |
            {% snapshot customers_history %}
            {{ config(target_schema="snapshots", unique_key="customer_id",
                strategy="check", check_cols=["city"]) }}
            select customer_id, name, city from raw.customers
            {% endsnapshot %}
          highlight_lines:
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: analyses/customer_history.sql
          content: |
            select customer_id, city, dbt_valid_from, dbt_valid_to
            from snapshots.customers_history
            where customer_id = 1
            order by dbt_valid_from
          highlight_lines:
            - 1
            - 4
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt snapshot
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
      data_context:
        dataset_variant: customer-city-change
        phase: After the second snapshot observation.
    - id: warning
      title: Warn about a large refund without failing the run
      explanation: 'Highlighted line 1 of the custom test sets severity to warn. Highlighted line 4 returns
        orders with refunds above 500 cents, a soft review rule. The base has one such order: 1044, refunded
        800 cents. The panel shows one warning, so this check does not turn the run into an error.'
      state:
        kind: result
        title: Refund review warning
        columns:
          - order_id
          - refund_cents
          - review_above_cents
        rows:
          -   - 1044
              - 800
              - 500
        result_status: warn
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: The large refund is visible as a warning instead of an error.
      code:
        - language: sql
          filename: tests/review_large_refunds.sql
          content: |
            {{ config(severity="warn") }}
            select order_id, refund_cents
            from {{ ref("refunds_by_order") }}
            where refund_cents > 500
          highlight_lines:
            - 1
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from raw.refunds
            group by order_id
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt test
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-0-14-0
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - alignment-0-14-0
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The warning is a custom SQL data test with config(severity="warn"), verified in 0.14.0; no later generic-test config layout is backported. Snapshot dates are declared observation phases, not captured timestamps. No claim is made that this snapshot alone changes order attribution.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Keep a history of a table whose rows get overwritten, using a snapshot. Snapshots replace the older
        archive feature.
      - Decide per test whether a failure should stop the run as an error or just show a warning.
    scenario: >-
      Ada’s current customer row changes from Montréal to Québec. A snapshot preserves both versions, while
      a separate soft rule flags an unusually large refund for review.
    outcome: |-
      See two dated customer versions and one 800-cent refund reported as a warning.
  title: |-
    Demo: remember a customer move and warn about a large refund
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
