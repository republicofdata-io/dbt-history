    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      The concrete relationships test references both payments and orders; both are ancestors of order_revenue
      in the shown graph. It is therefore eligible to block that dependent branch. This clarifies the earlier
      simplified single-parent description without removing it.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Run seeds, snapshots, models and tests with one command, each in the order the data flows.
      - Let a failed test stop the models that sit after it, so bad data does not spread.
      - Tell an incremental model what to do when new columns show up in its source.
    scenario: >
      A payment for a missing order sits in the payments data. A test on the payments model catches it. Before
      this version, dbt run built every model and dbt test checked afterwards, so the revenue table would be
      rebuilt with the bad row before anyone knew. Now dbt build runs the test right after the payments model
      and skips everything after it if the test fails.
    outcome: >
      You will see where the test sits in the chain, what dbt build reports, and why the old revenue table
      still in the warehouse should not be trusted.
  title: |
    Demo: dbt build stops the revenue model when an upstream test fails
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
