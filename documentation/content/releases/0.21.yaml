id: '0.21'
label: v0.21
title: Build in dependency order
lead: |
  dbt build brings models and tests into one dependency-aware workflow. Downstream work can wait for upstream validation.
problem_then: |
  Running models and tests as unrelated commands makes it easier to publish a downstream result before noticing an upstream failure.
what_changed:
- id: change-1
  summary: dbt build runs seeds, snapshots, models and tests in DAG order.
  introduced_in: 0.21.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: on_schema_change for incremental models; state detects macro changes.
  introduced_in: 0.21.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Build the selected graph with its checks in the relevant order.
technical_detail: |
  The illustration assumes a selected upstream relationship test on the payment staging model and an ordinary single-parent failure barrier. Actual blocking rules depend on test dependencies and selection. Incremental schema-change handling is another feature, not a historical backfill guarantee.
