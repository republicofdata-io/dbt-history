    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The concrete relationships test references both payments and orders; both are ancestors of order_revenue in the shown graph. It is therefore eligible to block that dependent branch. This clarifies the earlier simplified single-parent description without removing it.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Build seeds, snapshots, models and tests together in dependency order.
    - Choose how an incremental model handles schema changes.
    scenario: |
      An orphan payment reaches the staging model. The shop needs its upstream check to block a fresh-looking downstream revenue build.
    outcome: |
      Follow the test definition and build command, and distinguish an existing old table from newly validated output.
status: reviewed
