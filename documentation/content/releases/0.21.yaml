walkthrough:
  id: wt-0.21
  learning_objective: |
    See a test prevent an untrustworthy downstream build.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is orphan-payment. Each state below is an authored illustration.
  dataset_variant: orphan-payment
  steps:
  - id: graph
    title: Place a check before revenue
    explanation: |
      The selected payment staging model includes the orphan row.
    state:
      kind: comparison
      title: Place a check before revenue
      columns:
      - stage
      - dependency
      rows:
      - - stage payments
        - raw payments
      - - payments-have-orders test
        - staged payments
      - - order_revenue
        - staged payments
      result_status: null
      diagram: null
    takeaway: |
      The test is part of the build graph.
  - id: build
    title: Build with the failing assertion
    explanation: |
      Expected missing references are zero; actual is one.
    state:
      kind: result
      title: Build with the failing assertion
      columns:
      - resource
      - prepared result
      rows:
      - - payment relationship test
        - 'fail: expected 0, actual 1'
      - - dependent revenue model
        - skip because upstream test failed
      result_status: fail
      diagram: null
    takeaway: |
      The shop should not publish a fresh-looking result from a failed branch.
    code:
    - language: shell
      filename: commands.sh
      content: |
        dbt build
      highlight_lines: []
  - id: limit
    title: Read the existing result carefully
    explanation: |
      An old relation may still exist after the new build is blocked.
    state:
      kind: comparison
      title: Read the existing result carefully
      columns:
      - existing base total
      - freshly validated output
      rows:
      - - 12500
        - not produced by this failed build
      result_status: null
      diagram: null
    takeaway: |
      A table’s existence is not proof that the latest build passed.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt execution.
