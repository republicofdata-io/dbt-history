  - id: limit
    title: Read the existing result carefully
    explanation: |
      An old relation may still exist after the new build is blocked.
    state:
      kind: comparison
      title: Read the existing result carefully
      columns:
      - existing base total
      - freshly validated output
      rows:
      - - 12500
        - not produced by this failed build
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A table’s existence is not proof that the latest build passed.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: inspection/existing_revenue.sql
      content: |
        -- Read the relation retained from the last successful build.
        select sum(revenue_cents) as existing_total_cents
        from waffle.revenue_by_location;
      highlight_lines:
      - 2
      - 3
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: payments
            columns:
