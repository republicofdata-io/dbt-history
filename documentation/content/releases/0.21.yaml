walkthrough:
  id: wt-0.21
  learning_objective: |
    See a test prevent an untrustworthy downstream build.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is orphan-payment. Each state below is an authored illustration.
  dataset_variant: orphan-payment
  steps:
  - id: graph
    title: Place a check before revenue
    explanation: |
      The selected payment staging model includes the orphan row.
    state:
      kind: comparison
      title: Place a check before revenue
      columns:
      - stage
      - dependency
      rows:
      - - stage payments
        - raw payments
      - - payments-have-orders test
        - staged payments
      - - order_revenue
        - staged payments
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The test is part of the build graph.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: models/payments.sql
      content: |
        select payment_id, order_id, amount_cents
        from raw.payments
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: payments
            columns:
              - name: order_id
                tests:
                  - not_null
                  - relationships:
                      to: ref("orders")
                      field: order_id
      highlight_lines:
      - 8
      - 9
      - 10
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
    - language: sql
      filename: models/payments_by_order.sql
      content: |
        select order_id, sum(amount_cents) as payment_cents
        from {{ ref("payments") }}
        group by order_id
      highlight_lines:
      - 2
  - id: build
    title: Build with the failing assertion
    explanation: |
      Expected missing references are zero; actual is one.
    state:
      kind: result
      title: Build with the failing assertion
      columns:
      - resource
      - prepared result
      rows:
      - - payment relationship test
        - 'fail: expected 0, actual 1'
      - - dependent revenue model
        - skip because upstream test failed
      result_status: fail
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The shop should not publish a fresh-looking result from a failed branch.
    code:
    - language: sql
      filename: models/payments.sql
      content: |
        select payment_id, order_id, amount_cents
        from raw.payments
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: payments
            columns:
              - name: order_id
                tests:
                  - not_null
                  - relationships:
                      to: ref("orders")
                      field: order_id
      highlight_lines:
      - 8
      - 9
      - 10
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
    - language: sql
      filename: models/payments_by_order.sql
      content: |
        select order_id, sum(amount_cents) as payment_cents
        from {{ ref("payments") }}
