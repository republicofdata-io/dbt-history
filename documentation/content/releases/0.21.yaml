walkthrough:
  id: wt-0.21
  learning_objective: |
    See one command run models and tests in order, and refuse to build revenue on top of a failed check.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is orphan-payment. Each state below is an authored illustration.
  dataset_variant: orphan-payment
  steps:
    - id: graph
      title: Where the test sits in the chain
      explanation: |-
        Highlighted lines 8 to 10 of schema.yml require each payment's order_id to exist in orders. The diagram places that check between payments and the dependent revenue branch. It follows payments_by_order through order_amounts and order_revenue to revenue_by_location, showing how a failed check can block the final table.
      state:
        kind: diagram
        title: Payment test guards the revenue branch
        columns: []
        rows: []
        result_status:
        diagram:
          nodes:
            - id: payments
              label: payments
            - id: orders
              label: orders
            - id: payments_by_order
              label: payments_by_order
            - id: order_amounts
              label: order_amounts
            - id: order_revenue
              label: order_revenue
            - id: revenue_by_location
              label: revenue_by_location
          edges:
            - from: payments
              to: payments_by_order
            - from: payments_by_order
              to: order_amounts
            - from: orders
              to: order_amounts
            - from: order_amounts
              to: order_revenue
            - from: order_revenue
              to: revenue_by_location
          highlight:
            - payments
            - orders
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The test is a step in the chain, sitting between the payments model and the revenue models.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: payments
                columns:
                  - name: order_id
                    tests:
                      - not_null
                      - relationships:
                          to: ref("orders")
                          field: order_id
          highlight_lines:
            - 8
            - 9
            - 10
          purpose: authored executable syntax; illustration only
    - id: build
      title: 'Run dbt build: the test fails and revenue is skipped'
      explanation: |-
        Highlighted lines 8 to 10 of schema.yml retain the payment-to-order rule. The command runs dbt build, which orders model creation and tests together. The panel reports one missing parent and skips the dependent revenue branch, including revenue_by_location. That's the table inspected on the next screen.
      state:
        kind: result
        title: Test fails, revenue model skipped
        columns:
          - resource
          - prepared result
        rows:
          -   - payment relationship test
              - 'fail: expected 0, actual 1'
          -   - revenue_by_location and its dependent-input branch
              - skipped after the failed upstream test
        result_status: fail
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Because the payments test failed, dbt build did not rebuild the revenue model at all.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: payments
                columns:
                  - name: order_id
                    tests:
                      - not_null
                      - relationships:
                          to: ref("orders")
                          field: order_id
          highlight_lines:
            - 8
            - 9
            - 10
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt build
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
    - id: limit
      title: The old revenue table still exists, so read it carefully
      explanation: |-
        existing_revenue.sql is a plain query for inspecting a stored result, not a model. Its highlighted lines 2 and 3 sum the revenue table left from the last successful build. The panel shows 12,500 cents, the correct base total. This failed build produced no new revenue table; the stored one predates the bad payment.
      state:
        kind: comparison
        title: Old total 12,500 cents; nothing new was produced
        columns:
          - existing base total
          - freshly validated output
        rows:
          -   - 12500
              - not produced by this failed build
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >
        A revenue table that exists is not proof the latest build passed. This one is left over from before
        the failure.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: sql
          filename: inspection/existing_revenue.sql
          content: |
            -- Read the relation retained from the last successful build.
            select sum(revenue_cents) as existing_total_cents
            from jaffle.revenue_by_location;
          highlight_lines:
            - 2
            - 3
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The concrete relationships test references both payments and orders; both are ancestors of order_revenue in the shown graph. It is therefore eligible to block that dependent branch. This clarifies the earlier simplified single-parent description without removing it.
      on_schema_change remains release context only (src-1). The existing jaffle.revenue_by_location table in the last step is explicitly the previous successful base build, not a fresh result of this failed build.
      historical-0.21-02: Keep failed-test blocking behavior; the test has both orders and payments as ancestors of the dependent revenue branch. Evidence: src-1, src-2, src-3.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Build models and run their tests in dependency order with one command.
      - Skip dependent revenue models when an upstream test fails.
    scenario: >
      A payment for a missing order sits in the payments data. A test on the payments model catches it. Before
      this version, dbt run built every model and dbt test checked afterwards, so the revenue table would
      be
      rebuilt with the bad row before anyone knew. Now dbt build runs the test right after the payments model
      and skips everything after it if the test fails.
    outcome: |
      The walkthrough shows where the test sits in the chain, what dbt build reports, and why the old revenue table still in the warehouse should not be trusted.
  title: |
    Demo: dbt build stops the revenue model when an upstream test fails
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
