walkthrough:
  id: wt-1.11
  learning_objective: >
    See how a function that lives in the database can be defined in the project, deployed by dbt and tracked
    as a dependency of the models that call it.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: conversion
      title: Divide by 100, for display only
      explanation: >
        You are looking at three files. The highlighted line in cents_to_units.sql is the whole function body:
        divide by 100. The highlighted lines in the YAML file name the function, its one argument and the
        number type it returns. The highlighted line in revenue_display calls the function on revenue_cents.
        The result panel shows the effect: 1,000 cents becomes 10.00, and 3,400 cents becomes 34.00.
      state:
        kind: comparison
        title: Cents to units
        columns:
          - cents
          - units
        rows:
          - - 1000
            - '10.00'
          - - 3400
            - '34.00'
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        The function changes how revenue is shown, not how it is calculated. The accounting stays in cents.
      evidence:
        - src-1
        - src-2
        - src-6
        - src-7
        - src-8
      code:
        - language: sql
          filename: functions/cents_to_units.sql
          content: |
            amount_cents / 100.0
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: functions/cents_to_units.yml
          content: |
            functions:
              - name: cents_to_units
                config:
                  schema: finance_functions
                arguments:
                  - name: amount_cents
                    data_type: number
                returns:
                  data_type: number(18, 2)
          highlight_lines:
            - 2
            - 5
            - 6
            - 7
            - 8
            - 9
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_display.sql
          content: |
            select order_id, revenue_cents,
                {{ function("cents_to_units") }}(revenue_cents) as revenue_units
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
    - id: function
      title: dbt builds the function before the model
      explanation: >
        The files are the same. The highlighted command builds revenue_display and everything it depends on.
        The diagram shows that dependency: revenue_display needs both order_revenue and the cents_to_units
        function, so dbt creates the function first. Until now, a function like this lived outside the
        project, and dbt had no way to know a model depended on it.
      state:
        kind: diagram
        title: Function dependency
        columns: []
        rows: []
        result_status: null
        diagram:
          nodes:
            - id: fn
              label: cents_to_units function
            - id: revenue
              label: order_revenue
            - id: display
              label: revenue_display
          edges:
            - from: fn
              to: display
            - from: revenue
              to: display
          highlight:
            - fn
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Because the function is a project resource, dbt knows to deploy it before the model that calls it.
      evidence:
        - src-1
        - src-2
        - src-6
        - src-7
        - src-8
      code:
        - language: sql
          filename: functions/cents_to_units.sql
          content: |
            amount_cents / 100.0
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: functions/cents_to_units.yml
          content: |
            functions:
              - name: cents_to_units
                config:
                  schema: finance_functions
                arguments:
                  - name: amount_cents
                    data_type: number
                returns:
                  data_type: number(18, 2)
          highlight_lines:
            - 2
            - 5
            - 6
            - 7
            - 8
            - 9
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_display.sql
          content: |
            select order_id, revenue_cents,
                {{ function("cents_to_units") }}(revenue_cents) as revenue_units
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt build --select +revenue_display
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
    - id: distinction
      title: Function or macro?
      explanation: >
        Two extra files appear. The macro, in macros/cents_to_units.sql, is a template. When dbt compiles the
        project it pastes the highlighted expression into the model's SQL, and the database never sees the
        macro itself. The function, by contrast, is created in the database and called when the query runs.
        The result panel sets the two side by side and confirms the base total is still 12,500 cents.
      state:
        kind: comparison
        title: Macro versus function
        columns:
          - mechanism
          - where it acts
        rows:
          - - Jinja macro
            - generates SQL during compilation
          - - warehouse UDF
            - deployed function called by warehouse SQL
          - - base accounting total
            - 12,500 cents remains unchanged
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        A macro writes SQL before it runs. A function is stored in the database and runs there. Both give
        34.00 for 3,400 cents.
      evidence:
        - src-1
        - src-2
        - src-6
        - src-7
        - src-8
      code:
        - language: sql
          filename: functions/cents_to_units.sql
          content: |
            amount_cents / 100.0
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: functions/cents_to_units.yml
          content: |
            functions:
              - name: cents_to_units
                config:
                  schema: finance_functions
                arguments:
                  - name: amount_cents
                    data_type: number
                returns:
                  data_type: number(18, 2)
          highlight_lines:
            - 2
            - 5
            - 6
            - 7
            - 8
            - 9
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_display.sql
          content: |
            select order_id, revenue_cents,
                {{ function("cents_to_units") }}(revenue_cents) as revenue_units
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
        - language: jinja
          filename: macros/cents_to_units.sql
          content: |
            {% macro cents_to_units_sql(column_name) %}
              ({{ column_name }} / 100.0)
            {% endmacro %}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_display_macro.sql
          content: |
            select order_id,
                {{ cents_to_units_sql("revenue_cents") }} as revenue_units
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 2
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
