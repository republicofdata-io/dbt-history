    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The concrete UDF recipe is Snowflake SQL: an expression body, arguments/returns properties and function() reference. These fields were checked in the 1.11.0 parser/contracts; it is not a portable promise for every adapter. Function deployment still requires a compatible adapter and warehouse privileges.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Manage supported warehouse functions as project resources.
    - Make model references to those functions visible in the dependency graph.
    scenario: |
      The shop keeps revenue in cents but wants a reusable warehouse function for currency-unit display. Unlike a macro, the deployed function can be called by warehouse SQL.
    outcome: |
      Read the function body, properties and consuming model on a named supported adapter.
status: reviewed
