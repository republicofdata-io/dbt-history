walkthrough:
  id: wt-1.11
  learning_objective: |
    Distinguish SQL-generating macros from deployed warehouse functions.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: conversion
    title: Define a presentation calculation
    explanation: |
      Keep accounting in cents and present decimal units when needed.
    state:
      kind: comparison
      title: Define a presentation calculation
      columns:
      - cents
      - units
      rows:
      - - 1000
        - '10.00'
      - - 3400
        - '34.00'
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Dividing by 100 is presentation, not a new revenue definition.
    evidence:
    - src-1
    - src-2
    - src-6
    - src-7
    - src-8
    code:
    - language: sql
      filename: functions/cents_to_units.sql
      content: |
        amount_cents / 100.0
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: functions/cents_to_units.yml
      content: |
        functions:
          - name: cents_to_units
            config:
              schema: finance_functions
            arguments:
              - name: amount_cents
                data_type: number
            returns:
              data_type: number(18, 2)
      highlight_lines:
      - 2
      - 5
      - 6
      - 7
      - 8
      - 9
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_display.sql
      content: |
        select order_id, revenue_cents,
            {{ function("cents_to_units") }}(revenue_cents) as revenue_units
        from {{ ref("order_revenue") }}
      highlight_lines:
      - 2
      purpose: authored executable syntax; illustration only
  - id: function
    title: Make the function a dependency
    explanation: |
      The fictional cents_to_units function is a warehouse resource on a supported adapter.
    state:
      kind: diagram
      title: Function dependency
      columns: []
      rows: []
      result_status: null
      diagram:
        nodes:
        - id: fn
          label: cents_to_units function
        - id: revenue
          label: order_revenue
        - id: display
          label: revenue_display
        edges:
        - from: fn
          to: display
        - from: revenue
          to: display
        highlight:
        - fn
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The graph can describe deployment order for a shared function.
    evidence:
    - src-1
    - src-2
    - src-6
    - src-7
    - src-8
    code:
    - language: sql
      filename: functions/cents_to_units.sql
      content: |
        amount_cents / 100.0
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: functions/cents_to_units.yml
      content: |
        functions:
          - name: cents_to_units
            config:
              schema: finance_functions
            arguments:
              - name: amount_cents
                data_type: number
            returns:
              data_type: number(18, 2)
      highlight_lines:
      - 2
      - 5
      - 6
      - 7
      - 8
      - 9
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_display.sql
      content: |
        select order_id, revenue_cents,
            {{ function("cents_to_units") }}(revenue_cents) as revenue_units
        from {{ ref("order_revenue") }}
      highlight_lines:
      - 2
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt build --select +revenue_display
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
  - id: distinction
    title: Separate two reuse mechanisms
    explanation: |
      Both mechanisms can support the same calculation, but they operate at different stages.
    state:
      kind: comparison
      title: Separate two reuse mechanisms
      columns:
      - mechanism
      - where it acts
      rows:
      - - Jinja macro
        - generates SQL during compilation
      - - warehouse UDF
        - deployed function called by warehouse SQL
      - - base accounting total
        - 12,500 cents remains unchanged
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A function resource is not merely another spelling of a macro.
    evidence:
    - src-1
    - src-2
    - src-6
    - src-7
    - src-8
    code:
    - language: sql
      filename: functions/cents_to_units.sql
      content: |
        amount_cents / 100.0
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: functions/cents_to_units.yml
      content: |
        functions:
          - name: cents_to_units
            config:
              schema: finance_functions
            arguments:
              - name: amount_cents
                data_type: number
            returns:
              data_type: number(18, 2)
      highlight_lines:
      - 2
      - 5
      - 6
      - 7
      - 8
      - 9
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_display.sql
      content: |
        select order_id, revenue_cents,
            {{ function("cents_to_units") }}(revenue_cents) as revenue_units
        from {{ ref("order_revenue") }}
      highlight_lines:
      - 2
      purpose: authored executable syntax; illustration only
    - language: jinja
      filename: macros/cents_to_units.sql
      content: |
        {% macro cents_to_units_sql(column_name) %}
          ({{ column_name }} / 100.0)
        {% endmacro %}
      highlight_lines:
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_display_macro.sql
      content: |
        select order_id,
            {{ cents_to_units_sql("revenue_cents") }} as revenue_units
        from {{ ref("order_revenue") }}
      highlight_lines:
      - 2
