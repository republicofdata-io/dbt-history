id: '1.11'
label: v1.11
title: Functions become project resources
lead: |
  Warehouse functions become first-class project resources. A reusable calculation can appear as a dependency instead of living outside the project graph.
problem_then: |
  A warehouse function may be shared by many models while its definition and deployment order remain separate from the project.
what_changed:
- id: change-1
  summary: User-defined functions become DAG resources.
  introduced_in: 1.11.0
  adapter_constraints: Function languages and deployment support vary by adapter.
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Stricter config validation and DBT_ENGINE_ environment namespace.
  introduced_in: 1.11.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Manage supported function definitions with the project and make their consumers visible.
technical_detail: |
  UDF languages and deployment behavior depend on adapter support. This diagram demonstrates the resource relationship without inventing a portable CREATE FUNCTION statement. The first 1.11.0 and 1.11.1 artifacts were later yanked; 1.11.2 is the first non-yanked patch observed in this research.
