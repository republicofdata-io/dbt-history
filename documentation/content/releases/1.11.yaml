walkthrough:
  id: wt-1.11
  learning_objective: >
    See how a function that lives in the database can be defined in the project, deployed by dbt and tracked
    as a dependency of the models that call it.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: conversion
      title: Divide by 100, for display only
      explanation: >-
        This example targets Snowflake. Highlighted line 1 of functions/cents_to_units.sql divides by 100.
        Highlighted lines 2 and 5 to 9 of functions/cents_to_units.yml declare the function and its Snowflake
        number types. Highlighted line 2 of revenue_display calls it. The panel shows 1,000 cents becoming
        10.00, alongside the prepared location example of 3,400 becoming 34.00.
      state:
        kind: comparison
        title: Cents to units
        columns:
          - cents
          - units
        rows:
          - - 1000
            - '10.00'
          - - 3400
            - '34.00'
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        The function changes how revenue is shown, not how it is calculated. The accounting stays in cents.
      evidence:
        - src-1
        - src-2
        - src-6
        - src-7
        - src-8
        - src-3
        - src-4
        - src-5
        - alignment-1-11-0
      code:
        - language: sql
          filename: functions/cents_to_units.sql
          content: |
            amount_cents / 100.0
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: functions/cents_to_units.yml
          content: |
            functions:
              - name: cents_to_units
                config:
                  schema: finance_functions
                arguments:
                  - name: amount_cents
                    data_type: number
                returns:
                  data_type: number(18, 2)
          highlight_lines:
            - 2
            - 5
            - 6
            - 7
            - 8
            - 9
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_display.sql
          content: |
            select order_id, revenue_cents,
                {{ function("cents_to_units") }}(revenue_cents) as revenue_units
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
    - id: function
      title: dbt builds the function before the model
      explanation: >-
        Highlighted line 2 of revenue_display calls the function defined on the previous screen. Highlighted
        line 1 of the command builds this model and its dependencies. The diagram shows order_revenue and
        cents_to_units feeding revenue_display, so dbt deploys the function before the model that calls it.
      state:
        kind: diagram
        title: Function dependency
        columns: []
        rows: []
        result_status: null
        diagram:
          nodes:
            - id: fn
              label: cents_to_units
            - id: revenue
              label: order_revenue
            - id: display
              label: revenue_display
          edges:
            - from: fn
              to: display
            - from: revenue
              to: display
          highlight:
            - fn
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        Because the function is a project resource, dbt knows to deploy it before the model that calls it.
      evidence:
        - src-1
        - src-2
        - src-6
        - src-7
        - src-8
        - src-3
        - src-4
        - src-5
        - alignment-1-11-0
      code:
        - language: sql
          filename: models/revenue_display.sql
          content: |
            select order_id, revenue_cents,
                {{ function("cents_to_units") }}(revenue_cents) as revenue_units
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt build --select +revenue_display
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
    - id: distinction
      title: Function or macro?
      explanation: >-
        Highlighted line 2 of the macro inserts division by 100 into compiled SQL. Highlighted line 2 of
        revenue_display instead calls the stored function. The panel compares when each acts: the macro writes
        SQL during compilation, while the Snowflake function executes when the database runs the query.
      state:
        kind: comparison
        title: Macro versus function
        columns:
          - mechanism
          - where it acts
        rows:
          - - Jinja macro
            - generates SQL during compilation
          - - warehouse UDF
            - deployed function called by warehouse SQL
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: The macro emits a division expression; the function is a deployed database object called by SQL.
      evidence:
        - src-1
        - src-2
        - src-6
        - src-7
        - src-8
        - src-3
        - src-4
        - src-5
        - alignment-1-11-0
      code:
        - language: jinja
          filename: macros/cents_to_units.sql
          content: |
            {% macro cents_to_units_sql(column_name) %}
              ({{ column_name }} / 100.0)
            {% endmacro %}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_display.sql
          content: |
            select order_id, revenue_cents,
                {{ function("cents_to_units") }}(revenue_cents) as revenue_units
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
      - src-6
      - src-7
      - src-8
      - alignment-1-11-0
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      The concrete UDF recipe is Snowflake SQL: an expression body, arguments/returns properties and
      function() reference. These fields were checked in the 1.11.0 parser/contracts; it is not a portable
      promise for every adapter. Function deployment still requires a compatible adapter and warehouse
      privileges.

      The function() call and dependency edge were verified in the 1.11.0 context provider; the Snowflake
      adapter, types and expression-body assumption are now stated on screen. Empty table columns are expected
      for kind: diagram: its nodes and edges carry the picture. The diagram contains three nodes and two valid
      edges (alignment-1-11-0).

      review-1.11-02: Confirmed function(name) in the original 1.11 context provider and parser. Keep the call
      and cite exact-version source. Evidence: src-1, src-2, src-3, src-4, src-5, src-6, src-7, src-8,
      alignment-1-11-0.

      historical-1.11-02: The diagram has three nodes and two valid edges; empty table columns are normal for
      a diagram state. Evidence: src-1, src-2, src-3, src-4, src-5, src-6, src-7, src-8, alignment-1-11-0.

      historical-1.11-03: Confirmed function(name) in the original 1.11 context provider and parser. Keep the
      call and cite exact-version source. Evidence: src-1, src-2, src-3, src-4, src-5, src-6, src-7, src-8,
      alignment-1-11-0.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Define a database function in the project, with its arguments and return type, on databases that
        support this.
      - Have dbt create the function before the models that use it.
      - See the function in the dependency graph next to the models that call it.
    scenario: >-
      On Snowflake, the shop stores revenue in cents and wants a reusable database function to display units.
      It defines cents_to_units in the project, then calls it from a model. A final comparison shows how a
      stored function differs from a macro that writes SQL text.
    outcome: >
      Read the function body, its properties file and the model that calls it, and see where a function
      differs from a macro.
  title: |
    Demo: a database function joins the project as a dependency
status: reviewed
