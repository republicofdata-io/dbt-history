      - src-8
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      The concrete UDF recipe is Snowflake SQL: an expression body, arguments/returns properties and
      function() reference. These fields were checked in the 1.11.0 parser/contracts; it is not a portable
      promise for every adapter. Function deployment still requires a compatible adapter and warehouse
      privileges.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        Define a database function in the project, with its arguments and return type, on databases that
        support this.
      - Have dbt create the function for you, before the models that use it.
      - See the function in the dependency graph next to the models that call it.
    scenario: >
      The shop stores revenue in cents. For reports it wants a reusable way to show whole units, like 34.00
      instead of 3400. It creates a small database function, cents_to_units, and calls it from a display
      model. The walkthrough also shows how this differs from a macro, which only writes SQL text.
    outcome: >
      Read the function body, its properties file and the model that calls it, and see where a function
      differs from a macro.
  title: |
    Demo: a database function joins the project as a dependency
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
