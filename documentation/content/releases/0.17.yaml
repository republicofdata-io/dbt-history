id: '0.17'
label: v0.17
title: Safer execution and configurable sources
lead: >
  Fail-fast gives teams a way to stop sooner when a run fails. Path selection and richer project configuration
  help manage larger projects.
problem_then: >
  After a serious failure, continuing to schedule work may spend resources without helping the immediate
  investigation.
what_changed:
  - id: change-1
    summary: fail-fast and path-based selection.
    introduced_in: 0.17.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Source overrides/enablement; persist_docs support expands across warehouses.
    introduced_in: 0.17.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
in_practice: |
  Choose fail-fast deliberately for runs where early termination is useful.
technical_detail: >
  Fail-fast is not a transaction spanning the entire project and does not erase completed work. Work already
  running may have progressed. Persisted documentation remains adapter-dependent.
