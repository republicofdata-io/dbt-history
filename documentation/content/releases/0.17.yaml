walkthrough:
  id: wt-0.17
  learning_objective: |
    Compare ordinary failure handling with fail-fast.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: failure
    title: Introduce a hypothetical broken refund model
    explanation: |
      The fixture is unchanged; only the SQL is assumed invalid.
    state:
      kind: comparison
      title: Introduce a hypothetical broken refund model
      columns:
      - model
      - prepared outcome
      rows:
      - - refunds_by_order
        - error
      - - order_revenue
        - cannot safely build
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A broken dependency blocks its descendants.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: models/refunds_by_order.sql (deliberately invalid)
      content: |
        select order_id, sum(refund_amount_cents) as refund_cents
        from raw.refunds
        group by order_id
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
  - id: policy
    title: Choose an early-stop policy
    explanation: |
      The comparison describes scheduling intent, not exact parallel timing.
    state:
      kind: comparison
      title: Choose an early-stop policy
      columns:
      - policy
      - intent
      rows:
      - - normal run
        - independent branches may continue
      - - fail-fast
        - stop the invocation promptly after failure
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Fail-fast is useful when further work should wait.
    code:
    - language: sql
      filename: models/refunds_by_order.sql (deliberately invalid)
      content: |
        select order_id, sum(refund_amount_cents) as refund_cents
        from raw.refunds
        group by order_id
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
    - language: shell
      filename: commands.sh
      content: |
        dbt run --fail-fast
      highlight_lines:
      - 1
    evidence:
    - src-1
    - src-2
    - src-3
  - id: repair
    title: Repair before trying again
    explanation: |
      Completed database work is not automatically rolled back as one project transaction.
    state:
      kind: comparison
      title: Repair before trying again
      columns:
      - next action
      - reason
      rows:
      - - repair refund SQL
        - remove the failure
      - - rerun required models
        - restore consistent outputs
      - - 'check base total: 12500'
        - verify the business expectation
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Stopping early and rolling back everything are different operations.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: models/refunds_by_order.sql
      content: |
        select order_id, sum(amount_cents) as refund_cents
        from {{ ref("refunds") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_amounts.sql
      content: |
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from {{ ref("orders") }} as o
        left join {{ ref("payments_by_order") }} as p
          on o.order_id = p.order_id
        left join {{ ref("refunds_by_order") }} as r
          on o.order_id = r.order_id
      highlight_lines:
      - 3
      - 4
      - 6
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
