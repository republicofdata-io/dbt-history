  intro:
    can_now:
      - Tell dbt to stop the whole run as soon as one model fails, with the fail-fast flag.
      - Select models by the folder they live in.
    scenario: >
      The refund model has a typo and fails. Every model that depends on it, including revenue, cannot be
      trusted until it is fixed. Waffle Shop decides whether the rest of the run should keep going or stop
      right away.
    outcome: |
      Read the faulty SQL, the command that stops early, and the repaired model.
  title: |
    Demo: a broken refund model, and a flag that stops the run as soon as it fails
