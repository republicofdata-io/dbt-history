  intro:
    can_now:
    - Stop a run promptly after a failure with fail-fast.
    - Select models by their project path.
    scenario: |
      A broken refund model blocks a trustworthy revenue build. Waffle Shop chooses whether unrelated work should continue while the failure is investigated.
    outcome: |
      Read the faulty SQL, the early-stop command and the repaired model.
