walkthrough:
  id: wt-0.17
  learning_objective: >
    Compare a normal run, where other models keep going after a failure, with a fail-fast run that stops right
    away.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: failure
      title: A refund model with a typo
      explanation: >
        Three model files are shown. The first is the refund model, highlighted on line 1. It sums a column
        called refund_amount_cents, which does not exist in the refunds table. The real column is
        amount_cents. That model will fail. The order_amounts model, highlighted on lines 3, 4 and 6, joins
        orders to payments and to this broken refund model. The order_revenue model then subtracts refunds
        from payments. The result panel shows the outcome: the refund model errors, and revenue cannot be
        built. The data itself is unchanged. Only the SQL is wrong.
      state:
        kind: comparison
        title: The broken model and what it blocks
        columns:
          - model
          - prepared outcome
        rows:
          -   - refunds_by_order
              - error
          -   - order_revenue
              - cannot safely build
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        When one model fails, every model that reads from it cannot be built either.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: sql
          filename: models/refunds_by_order.sql (deliberately invalid)
          content: |
            select order_id, sum(refund_amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
          purpose: Authored era-specific example; illustration only.
    - id: policy
      title: Choose to stop the run early
      explanation: >-
        Highlighted line 1 of refunds_by_order is still the misspelled amount column. The command adds --fail-fast.
        The panel shows the failed refund model, its unbuilt descendants and the stopped invocation. It is
        a prepared outcome, not an exact parallel execution trace; work already completed remains in the database.
      state:
        kind: result
        title: Prepared fail-fast outcome, not a run log
        columns:
          - resource
          - outcome
        rows:
          -   - refunds_by_order
              - error
          -   - order_amounts
              - 'not built: depends on the error'
          -   - order_revenue
              - 'not built: depends on the error'
          -   - revenue_by_location
              - 'not built: depends on the error'
          -   - invocation
              - stopped after failure
        result_status: fail
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        Fail-fast stops the invocation promptly after an error; it does not undo completed models.
      code:
        - language: sql
          filename: models/refunds_by_order.sql (deliberately invalid)
          content: |
            select order_id, sum(refund_amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt run --fail-fast
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
    - id: repair
      title: Fix the model, then run again
      explanation: >-
        Highlighted line 1 fixes only the column name to amount_cents; line 2 keeps the same ref to refunds.
        The command selects the model by its file path, and the trailing + includes its descendants. The panel
        shows the repaired revenue branch: 3,400, 4,300 and 4,800 cents, totalling 12,500.
      state:
        kind: table
        title: 'Revenue after the repaired path is rebuilt'
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          -   - 1
              - Old Port
              - 4400
              - 1000
              - 3400
          -   - 2
              - Mile End
              - 4600
              - 300
              - 4300
          -   - 3
              - Riverside
              - 4800
              - 0
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >-
        Selecting the repaired file path and its descendants restores the revenue result.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt run --models path:models/refunds_by_order.sql+
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      Fail-fast statuses are a prepared schedule, not guaranteed native skip records from a concurrent aborted run. config-version: 2 also shipped in 0.17; it remains release context, outside these two demonstrated behaviors (src-1, v0.17.0 release notes).
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Tell dbt to stop the whole run as soon as one model fails, with the fail-fast flag.
      - Select models by the folder they live in.
    scenario: >
      The refund model has a typo and fails. Every model that depends on it, including revenue, cannot be
      trusted until it is fixed. Jaffle Shop decides whether the rest of the run should keep going or stop
      right away.
    outcome: |-
      See the typo stop the invocation, then a path-selected rebuild restore 12,500 cents.
  title: |-
    Demo: stop at a failure and rebuild the repaired file’s branch
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
