walkthrough:
  id: wt-0.17
  learning_objective: >
    Compare a normal run, where other models keep going after a failure, with a fail-fast run that stops right
    away.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: failure
      title: A refund model with a typo
      explanation: >
        Three model files are shown. The first is the refund model, highlighted on line 1. It sums a column
        called refund_amount_cents, which does not exist in the refunds table. The real column is
        amount_cents. That model will fail. The order_amounts model, highlighted on lines 3, 4 and 6, joins
        orders to payments and to this broken refund model. The order_revenue model then subtracts refunds
        from payments. The result panel shows the outcome: the refund model errors, and revenue cannot be
        built. The data itself is unchanged. Only the SQL is wrong.
      state:
        kind: comparison
        title: The broken model and what it blocks
        columns:
          - model
          - prepared outcome
        rows:
          - - refunds_by_order
            - error
          - - order_revenue
            - cannot safely build
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        When one model fails, every model that reads from it cannot be built either.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: sql
          filename: models/refunds_by_order.sql (deliberately invalid)
          content: |
            select order_id, sum(refund_amount_cents) as refund_cents
            from raw.refunds
            group by order_id
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
    - id: policy
      title: Choose to stop the run early
      explanation: >
        The same three model files are shown. The command file runs dbt with the fail-fast flag. In a normal
        run, models that do not depend on the broken one keep building while the failure is reported. With
        fail-fast, dbt stops the whole run as soon as the first failure happens. The result panel compares the
        two. It describes the intent, not the exact timing of models running in parallel.
      state:
        kind: comparison
        title: Normal run compared with fail-fast
        columns:
          - policy
          - intent
        rows:
          - - normal run
            - independent branches may continue
          - - fail-fast
            - stop the invocation promptly after failure
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Fail-fast stops the run at the first failure, so nothing else builds until the problem is looked at.
      code:
        - language: sql
          filename: models/refunds_by_order.sql (deliberately invalid)
          content: |
            select order_id, sum(refund_amount_cents) as refund_cents
            from raw.refunds
            group by order_id
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
        - language: shell
          filename: commands.sh
          content: |
            dbt run --fail-fast
          highlight_lines:
            - 1
      evidence:
        - src-1
        - src-2
        - src-3
    - id: repair
      title: Fix the model, then run again
      explanation: >
        Four files are shown. The refund model, highlighted on lines 1 and 2, now sums amount_cents and reads
        the refunds table through ref. The other three models are unchanged and are shown with their join and
        sum lines highlighted. Stopping early does not undo the models that already finished. They stay in the
        warehouse as they were. The result panel lists the next steps: fix the SQL, rerun the models that need
        it, and check that the total is 12,500 cents again.
      state:
        kind: comparison
        title: 'After the fix: what to run and why'
        columns:
          - next action
          - reason
        rows:
          - - repair refund SQL
            - remove the failure
          - - rerun required models
            - restore consistent outputs
          - - 'check base total: 12500'
            - verify the business expectation
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        Stopping early is not the same as undoing the run. After the fix, the affected models have to be
        rebuilt.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_amounts.sql
          content: |
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join {{ ref("payments_by_order") }} as p
              on o.order_id = p.order_id
            left join {{ ref("refunds_by_order") }} as r
              on o.order_id = r.order_id
          highlight_lines:
            - 3
            - 4
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
