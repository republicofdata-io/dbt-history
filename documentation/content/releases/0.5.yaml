walkthrough:
  id: wt-0.5
  learning_objective: |
    Use a project variable without changing the revenue measure.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: units
    title: Keep the source unit explicit
    explanation: |
      Amounts in the shared dataset are integer cents.
    state:
      kind: comparison
      title: Keep the source unit explicit
      columns:
      - location
      - revenue_cents
      rows:
      - - Old Port
        - 3400
      - - Mile End
        - 4300
      - - Riverside
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The source unit is part of the business contract.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
    code:
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
  - id: variable
    title: Apply a reusable conversion
    explanation: |
      The example provides cents_per_unit = 100 in project variables.
    state:
      kind: comparison
      title: Apply a reusable conversion
      columns:
      - variable
      - value
      rows:
      - - cents_per_unit
        - 100
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The calculation can read a named setting.
    code:
    - language: sql
      filename: models/revenue_display.sql
      content: |
        select location_id, revenue_cents / {{ var("cents_per_unit") }}.0 as revenue_units
        from {{ ref("revenue_by_location") }}
      highlight_lines:
      - 1
      - 2
    - language: yaml
      filename: dbt_project.yml (excerpt)
      content: |
        name: waffle_shop
        version: "1.0"
        models:
          waffle_shop:
            vars:
              cents_per_unit: 100
      highlight_lines:
      - 3
      - 5
      - 6
      purpose: authored executable syntax; illustration only
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
  - id: display
    title: Keep cents and display values together
    explanation: |
      Decimal division avoids dropping fractional currency units.
    state:
      kind: comparison
      title: Keep cents and display values together
      columns:
      - location
      - cents
      - display_units
      rows:
      - - Old Port
        - 3400
        - '34.00'
      - - Mile End
        - 4300
        - '43.00'
      - - Riverside
        - 4800
        - '48.00'
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Configuration changes representation, not underlying revenue.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
    code:
    - language: yaml
      filename: dbt_project.yml (excerpt)
      content: |
        name: waffle_shop
        version: "1.0"
        models:
          waffle_shop:
            vars:
              cents_per_unit: 100
      highlight_lines:
      - 3
      - 5
      - 6
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_display.sql
      content: |
        select location_id, revenue_cents,
            revenue_cents / {{ var("cents_per_unit") }}.0 as revenue_units
        from {{ ref("revenue_by_location") }}
      highlight_lines:
      - 2
      purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
