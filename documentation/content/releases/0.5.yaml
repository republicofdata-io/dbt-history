id: '0.5'
label: v0.5
title: Configuration, history and custom tests
lead: >
  Project variables make shared SQL configurable. This series also adds archives, PostgreSQL support and
  custom SQL tests in separate patches.
problem_then: >
  A reusable model needs a safe way to accept project-specific values, while teams also need more targets
  and
  checks.
what_changed:
  - id: change-1
    summary: Project variables and safer incremental writes.
    introduced_in: 0.5.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Archives and first-class PostgreSQL support.
    introduced_in: 0.5.1
    adapter_constraints: PostgreSQL becomes a first-class target here, not at project origin.
    evidence:
      - src-4
    confidence: high
  - id: change-3
    summary: Custom SQL data tests.
    introduced_in: 0.5.4
    adapter_constraints:
    evidence:
      - src-5
    confidence: high
in_practice: >
  Separate reusable calculations from configuration. Select the patch that actually contains the feature being
  discussed.
technical_detail: >
  Variables arrive in 0.5.0; archives and first-class PostgreSQL support in 0.5.1; custom SQL data tests in
  0.5.4. The cents conversion is presentation only and does not change the accounting definition.
