walkthrough:
  id: wt-0.5
  learning_objective: |
    Use a project variable to change how revenue is shown while leaving the revenue rule alone.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: variable
      title: Read one conversion setting
      explanation: >-
        Highlighted lines 5 and 6 of dbt_project.yml set cents_per_unit to 100. Highlighted line 2 of the
        display model reads it with var(), giving decimal division by 100.0. The panel places 3,400 cents
        beside 34.00, 4,300 beside 43.00 and 4,800 beside 48.00.
      state:
        kind: table
        title: Cents and display units
        columns:
          - location
          - revenue_cents
          - revenue_units
        rows:
          -   - Old Port
              - 3400
              - '34.00'
          -   - Mile End
              - 4300
              - '43.00'
          -   - Riverside
              - 4800
              - '48.00'
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The variable changes how the amount is shown, not the amount itself.
      code:
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            name: jaffle_shop
            version: "1.0"
            models:
              jaffle_shop:
                vars:
                  cents_per_unit: 100
          highlight_lines:
            - 5
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_display.sql
          content: |
            select location, revenue_cents,
                revenue_cents / {{ var("cents_per_unit") }}.0 as revenue_units
            from {{ ref("revenue_by_location") }}
          highlight_lines:
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-0-5-1
        - alignment-0-5-4
    - id: archive
      title: '0.5.1: keep customer history with an archive'
      explanation: 'Highlighted lines 5 to 8 of the project file identify the customer feed, destination and
        change timestamp. The setup view adds timestamps declared by the customer-city-change variant. After
        an archive run before and after Ada moves, the inspection query returns two rows: Montréal closes
        at 09:00 on March 9, and Québec stays open.'
      state:
        kind: table
        title: Archive after the second observation
        columns:
          - customer_id
          - city
          - valid_from
          - valid_to
        rows:
          -   - 1
              - Montréal
              - 2016-03-08 07:00
              - 2016-03-09 09:00
          -   - 1
              - Québec
              - 2016-03-09 09:00
              -
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: The 0.5.1 archive preserves both customer cities with valid_from and valid_to dates.
      code:
        - language: yaml
          filename: dbt_project.yml (archive excerpt)
          content: |
            archive:
              - source_schema: archive_input
                target_schema: history
                tables:
                  - source_table: customers
                    target_table: customers_archive
                    unique_key: customer_id
                    updated_at: updated_at
          highlight_lines:
            - 5
            - 6
            - 7
            - 8
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: setup/archive_input.sql
          content: |
            create view archive_input.customers as
            select c.*, case
                when customer_id = 1 and city = 'Québec'
                  then cast('2016-03-09 09:00:00' as timestamp)
                else cast('2016-03-08 07:00:00' as timestamp)
            end as updated_at
            from raw.customers as c;
          highlight_lines:
            - 3
            - 4
            - 5
            - 6
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: inspection/customer_archive.sql
          content: |
            select customer_id, city, valid_from, valid_to
            from history.customers_archive
            where customer_id = 1 order by valid_from
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt archive
            # Apply the named customer-city-change variant.
            dbt archive
          highlight_lines:
            - 1
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-0-5-1
        - alignment-0-5-4
      data_context:
        dataset_variant: customer-city-change
        phase: Archive observed before and after the declared update; feed timestamps are derived
          metadata.
    - id: reconcile
      title: '0.5.4: test the revenue reconciliation'
      explanation: 'Highlighted lines 2 and 4 total revenue at location and order level. Highlighted line
        8 returns a row only if those totals disagree. dbt test counts those failing rows. The panel shows
        a pass with zero failures: both sums are 12,500 cents.'
      state:
        kind: result
        title: Custom data test passes
        columns:
          - test
          - failing_rows
          - location_cents
          - order_cents
        rows:
          -   - revenue_reconciles
              - 0
              - 12500
              - 12500
        result_status: pass
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: A custom SQL test returns no rows when the two revenue totals agree.
      code:
        - language: sql
          filename: tests/revenue_reconciles.sql
          content: |
            with location_total as (
                select sum(revenue_cents) as cents from {{ ref("revenue_by_location") }}
            ), order_total as (
                select sum(revenue_cents) as cents from {{ ref("order_revenue") }}
            )
            select l.cents as location_cents, o.cents as order_cents
            from location_total as l cross join order_total as o
            where l.cents <> o.cents
          highlight_lines:
            - 2
            - 4
            - 8
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt test
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-0-5-1
        - alignment-0-5-4
  evidence:
