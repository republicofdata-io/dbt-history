    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      Archive timestamps come from declared variant metadata through a setup view; they are fixture dates, not 2016 runtime captures. Safer incremental writes and PostgreSQL support remain release context rather than separate demonstrations (src-1 and the 0.5.1 source).
      historical-0.5-01: Kept the confirmed models.jaffle_shop.vars layout from 0.5.0. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-0-5-1, alignment-0-5-4.
      historical-0.5-02: Kept the .0 suffix; the rendered expression divides by decimal 100.0, verified arithmetically. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-0-5-1, alignment-0-5-4.
      historical-0.5-03: Safer incremental writes and adapter introduction are release context; the demo shows variables, archives and custom SQL tests. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-0-5-1, alignment-0-5-4.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Read a named project setting inside SQL with var().
      - >-
        From 0.5.1, preserve earlier customer values with an archive.
      - 'From 0.5.4, write a SQL query whose returned rows are test failures.'
    scenario: >-
      Jaffle Shop needs readable amounts, a record of a customer move, and a check that the reports reconcile.
      Three small changes show how the 0.5 series brings each into the project.
    outcome: |-
      See 34.00 displayed from 3,400 cents, two archived customer rows, and a passing revenue reconciliation.
  title: |-
    Demo: share a setting, keep history and test the totals
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
