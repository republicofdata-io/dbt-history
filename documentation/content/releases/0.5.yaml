walkthrough:
  id: wt-0.5
  learning_objective: |
    Use a project variable to change how revenue is shown while leaving the revenue rule alone.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: units
      title: The books are kept in cents
      explanation: >
        Two familiar models. Highlighted line 1 of order_revenue subtracts refunds from payments, in cents.
        Highlighted lines 3 to 5 of the location model add those cents up per location. The result panel shows
        the stored figures: 3,400, 4,300 and 4,800 cents.
      state:
        kind: comparison
        title: Revenue stored in cents
        columns:
          - location
          - revenue_cents
        rows:
          - - Old Port
            - 3400
          - - Mile End
            - 4300
          - - Riverside
            - 4800
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        Every amount in the project is a whole number of cents, and that is the unit the business rule is
        written in.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
    - id: variable
      title: Put the conversion factor in one place
      explanation: >
        Highlighted lines 3, 5 and 6 of the project file define a variable named cents_per_unit with the value
        100. Highlighted lines 1 and 2 of the new display model read it with var() and divide revenue by it.
        The .0 after the variable turns 100 into 100.0, so the database does decimal division instead of
        dropping the remainder. The result panel shows the single setting in play.
      state:
        kind: comparison
        title: The one setting the model reads
        columns:
          - variable
          - value
        rows:
          - - cents_per_unit
            - 100
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        The model reads the conversion factor from a named setting instead of hard-coding the number 100.
      code:
        - language: sql
          filename: models/revenue_display.sql
          content: |
            select location_id, revenue_cents / {{ var("cents_per_unit") }}.0 as revenue_units
            from {{ ref("revenue_by_location") }}
          highlight_lines:
            - 1
            - 2
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            name: waffle_shop
            version: "1.0"
            models:
              waffle_shop:
                vars:
                  cents_per_unit: 100
          highlight_lines:
            - 3
            - 5
            - 6
          purpose: authored executable syntax; illustration only
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
    - id: display
      title: Show cents and display amounts side by side
      explanation: >
        The display model now keeps both columns. Highlighted line 2 computes the display amount from the same
        variable. The result panel shows each location's cents next to the converted figure: 3,400 becomes
        34.00, 4,300 becomes 43.00, and 4,800 becomes 48.00. Revenue itself has not changed.
      state:
        kind: comparison
        title: Cents next to display amounts
        columns:
          - location
          - cents
          - display_units
        rows:
          - - Old Port
            - 3400
            - '34.00'
          - - Mile End
            - 4300
            - '43.00'
          - - Riverside
            - 4800
            - '48.00'
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        The variable changes how the amount is shown, not the amount itself.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
      code:
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            name: waffle_shop
            version: "1.0"
            models:
              waffle_shop:
                vars:
                  cents_per_unit: 100
          highlight_lines:
            - 3
            - 5
            - 6
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_display.sql
          content: |
            select location_id, revenue_cents,
                revenue_cents / {{ var("cents_per_unit") }}.0 as revenue_units
            from {{ ref("revenue_by_location") }}
          highlight_lines:
            - 2
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Set a named value once in the project file, then read it inside any model with var().
      - >-
        From patch 0.5.1, run against PostgreSQL directly, and keep a history of rows as they change over time
        with archives.
      - 'From patch 0.5.4, write your own SQL query as a test: any rows it returns count as failures.'
    scenario: >
      The shop keeps its books in whole cents, which avoids rounding errors. People reading a report want to
      see 34.00, not 3400. A single project variable, cents per unit, does the conversion, so the revenue rule
      itself stays untouched.
    outcome: |
      Compare the stored cents with the displayed amounts, side by side, for all three locations.
  title: |
    Demo: a project variable turns stored cents into a display amount without changing the revenue rule
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
