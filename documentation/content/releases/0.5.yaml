  intro:
    can_now:
    - Pass named project variables into reusable model SQL.
    - From 0.5.1, target PostgreSQL directly and preserve changing records with archives.
    - From 0.5.4, write a custom SQL query that identifies failing data.
    scenario: |
      The shop keeps its accounting in cents but needs a currency-unit display. A shared variable supplies the conversion without changing the refund rule.
    outcome: |
      Compare the integer accounting values with their decimal presentation.
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
