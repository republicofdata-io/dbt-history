id: '0.4'
label: v0.4
title: Materialization choices
lead: |
  Models can now be incremental or ephemeral. Waffle Shop can process new orders without rebuilding its entire order history.
problem_then: |
  A full rebuild repeats old work. Reusable intermediate SQL also need not always become a warehouse table.
what_changed:
- id: change-1
  summary: Incremental and ephemeral models introduced in 0.4.0.
  introduced_in: 0.4.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: In-model config and this variable; enum materializations replace Boolean configuration.
  introduced_in: 0.4.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Choose how a model is built as part of the project.
technical_detail: |
  The historical incremental filter is sql_where, used with this; do not substitute the later is_incremental pattern. This simple increasing-ID example assumes new records only and does not solve changed refunds or late updates.
