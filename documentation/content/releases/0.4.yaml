    title: 'dbt 0.4.0 original source: dbt/compilation.py; dbt/model.py; dbt/templates.py'
    url:
      https://files.pythonhosted.org/packages/f9/96/19883c211c083ff635bfd69e8602298e40a831b8050849289c30f6a05301/dbt-0.4.0.tar.gz
    retrieved: '2026-09-22'
    source_path: dbt/compilation.py; dbt/model.py; dbt/templates.py
    sha256: 75ec7d3edf3e043af724f7cd2967d61e98e173c3a98f7928ac9e03a2d6447a6f
