  intro:
    can_now:
    - Append new records through an incremental model instead of rebuilding its complete history.
    - Reuse intermediate SQL without creating a separate table by using an ephemeral model.
    - Choose materialization inside a model with the new config call.
    scenario: |
      Two new orders arrive on the second trading day. Waffle Shop wants to add their 1,900 cents without rewriting the twelve existing orders.
    outcome: |
      Trace the original sql_where filter and the resulting 14,400-cent total.
