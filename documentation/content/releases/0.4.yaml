walkthrough:
  id: wt-0.4
  learning_objective: >
    Follow one incremental run: what is already stored, which rows are new, and what the table holds
    afterwards.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is second-day. Each state below is an authored illustration.
     The illustrative order_revenue_input relation is a full recalculation of order_revenue over the selected raw fixture; it is the input to the incremental target.
  dataset_variant: second-day
  steps:
    - id: existing
      title: 'Day one: twelve orders already stored'
      explanation: >
        The revenue table was built on day one. To look at it we use an inspection query, a plain query kept
        under analyses that reads a result without building anything. Highlighted lines 1 and 2 of
        existing_target.sql count the rows and total the revenue: 12 orders, highest order id 1052, 12,500
        cents. The model that builds the table, order_revenue, is marked incremental on its highlighted lines
        1 and 2; that is the setting this demo is about.
      state:
        kind: comparison
        title: What the table holds after day one
        columns:
          - existing_orders
          - maximum_order_id
          - revenue_cents
        rows:
          - - 12
            - 1052
            - 12500
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        The revenue table already holds day one, so day two should not have to start over.
      evidence:
        - src-1
        - src-2
        - alignment-0-4-0
      code:
        - language: sql
          filename: analyses/existing_target.sql
          content: |
            select count(*) as existing_orders, max(order_id) as maximum_order_id,
                sum(revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }}
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_revenue.sql
          content: |
            {{ config(materialized="incremental",
                sql_where="order_id > (select max(order_id) from {{ this }})") }}
            select * from {{ ref("order_revenue_input") }}
          highlight_lines:
            - 1
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_revenue_input.sql
          content: |
            {{ config(materialized="ephemeral") }}
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_amounts.sql
          content: |
            with paid as (
                select order_id, sum(amount_cents) as payment_cents
                from raw.payments group by order_id
            ), refunded as (
                select order_id, sum(amount_cents) as refund_cents
                from raw.refunds group by order_id
            )
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from raw.orders as o
            left join paid as p on o.order_id = p.order_id
            left join refunded as r on o.order_id = r.order_id
          highlight_lines:
            - 2
            - 5
            - 8
            - 9
          purpose: Authored era-specific example; illustration only.
      data_context:
        dataset_variant: base
        phase: Existing incremental target before second-day rows arrive.
    - id: filter
      title: 'Day two: pick out only the two new orders'
      explanation: >
        Two orders arrive on day two. Highlighted lines 1 and 2 of order_revenue keep it incremental and add a
        filter: only rows whose order id is above the highest one already stored. In that filter, {{ this }}
        means the model's own table. The command runs dbt. The panel shows what the filter lets through: just
        orders 1053 and 1054, worth 500 and 1,400 cents.
      state:
        kind: comparison
        title: The two orders the filter selects
        columns:
          - order_id
          - location_id
          - revenue_cents
        rows:
          - - 1053
            - 1
            - 500
          - - 1054
            - 2
            - 1400
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        The filter compares the fresh data with what is already stored and keeps only the two new orders.
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            {{ config(materialized="incremental",
                sql_where="order_id > (select max(order_id) from {{ this }})") }}
            select * from {{ ref("order_revenue_input") }}
          highlight_lines:
            - 1
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_revenue_input.sql
          content: |
            {{ config(materialized="ephemeral") }}
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt run
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - alignment-0-4-0
      data_context:
        dataset_variant: second-day
        phase: Current raw inputs include the added orders; the target still contains the base day.
    - id: append
      title: Add the two rows and read the new totals
      explanation: >
        dbt adds those two rows to the existing table instead of rebuilding it. Highlighted lines 1 and 2 of
        the inspection query location_totals.sql read the location totals afterwards: 3,900, 5,700 and 4,800
        cents, 14,400 in all, up 1,900 from day one.
      state:
        kind: comparison
        title: Revenue by location after day two
        columns:
          - location
          - revenue_cents
        rows:
          - - Old Port
            - 3900
          - - Mile End
            - 5700
          - - Riverside
            - 4800
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        The table grew by two rows and 1,900 cents without a full rebuild; this only adds rows, so a change to
        an old order would need a different approach.
      evidence:
        - src-1
        - src-2
        - alignment-0-4-0
      code:
        - language: sql
          filename: analyses/location_totals.sql
          content: |
            select location, revenue_cents
            from {{ ref("revenue_by_location") }}
            order by location_id
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_revenue.sql
          content: |
            {{ config(materialized="incremental",
                sql_where="order_id > (select max(order_id) from {{ this }})") }}
            select * from {{ ref("order_revenue_input") }}
          highlight_lines:
            - 1
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_revenue_input.sql
          content: |
            {{ config(materialized="ephemeral") }}
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
      data_context:
        dataset_variant: second-day
        phase: Target after the incremental append.
    - id: ephemeral
      title: 'Also new: a helper model that never becomes a table'
      explanation: >
        One more thing this version adds. The revenue calculation lives in a small helper model,
        order_revenue_input, so it can be reused. Highlighted line 1 marks it ephemeral: dbt does not create a
        table for it. Instead, when it builds order_revenue (highlighted line 3 refers to the helper), it
        pastes the helper's SQL into that statement as a named sub-query. The diagram shows the helper sitting
        inside the stored model. The warehouse ends up with one table, not two.
      state:
        kind: diagram
        title: Helper folded into the stored model
        columns: []
        rows: []
        result_status: null
        diagram:
          nodes:
            - id: order_amounts
              label: 'order_amounts: stored input'
            - id: order_revenue_input
              label: 'order_revenue_input: inline SQL'
            - id: order_revenue
              label: 'order_revenue: stored table'
          edges:
            - from: order_amounts
              to: order_revenue_input
            - from: order_revenue_input
              to: order_revenue
          highlight:
            - order_revenue_input
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        Ephemeral lets you split SQL into reusable pieces without leaving extra tables in the warehouse.
      code:
        - language: sql
          filename: models/order_revenue_input.sql
          content: |
            {{ config(materialized="ephemeral") }}
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_revenue.sql
          content: |
            {{ config(materialized="incremental",
                sql_where="order_id > (select max(order_id) from {{ this }})") }}
            select * from {{ ref("order_revenue_input") }}
          highlight_lines:
            - 1
            - 2
            - 3
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_amounts.sql
          content: |
            with paid as (
                select order_id, sum(amount_cents) as payment_cents
                from raw.payments group by order_id
            ), refunded as (
                select order_id, sum(amount_cents) as refund_cents
                from raw.refunds group by order_id
            )
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from raw.orders as o
            left join paid as p on o.order_id = p.order_id
            left join refunded as r on o.order_id = r.order_id
          highlight_lines:
            - 2
            - 5
            - 8
            - 9
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - alignment-0-4-0
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - alignment-0-4-0
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      historical-0.4-03: Kept sql_where with this after checking the original 0.4 materialization
      implementation. Evidence: src-1, src-2, alignment-0-4-0.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  prepared_relations:
    - name: order_revenue_input
      definition: >-
        The dataset’s order_revenue definition evaluated over raw inputs; separate from the incremental
        target.
  intro:
    can_now:
      - Mark a model as incremental, so each run adds only the new rows instead of rebuilding the whole table.
      - Mark a model as ephemeral, so its SQL is folded into the models that use it and no table is created.
      - >-
        Put these choices at the top of the model file itself, with a config call, instead of in the project
        settings.
    scenario: >
      Day one is done: twelve orders worth 12,500 cents sit in the revenue table. On day two, two more orders
      arrive, worth 1,900 cents. The shop wants those two rows added on, not the whole table rebuilt from
      scratch.
    outcome: >
      Watch the incremental filter select just the two new orders and add them to the day-one table, then see
      how a helper model can contribute SQL without becoming a table of its own.
  title: |
    Demo: add day two's orders without rebuilding the table, and reuse SQL without creating a table
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
