id: '0.4'
label: v0.4
title: Materialization choices
lead: >
  Models can now be incremental or ephemeral. Jaffle Shop can process new orders without rebuilding its entire
  order history.
problem_then: |
  A full rebuild repeats old work. Reusable intermediate SQL also need not always become a warehouse table.
what_changed:
  - id: change-1
    summary: Incremental and ephemeral models introduced in 0.4.0.
    introduced_in: 0.4.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: >-
      In-model config and the {{ this }} variable, which names the table the model is building; named
      materializations (table, view, incremental, ephemeral) replace the true/false setting.
    introduced_in: 0.4.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
in_practice: |
  Choose how a model is built as part of the project.
technical_detail: >
  The historical incremental filter is sql_where, used with this; do not substitute the later is_incremental
  pattern. This simple increasing-ID example assumes new records only and does not solve changed refunds or
  late updates.
milestones:
  - id: 0.4.0
    kind: package
    date: '2016-08-16'
    precision: day
    title: First published package
    evidence:
      - src-2
sources:
  - id: src-1
    title: dbt 0.4 release evidence
    url: https://github.com/dbt-labs/dbt/releases/tag/v0.4.0
    retrieved: '2026-09-21'
    supports: Tagged release changes; package upload and public announcement remain distinct.
  - id: src-2
    title: dbt 0.4 package evidence
    url: https://pypi.org/project/dbt/0.4.0/
    retrieved: '2026-09-21'
    supports: >-
      Package existence and upload timestamp. Implementation claims refer to the original source archive
      linked from the package.
    rechecked: '2026-09-22'
  - id: alignment-0-4-0
    title: 'dbt 0.4.0 original source: dbt/compilation.py; dbt/model.py; dbt/templates.py'
    url: >-
      https://files.pythonhosted.org/packages/f9/96/19883c211c083ff635bfd69e8602298e40a831b8050849289c30f6a05301/dbt-0.4.0.tar.gz
    retrieved: '2026-09-22'
    source_path: dbt/compilation.py; dbt/model.py; dbt/templates.py
    sha256: 75ec7d3edf3e043af724f7cd2967d61e98e173c3a98f7928ac9e03a2d6447a6f
    supports: Named materializations, ephemeral compilation, config(), this and sql_where.
narrative_evidence:
