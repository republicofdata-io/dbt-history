id: '1.0'
label: v1.0
title: The stable framework
lead: |
  Version 1 marks a stable foundation for the project workflow. Parsing defaults and result-based selection make everyday work more practical.
problem_then: |
  Teams need confidence in the framework they depend on, alongside efficient ways to inspect and repeat work.
what_changed:
- id: change-1
  summary: Default partial/static parsing, result selectors and interactive init.
  introduced_in: 1.0.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Metrics nodes enter the manifest; package/adapter installation conventions evolve.
  introduced_in: 1.0.0
  adapter_constraints: null
  evidence:
  - src-1
  confidence: high
in_practice: |
  Treat the stable release as a foundation, while still checking compatibility when upgrading.
technical_detail: |
  Partial and static parsing become defaults. Result selectors use saved run artifacts. Metrics nodes in the manifest are metadata, not the hosted Semantic Layer that previews in October 2022. Stable does not mean every dependency or adapter is identical forever.
milestones:
