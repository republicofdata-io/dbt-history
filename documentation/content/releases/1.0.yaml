id: '1.0'
label: v1.0
title: The stable framework
lead: >
  Version 1 marks a stable foundation for the project workflow. Parsing defaults and result-based selection
  make everyday work more practical.
problem_then: |
  Teams need confidence in the framework they depend on, alongside efficient ways to inspect and repeat work.
what_changed:
  - id: change-1
    summary: Default partial/static parsing, result selectors and interactive init.
    introduced_in: 1.0.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Metrics nodes enter the manifest; package/adapter installation conventions evolve.
    introduced_in: 1.0.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
in_practice: >
  The framework committed to stability: projects written for 1.0 would keep working across the 1.x line.
  Partial parsing became the default, and a run could select the models that failed last time.
technical_detail: >
  Partial and static parsing become defaults. Result selectors use saved run artifacts. Metrics nodes in the
  manifest are metadata, not the hosted Semantic Layer that previews in October 2022. Stable does not mean
  every dependency or adapter is identical forever.
milestones:
  - id: 1.0.0
    kind: package
    date: '2021-12-03'
    precision: day
    title: First published package
    evidence:
      - src-2
