walkthrough:
  id: wt-1.0
  learning_objective: |
    Understand what a stable framework does and does not promise.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: routine
    title: Name the established workflow
    explanation: |
      Waffle Shop already has models, tests, documentation and tracked dependencies.
    state:
      kind: comparison
      title: Name the established workflow
      columns:
      - project asset
      - shop example
      rows:
      - - model
        - order_revenue
      - - test
        - payments have orders
      - - documentation
        - revenue is in cents
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Version 1 consolidates an existing workflow.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: payments
            columns:
              - name: order_id
                tests:
                  - not_null
                  - relationships:
                      to: ref("orders")
                      field: order_id
      highlight_lines:
      - 8
      - 9
      - 10
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: revenue_by_location
            description: Payments minus refunds, in cents.
            columns:
              - name: revenue_cents
                description: Net successful payments after refunds.
      highlight_lines:
      - 4
      - 6
      - 7
      purpose: authored executable syntax; illustration only
  - id: results
    title: Target a previously failed model
    explanation: |
      Assume saved run results identify refunds_by_order as errored.
    state:
      kind: comparison
      title: Target a previously failed model
      columns:
      - artifact observation
      - selected model
      rows:
      - - 'prior model status: error'
        - refunds_by_order
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Saved results can guide the next command.
    code:
    - language: sql
      filename: models/refunds_by_order.sql
      content: |
        select order_id, sum(amount_cents) as refund_cents
        from {{ ref("refunds") }}
        group by order_id
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt run --select result:error --state ./previous-run
      highlight_lines:
      - 1
    evidence:
    - src-1
    - src-2
    - src-3
  - id: metrics
    title: Keep the service boundary clear
    explanation: |
      A metric definition in an artifact is not itself a hosted query service.
    state:
      kind: comparison
      title: Keep the service boundary clear
      columns:
      - at 1.0
      - available interpretation
      rows:
      - - metric metadata
        - project/manifest definition
      - - hosted Semantic Layer
        - not launched by this Core release
      - - base revenue
        - 12,500 cents
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Core resources and commercial services have separate timelines.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: yaml
      filename: models/metrics.yml
      content: |
        version: 2
        metrics:
          - name: net_revenue
            label: Net revenue
            model: ref("order_revenue")
            type: sum
            sql: revenue_cents
            timestamp: ordered_at
            time_grains: [day]
            dimensions: [location_id]
      highlight_lines:
      - 2
      - 5
      - 6
      - 7
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
