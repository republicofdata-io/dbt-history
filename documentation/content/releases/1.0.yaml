walkthrough:
  id: wt-1.0
  learning_objective: >
    See a stable dbt project use its saved run results to target a repair, and see what a metric definition is
    and is not at 1.0.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: routine
      title: 'The project is already complete: models, tests and docs'
      explanation: >-
        The project already contains models, tests and documentation. Highlighted line 1 of order_revenue
        subtracts refunds. Highlighted lines 8 to 10 of schema.yml require payments to reference real orders.
        Highlighted lines 4, 6 and 7 of revenue.yml describe the location model and its revenue column. The
        panel names an example of each asset in the existing workflow.
      state:
        kind: comparison
        title: Three kinds of asset the project already has
        columns:
          - project asset
          - shop example
        rows:
          - - model
            - order_revenue
          - - test
            - payments have orders
          - - documentation
            - revenue is in cents
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        Version 1.0 does not add a new kind of asset. It marks the existing workflow of models, tests and docs
        as stable.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: payments
                columns:
                  - name: order_id
                    tests:
                      - not_null
                      - relationships:
                          to: ref("orders")
                          field: order_id
          highlight_lines:
            - 8
            - 9
            - 10
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: models/revenue.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
                columns:
                  - name: revenue_cents
                    description: Net successful payments after refunds.
          highlight_lines:
            - 4
            - 6
            - 7
          purpose: authored executable syntax; illustration only
    - id: results
      title: Rerun only the model that errored last time
      explanation: >
        Assume the previous run's saved results say refunds_by_order errored. The first file is that model.
        Highlighted lines 1 and 2 sum refund amounts per order. The second file is the command. The
        highlighted line asks dbt to run every model whose result was error in the saved results kept in the
        previous-run folder. The result panel shows the match: one model had the error status, and it is the
        only one selected.
      state:
        kind: comparison
        title: 'One model selected: the one that errored'
        columns:
          - artifact observation
          - selected model
        rows:
          - - 'prior model status: error'
            - refunds_by_order
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: |
        dbt read the saved results from the last run and picked out refunds_by_order to rerun.
      code:
        - language: sql
          filename: models/refunds_by_order.sql
          content: |
            select order_id, sum(amount_cents) as refund_cents
            from {{ ref("refunds") }}
            group by order_id
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt run --select result:error --state ./previous-run
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
    - id: metrics
      title: A metric definition in the project, not a metrics service
      explanation: >-
        Highlighted line 2 of metrics.yml opens the metrics section. Lines 5 to 7 define a sum of
        revenue_cents from order_revenue. At 1.0 this records a definition in project metadata; it doesn't
        create a hosted query service. The panel distinguishes that definition from the later hosted Semantic
        Layer, while base revenue remains 12,500 cents.
      state:
        kind: comparison
        title: Metric definition at 1.0 versus a hosted service
        columns:
          - at 1.0
          - available interpretation
        rows:
          - - metric metadata
            - project/manifest definition
          - - hosted Semantic Layer
            - not launched by this Core release
          - - base revenue
            - 12,500 cents
        result_status: null
        diagram: null
        provenance: >-
          Authored illustration; fixture-derived values or explicitly prepared workflow. Not a captured dbt
          run.
      takeaway: >
        At 1.0 a metric is a definition stored in the project. The hosted service that would query it came
        later and separately.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: yaml
          filename: models/metrics.yml
          content: |
            version: 2
            metrics:
              - name: net_revenue
                label: Net revenue
                model: ref("order_revenue")
                type: sum
                sql: revenue_cents
                timestamp: ordered_at
                time_grains: [day]
                dimensions: [location_id]
          highlight_lines:
            - 2
            - 5
            - 6
            - 7
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      The two YAML resources use different files, schema.yml and revenue.yml. Initial metrics retain
      model/type/sql, as verified in src-1 and the original metric contract; later
      calculation_method/expression syntax is not used. Default partial parsing is release context, not a
      demonstrated speed claim.

      historical-1.0-01: Default parsing optimizations stay in release context; removed the undemonstrated
      speed claim from can_now. Evidence: src-1, src-2, src-3.

      historical-1.0-02: Retain the 1.0 model/type/sql metric schema verified against the original contract,
      not later metric syntax. Evidence: src-1, src-2, src-3.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Rerun only the models that failed or errored in the previous run, using the saved results.
      - Write a metric definition, such as net revenue, into the project so tools can read it.
    scenario: >
      The last run failed on the model that sums refunds per order. Instead of rerunning everything, the shop
      points dbt at the saved results and reruns only what errored. Version 1.0 also lets the project define a
      net revenue metric. That definition is just metadata in the project. There is no hosted service behind
      it yet.
    outcome: >
      The walkthrough shows the established project, the one command that targets the failed model, and a
      1.0-style metric definition.
  title: |
    Demo: version 1.0 reruns only the model that failed last time
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
