walkthrough:
  id: wt-0.7
  learning_objective: |
    Separate the business rule, which stays the same, from the warehouse connection, which changes.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: rule
      title: The rule that must not change
      explanation: >
        Start with the business rule. Highlighted lines 2 and 5 of order_amounts total payments and refunds
        per order, and lines 8 and 9 attach them to each order. The second file checks one order: highlighted
        line 2 subtracts refunds from payments, and line 4 picks order 1042. The result panel shows 1,200
        paid, 200 refunded, 1,000 net. Nothing here mentions a warehouse.
      state:
        kind: comparison
        title: Order 1042, the same on any warehouse
        columns:
          - order_id
          - payments
          - refunds
          - revenue
        rows:
          -   - 1042
              - 1200
              - 200
              - 1000
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Payments minus refunds is plain SQL that does not care which warehouse runs it.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-0-7-0
        - alignment-0-7-1
      code:
        - language: sql
          filename: models/order_amounts.sql
          content: |
            with paid as (
                select order_id, sum(amount_cents) as payment_cents
                from raw.payments group by order_id
            ), refunded as (
                select order_id, sum(amount_cents) as refund_cents
                from raw.refunds group by order_id
            )
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from raw.orders as o
            left join paid as p on o.order_id = p.order_id
            left join refunded as r on o.order_id = r.order_id
          highlight_lines:
            - 2
            - 5
            - 8
            - 9
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: analyses/order_1042.sql
          content: |
            select order_id, payment_cents, refund_cents,
                payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
            where order_id = 1042
          highlight_lines:
            - 2
            - 4
          purpose: authored executable syntax; illustration only
    - id: target
      title: Swap the connection to Snowflake
      explanation: >
        The profiles file holds connection settings. Highlighted line 5 sets the type to snowflake, which
        tells dbt to use its Snowflake adapter, the part that knows how to talk to that warehouse. Line 6
        names the account. Lines 9 to 11 name the database, the schema and the Snowflake compute warehouse.
        Highlighted line 3 of the project file links the project to this profile by name. Highlighted line
        1
        of order_revenue is unchanged. The result panel lists the three warehouses dbt can target at 0.7.0.
      state:
        kind: comparison
        title: Warehouses dbt can target at 0.7.0
        columns:
          - target
          - status at 0.7.0
        rows:
          -   - Redshift
              - existing
          -   - PostgreSQL
              - existing since 0.5.1
          -   - Snowflake
              - newly supported
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        Switching warehouses means editing the connection profile; the model SQL stays the same.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-0-7-0
        - alignment-0-7-1
      code:
        - language: yaml
          filename: profiles.yml (connection excerpt)
          content: |
            jaffle_shop:
              target: dev
              outputs:
                dev:
                  type: snowflake
                  account: "<account identifier>"
                  user: "<username>"
                  password: "<password>"
                  database: ANALYTICS
                  schema: JAFFLE
                  warehouse: TRANSFORMING
                  threads: 2
          highlight_lines:
            - 5
            - 6
            - 9
            - 10
            - 11
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            name: jaffle_shop
            version: "1.0"
            profile: jaffle_shop
            source-paths: [models]
          highlight_lines:
            - 3
          purpose: Authored era-specific example; illustration only.
    - id: check
      title: '0.7.1: choose a Snowflake role'
      explanation: >-
        Highlighted line 13 adds role: TRANSFORMER, supported from 0.7.1. The role is a set of Snowflake permissions
        used for the connection. Highlighted lines 3 to 5 of the unchanged location model still total payments,
        refunds and revenue. The panel shows the expected 12,500 cents with this connection; it is an illustration,
        not a captured Snowflake run.
      state:
        kind: table
        title: Expected revenue by location on Snowflake
        columns:
          - location_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          -   - 1
              - Old Port
              - 4400
              - 1000
              - 3400
          -   - 2
              - Mile End
              - 4600
              - 300
              - 4300
          -   - 3
              - Riverside
              - 4800
              - 0
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >-
        The 0.7.1 profile can choose the Snowflake role while the revenue SQL keeps the same expected result.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - alignment-0-7-0
        - alignment-0-7-1
      code:
        - language: yaml
          filename: profiles.yml (connection excerpt)
          content: |
            jaffle_shop:
              target: dev
              outputs:
                dev:
                  type: snowflake
                  account: "<account identifier>"
                  user: "<username>"
                  password: "<password>"
                  database: ANALYTICS
                  schema: JAFFLE
                  warehouse: TRANSFORMING
                  threads: 2
                  role: TRANSFORMER
          highlight_lines:
            - 13
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - alignment-0-7-0
      - alignment-0-7-1
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The 0.7.0 Snowflake profile is a configuration example with visibly marked credentials, not a live connection. role is deliberately omitted because it arrives in 0.7.1.
      Unlike 0.3, the 0.7 loader uses a named profile and target; preserve that historical difference. Role is shown only in the 0.7.1 step, not at 0.7.0.
      review-0.7-01: Keep named profile target in 0.7.0. Original loader/connection source verifies the change from 0.3 user.run-target; these versions should not be made artificially identical. Evidence: src-1, src-2, src-3, src-4, alignment-0-7-0, alignment-0-7-1.
      historical-0.7-01: Keep named profile target in 0.7.0. Original loader/connection source verifies the change from 0.3 user.run-target; these versions should not be made artificially identical. Evidence: src-1, src-2, src-3, src-4, alignment-0-7-0, alignment-0-7-1.
      historical-0.7-02: Original 0.7.0 connection contract confirms account, user, password, database, schema and warehouse; role is shown only in patch 0.7.1. Evidence: src-1, src-2, src-3, src-4, alignment-0-7-0, alignment-0-7-1.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Point the project at a Snowflake warehouse, a third choice after Redshift and PostgreSQL.
      - From patch 0.7.1, name which Snowflake role the connection should use.
    scenario: >
      The shop is thinking about moving its warehouse to Snowflake. The question is what has to change. The
      answer is the connection settings and the adapter, the piece of dbt that speaks each warehouse's
      dialect. The payment and refund rule stays as it is.
    outcome: >
      See the Snowflake connection settings next to the unchanged models, and the same 12,500-cent
      expectation.
  title: |
    Demo: the same Jaffle Shop models run on Snowflake by changing only the connection
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
