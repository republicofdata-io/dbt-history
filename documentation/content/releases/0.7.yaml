walkthrough:
  id: wt-0.7
  learning_objective: |
    Separate the business rule from the warehouse connection.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: rule
    title: Start with the business rule
    explanation: |
      The refund policy does not depend on which warehouse stores the tables.
    state:
      kind: comparison
      title: Start with the business rule
      columns:
      - order_id
      - payments
      - refunds
      - revenue
      rows:
      - - 1042
        - 1200
        - 200
        - 1000
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Keep payments minus refunds as the invariant.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    code:
    - language: sql
      filename: models/order_amounts.sql
      content: |
        with paid as (
            select order_id, sum(amount_cents) as payment_cents
            from raw.payments group by order_id
        ), refunded as (
            select order_id, sum(amount_cents) as refund_cents
            from raw.refunds group by order_id
        )
        select o.*, coalesce(p.payment_cents, 0) as payment_cents,
            coalesce(r.refund_cents, 0) as refund_cents
        from raw.orders as o
        left join paid as p on o.order_id = p.order_id
        left join refunded as r on o.order_id = r.order_id
      highlight_lines:
      - 2
      - 5
      - 8
      - 9
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: analyses/order_1042.sql
      content: |
        select order_id, payment_cents, refund_cents,
            payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
        where order_id = 1042
      highlight_lines:
      - 2
      - 4
      purpose: authored executable syntax; illustration only
  - id: target
    title: Choose the new adapter
    explanation: |
      Snowflake joins the existing Redshift and PostgreSQL targets.
    state:
      kind: comparison
      title: Choose the new adapter
      columns:
      - target
      - status at 0.7.0
      rows:
      - - Redshift
        - existing
      - - PostgreSQL
        - existing since 0.5.1
      - - Snowflake
        - newly supported
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      An adapter is the warehouse-specific part of the workflow.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    code:
    - language: yaml
      filename: profiles.yml (connection excerpt)
      content: |
        waffle_shop:
          target: dev
          outputs:
            dev:
              type: snowflake
              account: "<account identifier>"
              user: "<username>"
              password: "<password>"
              database: ANALYTICS
              schema: WAFFLE
              warehouse: TRANSFORMING
              threads: 2
      highlight_lines:
      - 5
      - 6
      - 9
      - 10
      - 11
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: dbt_project.yml (excerpt)
      content: |
        name: waffle_shop
        version: "1.0"
        profile: waffle_shop
        source-paths: [models]
      highlight_lines:
      - 3
  - id: check
    title: Verify the same expectation
    explanation: |
      The prepared expectation remains the base fixture total.
    state:
      kind: table
      title: Base revenue by location
      columns:
      - location_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1
        - Old Port
        - 4400
        - 1000
        - 3400
      - - 2
        - Mile End
        - 4600
        - 300
        - 4300
      - - 3
        - Riverside
        - 4800
        - 0
        - 4800
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A real migration still needs checks of SQL types, permissions and adapter behavior.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-4
    code:
    - language: yaml
      filename: profiles.yml (connection excerpt)
      content: |
        waffle_shop:
          target: dev
          outputs:
            dev:
              type: snowflake
              account: "<account identifier>"
              user: "<username>"
              password: "<password>"
              database: ANALYTICS
              schema: WAFFLE
              warehouse: TRANSFORMING
              threads: 2
      highlight_lines:
      - 5
      - 6
      - 9
      - 10
      - 11
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
