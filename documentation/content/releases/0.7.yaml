id: '0.7'
label: v0.7
title: Snowflake joins the targets
lead: |
  Snowflake becomes a supported target. The project idea can travel to another warehouse while its adapter handles warehouse-specific work.
problem_then: |
  Teams adopting a different warehouse could not assume dbt supported it.
what_changed:
- id: change-1
  summary: Snowflake adapter support.
  introduced_in: 0.7.0
  adapter_constraints: Requires a Snowflake account and working connection; this app executes nothing.
  evidence:
  - src-1
  confidence: high
- id: change-2
  summary: Snowflake role configuration.
  introduced_in: 0.7.1
  adapter_constraints: Snowflake only.
  evidence:
  - src-2
  confidence: high
in_practice: |
  Keep the business models recognizable while reviewing connection settings and target-specific behavior.
technical_detail: |
  Snowflake support ships in 0.7.0; role configuration follows in 0.7.1. This is a portability illustration, not a cross-warehouse execution certification.
