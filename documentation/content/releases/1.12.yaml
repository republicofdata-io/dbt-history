walkthrough:
  id: wt-1.12
  learning_objective: |
    Inspect a known answer while understanding an optional parser transition.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: parser
    title: Separate parser from warehouse work
    explanation: |
      The same project can be inspected through different supported parsing paths.
    state:
      kind: comparison
      title: Separate parser from warehouse work
      columns:
      - path
      - status in 1.12
      rows:
      - - Python-line parser
        - existing path
      - - v2 Rust parser
        - opt-in path, extra binary
      result_status: null
      diagram: null
    takeaway: |
      Opting into parsing does not mean every v2 feature is present.
  - id: inspect
    title: Ask a small ad hoc question
    explanation: |
      Assume the existing revenue_by_location relation is already built in the active schema.
    state:
      kind: comparison
      title: Ask a small ad hoc question
      columns:
      - question
      - expected cents
      rows:
      - - sum of location revenue
        - 12500
      result_status: null
      diagram: null
    takeaway: |
      The expected answer comes from the fixture, not a fabricated terminal run.
    code:
    - language: shell
      filename: commands.sh
      content: |
        dbt run-operation --sql "select sum(revenue_cents) as total_cents from revenue_by_location"
      highlight_lines: []
  - id: compare
    title: Keep the migration checks explicit
    explanation: |
      These are authoring expectations, not completed runtime tests.
    state:
      kind: comparison
      title: Keep the migration checks explicit
      columns:
      - check
      - expected condition
      rows:
      - - model references
        - same intended dependencies
      - - business total
        - 12500 cents
      - - parser warnings
        - review before adopting the optional path
      result_status: null
      diagram: null
    takeaway: |
      The transition needs observable checks, not an assumed speedup.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    - src-3
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt execution.
