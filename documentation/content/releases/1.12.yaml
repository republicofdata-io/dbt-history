walkthrough:
  id: wt-1.12
  learning_objective: |
    Inspect a known answer while understanding an optional parser transition.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: parser
    title: Separate parser from warehouse work
    explanation: |
      The same project can be inspected through different supported parsing paths.
    state:
      kind: comparison
      title: Separate parser from warehouse work
      columns:
      - path
      - status in 1.12
      rows:
      - - Python-line parser
        - existing path
      - - v2 Rust parser
        - opt-in path, extra binary
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Opting into parsing does not mean every v2 feature is present.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-5
    code:
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: dbt_project.yml (excerpt)
      content: |
        name: waffle_shop
        version: "1.0"
        config-version: 2
        flags:
          use_v2_parser: true
      highlight_lines:
      - 4
      - 5
    - language: shell
      filename: commands.sh
      content: |
        dbt parse --no-use-v2-parser
        dbt parse --use-v2-parser
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
  - id: inspect
    title: Ask a small ad hoc question
    explanation: |
      Assume the existing revenue_by_location relation is already built in the active schema.
    state:
      kind: comparison
      title: Ask a small ad hoc question
      columns:
      - question
      - expected cents
      rows:
      - - sum of location revenue
        - 12500
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The expected answer comes from the fixture, not a fabricated terminal run.
    code:
    - language: sql
      filename: inspection/total_revenue.sql
      content: |
        select sum(revenue_cents) as total_cents
        from revenue_by_location
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: shell
      filename: commands.sh
      content: |
        dbt run-operation --sql "select sum(revenue_cents) as total_cents from revenue_by_location"
      highlight_lines:
      - 1
    evidence:
    - src-1
    - src-2
    - src-3
    - src-5
  - id: compare
    title: Keep the migration checks explicit
    explanation: |
      These are authoring expectations, not completed runtime tests.
    state:
      kind: comparison
      title: Keep the migration checks explicit
      columns:
      - check
      - expected condition
      rows:
      - - model references
        - same intended dependencies
      - - business total
        - 12500 cents
      - - parser warnings
        - review before adopting the optional path
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The transition needs observable checks, not an assumed speedup.
    evidence:
    - src-1
    - src-2
    - src-3
    - src-5
    code:
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select *, payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      purpose: authored executable syntax; illustration only
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: dbt_project.yml (excerpt)
      content: |
        name: waffle_shop
        version: "1.0"
        config-version: 2
        flags:
          use_v2_parser: true
      highlight_lines:
      - 4
      - 5
    - language: shell
      filename: commands.sh
      content: |
        dbt parse --no-use-v2-parser
        dbt parse --use-v2-parser
      highlight_lines:
      - 1
      - 2
      purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    - src-3
    - src-4
    - src-5
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The parser switches are verified in 1.12.0 CLI parameters. The opt-in path needs the experimental parser binary; the model SQL is shown so parser comparison has a concrete input. No equality of runtime behavior is asserted from these illustrations.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Opt into the v2 Rust parser while using the Python engine line.
    - Move project variables into vars.yml.
    - Execute an ad hoc SQL statement through run-operation --sql.
    scenario: |
      The shop prepares for the next parser while retaining a known revenue expectation. A small inspection checks the same total rather than assuming migration correctness.
    outcome: |
      Read parser configuration and the SQL behind the 12,500-cent check.
status: reviewed
