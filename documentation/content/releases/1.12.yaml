walkthrough:
  id: wt-1.12
  learning_objective: >
    See how to opt into the new parser, and how a quick ad hoc query confirms the project still gives the same
    total.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: parser
      title: Turn on the new parser
      explanation: >
        You are looking at two unchanged models and a project file. The parser is the step that reads every
        model and works out how they connect. It is separate from the database work. The highlighted lines in
        dbt_project.yml set the use_v2_parser flag. The highlighted commands parse the project both ways, old
        parser and new, so the two can be compared. The result panel shows the two paths: the existing Python
        parser and the new opt-in Rust one, which needs an extra program installed.
      state:
        kind: comparison
        title: Two parsers, one project
        columns:
          - path
          - status in 1.12
        rows:
          - - Python-line parser
            - existing path
          - - v2 Rust parser
            - opt-in path, extra binary
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        The new parser is a switch you can turn on and off. It does not change what the models compute.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-5
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            name: waffle_shop
            version: "1.0"
            config-version: 2
            flags:
              use_v2_parser: true
          highlight_lines:
            - 4
            - 5
        - language: shell
          filename: commands.sh
          content: |
            dbt parse --no-use-v2-parser
            dbt parse --use-v2-parser
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
    - id: inspect
      title: Ask the database one quick question
      explanation: >
        The highlighted line is a one-line query: the sum of revenue across locations. The highlighted command
        runs it straight from the command line with run-operation and the --sql flag, with no model file
        needed. The result panel shows the expected answer, 12,500 cents. The table it reads,
        revenue_by_location, is assumed to be already built.
      state:
        kind: comparison
        title: Expected total
        columns:
          - question
          - expected cents
        rows:
          - - sum of location revenue
            - 12500
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        A one-off query from the command line confirms the total is still 12,500 cents.
      code:
        - language: sql
          filename: inspection/total_revenue.sql
          content: |
            select sum(revenue_cents) as total_cents
            from revenue_by_location
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt run-operation --sql "select sum(revenue_cents) as total_cents from revenue_by_location"
          highlight_lines:
            - 1
      evidence:
        - src-1
        - src-2
        - src-3
        - src-5
    - id: compare
      title: What to compare before switching
      explanation: >
        The same models and settings are shown again, this time as a checklist. The result panel lists what
        should match between the two parsers: the same dependencies between models, the same 12,500-cent
        total, and no unexplained parser warnings. These are the checks to run. None of them has been captured
        here.
      state:
        kind: comparison
        title: Checks before adopting the new parser
        columns:
          - check
          - expected condition
        rows:
          - - model references
            - same intended dependencies
          - - business total
            - 12500 cents
          - - parser warnings
            - review before adopting the optional path
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Adopt the new parser once dependencies, totals and warnings check out, not because it is faster.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-5
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: authored executable syntax; illustration only
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: dbt_project.yml (excerpt)
          content: |
            name: waffle_shop
            version: "1.0"
            config-version: 2
            flags:
              use_v2_parser: true
          highlight_lines:
            - 4
            - 5
        - language: shell
          filename: commands.sh
          content: |
            dbt parse --no-use-v2-parser
            dbt parse --use-v2-parser
          highlight_lines:
            - 1
            - 2
          purpose: authored executable syntax; illustration only
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.

      The parser switches are verified in 1.12.0 CLI parameters. The opt-in path needs the experimental parser
      binary; the model SQL is shown so parser comparison has a concrete input. No equality of runtime
      behavior is asserted from these illustrations.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Switch on the new Rust-based parser with a flag, while staying on the Python version of dbt.
      - Keep project variables in their own file, vars.yml.
      - Run a one-off SQL statement from the command line with run-operation and the --sql flag.
    scenario: >
      The shop wants to try the new parser, the part of dbt that reads the project files, before the next
      major version makes it standard. It turns the flag on, then runs a quick query to confirm the revenue
      total is still 12,500 cents. Nothing about the models changes.
    outcome: >
      Read the parser flag, the one-line query that checks the total and the list of things to compare before
      adopting the new parser.
  title: |
    Demo: try the new Rust parser and check the numbers still add up
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
default_milestone: 1.12.0
