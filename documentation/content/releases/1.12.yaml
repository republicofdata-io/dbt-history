walkthrough:
  id: wt-1.12
  learning_objective: >
    See how to opt into the new parser, and how a quick ad hoc query confirms the project still gives the
    same
    total.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: parser
      title: Turn on the new parser
      explanation: >-
        Highlighted lines 4 and 5 of dbt_project.yml enable use_v2_parser. The two commands override it off
        and on for parsing, the reading of project files and their links. The panel identifies the existing
        Python path and the opt-in Rust path. The latter requires the experimental parser executable; this
        is not a speed comparison.
      state:
        kind: comparison
        title: Two parsers, one project
        columns:
          - path
          - status in 1.12
        rows:
          -   - Python-line parser
              - existing path
          -   - v2 Rust parser
              - opt-in path, extra binary
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        The parser can be selected explicitly for the same project; the following comparison checks its expected model selection.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-5
        - src-4
        - alignment-1-12-0
      code:
        - language: yaml
          filename: dbt_project.yml
          content: |
            name: jaffle_shop
            version: "1.0"
            config-version: 2
            flags:
              use_v2_parser: true
          highlight_lines:
            - 4
            - 5
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt parse --no-use-v2-parser
            dbt parse --use-v2-parser
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
    - id: variables
      title: Keep the display setting in vars.yml
      explanation: Highlighted lines 1 and 2 of vars.yml put cents_per_unit under its required vars key.
        The project file has no competing vars block. Highlighted line 2 of the display model reads the
        value with var(). The panel shows 3,400 cents divided by 100 to give 34.00.
      state:
        kind: table
        title: Prepared display from the external variable
        columns:
          - location_id
          - revenue_cents
          - revenue_units
        rows:
          -   - 1
              - 3400
              - '34.00'
          -   - 2
              - 4300
              - '43.00'
          -   - 3
              - 4800
              - '48.00'
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: Project variables can live in vars.yml while the model keeps its familiar var() call.
      code:
        - language: yaml
          filename: vars.yml
          content: |
            vars:
              cents_per_unit: 100
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
        - language: yaml
          filename: dbt_project.yml
          content: |
            name: jaffle_shop
            version: "1.0"
            config-version: 2
            flags:
              use_v2_parser: true
          highlight_lines:
            - 4
            - 5
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_display.sql
          content: |
            select location_id, revenue_cents,
                revenue_cents / {{ var("cents_per_unit") }}.0 as revenue_units
            from {{ ref("revenue_by_location") }}
          highlight_lines:
            - 2
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-4
        - src-5
        - alignment-1-12-0
    - id: inspect
      title: Ask the database one quick question
      explanation: >-
        Highlighted lines 2 to 4 of the supporting location model show the stored totals being queried. The
        command sends a one-off SUM to the already built jaffle.revenue_by_location relation; no model file
        is created for that statement. The prepared panel shows 12,500 cents. This is a warehouse query, not
        proof that two parsers behaved identically.
      state:
        kind: comparison
        title: Expected total
        columns:
          - question
          - expected cents
        rows:
          -   - sum of location revenue
              - 12500
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        run-operation --sql can ask the existing revenue table for its total without adding another model.
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt run-operation --sql "select sum(revenue_cents) as total_cents from jaffle.revenue_by_location"
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-5
        - src-4
        - alignment-1-12-0
    - id: compare
      title: Compare the selected model names
      explanation: >-
        Highlighted lines 4 and 5 retain the parser option, while each command explicitly chooses one parser.
        The supporting ref calls define four model ancestors of revenue_by_location, including itself. The
        prepared panel puts the expected model names side by side. It illustrates the comparison to perform;
        it is not a captured claim of parser parity.
      state:
        kind: comparison
        title: Expected selections, illustrative rather than captured
        columns:
          - Python parser
          - v2 parser
        rows:
          -   - orders
              - orders
          -   - order_amounts
              - order_amounts
          -   - order_revenue
              - order_revenue
          -   - revenue_by_location
              - revenue_by_location
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        Both prepared selections contain the same four model names, giving a concrete check for an actual migration.
      evidence:
        - src-1
        - src-2
        - src-3
        - src-5
        - src-4
        - alignment-1-12-0
      code:
        - language: yaml
          filename: dbt_project.yml
          content: |
            name: jaffle_shop
            version: "1.0"
            config-version: 2
            flags:
              use_v2_parser: true
          highlight_lines:
            - 4
            - 5
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/orders.sql
          content: |
            select order_id, customer_id, location_id, ordered_at
            from raw.orders
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_amounts.sql
          content: |
            with paid as (
                select order_id, sum(amount_cents) as payment_cents
                from raw.payments group by order_id
            ), refunded as (
                select order_id, sum(amount_cents) as refund_cents
                from raw.refunds group by order_id
            )
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from {{ ref("orders") }} as o
            left join paid as p on o.order_id = p.order_id
            left join refunded as r on o.order_id = r.order_id
          highlight_lines:
            - 10
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 2
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt ls --no-use-v2-parser --select +revenue_by_location --resource-type model --output name
            dbt ls --use-v2-parser --select +revenue_by_location --resource-type model --output name
          highlight_lines:
            - 1
            - 2
          purpose: Authored era-specific example; illustration only.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
      - src-5
      - alignment-1-12-0
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The parser switches are verified in 1.12.0 CLI parameters. The opt-in path needs the experimental parser binary; the model SQL is shown so parser comparison has a concrete input. No equality of runtime behavior is asserted from these illustrations.
      The switches are common command options, not parse-only. The default experimental parser command is dbt-core-experimental-parser parse. vars.yml uses a top-level vars mapping; a second nonempty project vars mapping is rejected. The selection panel is a prepared expected set, not empirical equivalence; exact ordering of ls output is not asserted. inspection/total_revenue.sql was removed because the SQL is inline (alignment-1-12-0).
      review-1.12-03: Confirmed use_v2_parser, --use-v2-parser and --no-use-v2-parser in 1.12 params.py and common command flags. The extra parser binary is required. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-1-12-0.
      historical-1.12-01: Confirmed use_v2_parser, --use-v2-parser and --no-use-v2-parser in 1.12 params.py and common command flags. The extra parser binary is required. Evidence: src-1, src-2, src-3, src-4, src-5, alignment-1-12-0.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Switch on the new Rust-based parser with a flag, while staying on the Python version of dbt.
      - Keep project variables in their own file, vars.yml.
      - Run a one-off SQL statement from the command line with run-operation and the --sql flag.
    scenario: >-
      Jaffle Shop wants a concrete check before switching parsers, the programs that read project files. It
      compares selected model names, moves a display setting to vars.yml, and reads the stored revenue total
      with one command.
    outcome: >-
      See the expected four-model selection under each parser, a working variable file, and a prepared 12,500-cent
      query result.
  title: |-
    Demo: compare parser selections, separate variables and query a total
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
default_milestone: 1.12.0
