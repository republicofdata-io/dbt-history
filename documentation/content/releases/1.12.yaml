id: '1.12'
label: v1.12
title: Preparing for the Rust engine
lead: >
  The Python line gains an optional path toward the Rust parser. Project variables and ad hoc SQL also get new
  entry points.
problem_then: |
  Teams need a way to prepare for the next engine while keeping the current project understandable.
what_changed:
  - id: change-1
    summary: Opt-in v2 Rust parser; vars.yml and ad hoc run-operation --sql.
    introduced_in: 1.12.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Expanded UDFs, semantic definitions and catalogue integration; on_error configuration.
    introduced_in: 1.12.0
    adapter_constraints: null
    evidence:
      - src-1
    confidence: high
in_practice: >
  Compare project behavior carefully when enabling a new parser; use small inspections to validate business
  expectations.
technical_detail: >
  PyPI and GitHub publication are July 16. The blog’s August 17 edit date is not substituted for the release
  date. The v2 parser is opt-in and requires an additional binary; this content makes no equivalence or
  performance claim from execution.
