walkthrough:
  id: wt-1.4
  learning_objective: |
    Choose the correct upstream relation during development.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is second-day. Each state below is an authored illustration.
  dataset_variant: second-day
  steps:
  - id: copies
    title: Notice two copies
    explanation: |
      Both relation names are fictional deployment names for the same logical parent.
    state:
      kind: comparison
      title: Notice two copies
      columns:
      - relation
      - prepared data state
      rows:
      - - dev.order_revenue
        - 'old copy: first day'
      - - prod.order_revenue
        - 'current saved-state relation: two days'
      result_status: null
      diagram: null
    takeaway: |
      The development copy exists but is stale.
  - id: favor
    title: Prefer the saved-state parent
    explanation: |
      Build only the location aggregation, deferring its unselected parent.
    state:
      kind: comparison
      title: Prefer the saved-state parent
      columns:
      - selected child
      - resolved parent
      rows:
      - - dev.revenue_by_location
        - prod.order_revenue
      result_status: null
      diagram: null
    takeaway: |
      The choice of relation can change what data a model sees.
    code:
    - language: shell
      filename: commands.sh
      content: |
        dbt run --select revenue_by_location --defer --favor-state --state ./state-prod
      highlight_lines: []
  - id: expected
    title: Aggregate the selected parent
    explanation: |
      The production parent in this illustration has the second-day fixture.
    state:
      kind: comparison
      title: Aggregate the selected parent
      columns:
      - location
      - revenue_cents
      rows:
      - - Old Port
        - 3900
      - - Mile End
        - 5700
      - - Riverside
        - 4800
      result_status: null
      diagram: null
    takeaway: |
      The expected total is 14,400 cents because that parent contains both days.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
    - src-1
    - src-2
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
status: reviewed
review_scope: Source and fixture review; no historical dbt execution.
