walkthrough:
  id: wt-1.4
  learning_objective: |
    See how to choose which copy of a parent table a development build reads.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is second-day. Each state below is an authored illustration.
  dataset_variant: second-day
  steps:
    - id: copies
      title: Two copies of the same parent, one stale
      explanation: >-
        Highlighted lines 3 and 6 read the development and production copies of order_revenue. The panel shows
        the query’s two totals: 12,500 cents in development and 14,400 in production. The saved production
        manifest points to the two-day relation.
      state:
        kind: comparison
        title: Parent totals before the development build
        columns:
          - environment
          - total_cents
        rows:
          -   - development
              - 12500
          -   - production
              - 14400
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The dev copy of order_revenue exists, but it is a day behind production.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-1-4-0
      code:
        - language: sql
          filename: inspection/compare_parent_relations.sql
          content: |
            -- Fixture phase: dev.order_revenue uses base; prod.order_revenue uses second-day.
            select 'development' as environment, sum(revenue_cents) as total_cents
            from dev.order_revenue
            union all
            select 'production', sum(revenue_cents)
            from prod.order_revenue;
          highlight_lines:
            - 3
            - 6
          purpose: authored executable syntax; illustration only
      data_context:
        dataset_variant: second-day
        phase: dev.order_revenue uses base; prod.order_revenue uses second-day.
    - id: favor
      title: Build the child and tell dbt to prefer the production parent
      explanation: >
        The first file is the model to rebuild. Highlighted lines 3 to 5 sum payments, refunds and revenue
        per
        location. The second file is the command. It selects only this model. The defer and state flags ask
        dbt to borrow any unselected parent from the saved production state in the state-prod folder. The
        new
        flag, favor-state, says to use the production copy even though a dev copy exists. The result panel
        shows the resolution: the dev revenue-by-location model will read prod.order_revenue.
      state:
        kind: comparison
        title: Child reads the production parent
        columns:
          - selected child
          - resolved parent
        rows:
          -   - dev.revenue_by_location
              - prod.order_revenue
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        With --favor-state, the development build reads the production parent instead of the stale dev copy.
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: shell
          filename: commands.sh
          content: |
            dbt run --select revenue_by_location --defer --favor-state --state ./state-prod
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-1-4-0
    - id: expected
      title: The result reflects both days
      explanation: >
        Same model, highlighted at lines 3 to 5. Because it read the production parent, its output includes
        the second day of orders. The result panel shows revenue per location: Old Port 3,900, Mile End 5,700,
        Riverside 4,800. Had it read the dev copy, Old Port would be 3,400 and Mile End 4,300.
      state:
        kind: comparison
        title: Revenue by location from the two-day parent
        columns:
          - location
          - revenue_cents
        rows:
          -   - Old Port
              - 3900
          -   - Mile End
              - 5700
          -   - Riverside
              - 4800
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: >
        The total is 14,400 cents because the build read the two-day production parent, not the one-day dev
        copy.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-1-4-0
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
    - id: predicate
      title: Limit the existing rows considered by a merge
      explanation: Highlighted lines 3 and 4 add a condition on DBT_INTERNAL_DEST, dbt’s name for the
        existing target in a merge. A merge matches incoming orders to stored orders before updating or
        inserting. On Snowflake, the panel shows that date condition added to the order-id match. This
        fixture’s target dates all satisfy it, so the same two new orders still bring 12,500 to 14,400
        cents.
      state:
        kind: comparison
        title: Prepared Snowflake merge condition
        columns:
          - property
          - value
        rows:
          -   - match clause
              - DBT_INTERNAL_DEST.order_id = DBT_INTERNAL_SOURCE.order_id
          -   - added condition
              - DBT_INTERNAL_DEST.ordered_at >= '2016-03-08'
          -   - base target before new orders
              - 12,500 cents
          -   - target after second-day input
              - 14,400 cents
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: The merge gains a destination date condition without changing this fixture’s revenue
        result.
      code:
        - language: sql
          filename: models/order_revenue.sql (Snowflake merge example)
          content: |
            {{ config(materialized="incremental", unique_key="order_id",
                incremental_strategy="merge",
                incremental_predicates=[
                  "DBT_INTERNAL_DEST.ordered_at >= '2016-03-08'"
                ]) }}
            select *, payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: models/order_amounts.sql
          content: |
            with paid as (
                select order_id, sum(amount_cents) as payment_cents
                from raw.payments group by order_id
            ), refunded as (
                select order_id, sum(amount_cents) as refund_cents
                from raw.refunds group by order_id
            )
            select o.*, coalesce(p.payment_cents, 0) as payment_cents,
                coalesce(r.refund_cents, 0) as refund_cents
            from raw.orders as o
            left join paid as p on o.order_id = p.order_id
            left join refunded as r on o.order_id = r.order_id
          highlight_lines:
            - 2
            - 5
            - 8
            - 9
          purpose: Authored era-specific example; illustration only.
        - language: sql
          filename: inspection/merged_total.sql
          content: |
            select sum(revenue_cents) as total_cents
            from waffle.order_revenue
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt run --select order_revenue
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
        - alignment-1-4-0
      data_context:
        dataset_variant: second-day
        phase: 'Separate Snowflake merge illustration: existing target is base; current input has both days.'
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - alignment-1-4-0
    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
      The fixed 2016-03-08 predicate is chosen to cover every existing matching fixture row; current_date would be misleading for this historical dataset. No scan reduction is measured. Excluding existing keys while replaying them can create duplicates, so predicates are a correctness choice as well as a scan bound. The second-day variant is retained: orders-refreshed is its metadata-enriched child used for a different demo (src-1 and original merge macro).
      historical-1.4-02: Keep the existing-development precedence contrast, confirmed in 1.4 source. Evidence: src-1, src-2, src-3, alignment-1-4-0.
      historical-1.4-03: Keep distinct variant names: orders-refreshed extends second-day with freshness metadata, while this chapter needs only the rows. Evidence: src-1, src-2, src-3, alignment-1-4-0.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - >-
        When building one model in development, borrow its parents from production, and prefer production
        even
        if an old dev copy exists.
      - >-
        Limit how much of a big incremental table dbt scans when merging new rows, on warehouses that support
        it.
    scenario: >
      A developer wants to rebuild only the revenue-by-location model. Its parent, order_revenue, exists
      twice: an old copy in the dev schema with one day of orders, and the production copy with two days.
      Deferral is dbt's way of borrowing a parent from another environment instead of rebuilding it. Until
      now, dbt used the dev copy if one existed. The new --favor-state flag makes it prefer production.
    outcome: |-
      See production’s 14,400-cent result selected over stale development data, then the extra date condition in a Snowflake merge.
  title: |-
    Demo: choose the production parent and bound an incremental merge
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
default_milestone: 1.4.0
