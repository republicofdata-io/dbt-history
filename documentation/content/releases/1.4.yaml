id: '1.4'
label: v1.4
title: Fine-tuning incremental work
lead: >
  Deferral gains more explicit control over which existing relations to prefer. This helps avoid accidentally
  reading a stale development copy.
problem_then: >
  An unselected parent may exist in both development and saved production state. Existence alone does not
  tell
  a developer which copy they intended.
what_changed:
  - id: change-1
    summary: Incremental predicates and favor-state deferral.
    introduced_in: 1.4.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Buildable indirect test selection; richer structured logs and warning controls.
    introduced_in: 1.4.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
in_practice: |
  Use favor-state when the saved-state relation should win for eligible deferred references.
technical_detail: >
  --favor-state modifies deferral resolution; it does not force selected models to run in production.
  Incremental predicates and buildable indirect test selection are other additions.
