walkthrough:
  id: wt-0.16
  learning_objective: >
    Attach an owner to a model as descriptive information, and understand that this does not control who can
    query it.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: question
      title: A question the SQL cannot answer
      explanation: >
        Two files are shown. The SQL file, highlighted on lines 3 to 5, sums payments, refunds and revenue per
        location. The YAML file, highlighted on lines 1 to 4, describes the same model and opens a meta block.
        The result panel shows Old Port revenue of 3,400 cents, which is correct, next to the question nobody
        can answer from the SQL: who maintains this definition?
      state:
        kind: comparison
        title: Correct number, unanswered question
        columns:
          - model
          - revenue_cents
          - question
        rows:
          - - 'revenue_by_location: Old Port'
            - 3400
            - Who maintains this definition?
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        The SQL says how revenue is computed, but not who is responsible for the rule.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                meta:
                  owner: finance
                  unit: cents
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
    - id: meta
      title: Record the owner next to the model
      explanation: >
        The YAML file is shown, highlighted on lines 1 to 4. Below the meta line, lines 5 and 6 record two
        facts: the owner is the finance team, and the unit is cents. Any key and value can go here. The result
        panel shows the model with its owner and unit.
      state:
        kind: comparison
        title: Owner and unit recorded on the model
        columns:
          - model
          - owner
          - unit
        rows:
          - - revenue_by_location
            - finance
            - cents
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        The owner and the unit are now written next to the model and travel with it.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                meta:
                  owner: finance
                  unit: cents
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
      evidence:
        - src-1
        - src-2
        - src-3
    - id: boundary
      title: What the meta field does and does not do
      explanation: >
        The same SQL and YAML files are shown with the same highlights. The meta block is information for
        people and tools that read the project. It does not change the SQL, and it does not change who can
        query the table in the warehouse. The result panel spells this out: owner is informational,
        permissions are unchanged, and revenue is still 12,500 cents.
      state:
        kind: comparison
        title: What the metadata changes and what it leaves alone
        columns:
          - property
          - effect
        rows:
          - - 'owner: finance'
            - informational context
          - - warehouse permissions
            - not changed by this metadata
          - - base revenue
            - 12,500 cents
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        Writing owner: finance documents who is responsible. It does not grant or restrict access.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: sql
          filename: models/revenue_by_location.sql
          content: |
            select
                r.location_id, l.name as location,
                sum(r.payment_cents) as payment_cents,
                sum(r.refund_cents) as refund_cents,
                sum(r.revenue_cents) as revenue_cents
            from {{ ref("order_revenue") }} as r
            join raw.locations as l on r.location_id = l.location_id
            group by r.location_id, l.name
            order by r.location_id
          highlight_lines:
            - 3
            - 4
            - 5
          purpose: authored executable syntax; illustration only
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                meta:
                  owner: finance
                  unit: cents
          highlight_lines:
            - 1
            - 2
            - 3
            - 4
