      performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Add custom facts to a model in YAML, such as which team owns it or what unit its numbers are in.
      - Write descriptions for more kinds of project files, including macros, seeds and snapshots.
    scenario: >
      The finance team asks who maintains the revenue definition. The SQL and column types cannot answer that.
      Waffle Shop records the owner and the unit next to the model, so the answer travels with the code.
    outcome: >
      See the owner recorded as metadata, and see that it describes responsibility without changing warehouse
      permissions.
  title: |
    Demo: a meta field records that the finance team owns the revenue model
status: reviewed
