walkthrough:
  id: wt-0.16
  learning_objective: >
    Attach an owner to a model as descriptive information, and understand that this does not control who can
    query it.
  context: >
    Jaffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: question
      title: A question the SQL cannot answer
      explanation: |-
        Highlighted lines 3 and 4 of schema.yml name and describe the revenue model but give no owner. The panel places the prepared Old Port result, 3,400 cents, beside the unanswered question of who maintains its definition. The calculation exists; the ownership information is missing.
      state:
        kind: comparison
        title: Correct number, owner still unspecified
        columns:
          - model
          - location
          - revenue_cents
          - question
        rows:
          -   - 'revenue_by_location'
              - Old Port
              - 3400
              - Who maintains this definition?
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |
        The SQL says how revenue is computed, but not who is responsible for the rule.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                description: Payments minus refunds, in cents.
          highlight_lines:
            - 3
            - 4
          purpose: Authored era-specific example; illustration only.
    - id: meta
      title: Record the owner next to the model
      explanation: |-
        Highlighted lines 5 and 6 of the schema file add owner: finance and unit: cents inside meta, descriptive information that travels with a resource. The panel now shows the named owner and unit. These descriptions don't change database permissions.
      state:
        kind: comparison
        title: Owner and unit recorded on the model
        columns:
          - model
          - owner
          - unit
        rows:
          -   - revenue_by_location
              - finance
              - cents
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        The model records its owner and unit. That description does not grant warehouse access.
      code:
        - language: yaml
          filename: models/schema.yml
          content: |
            version: 2
            models:
              - name: revenue_by_location
                meta:
                  owner: finance
                  unit: cents
          highlight_lines:
            - 5
            - 6
          purpose: Authored era-specific example; illustration only.
      evidence:
        - src-1
        - src-2
        - src-3
    - id: boundary
      title: Describe the location seed as well
      explanation: |-
        Highlighted lines 2, 4 and 7 of seed_docs.yml describe the locations seed and its name column. The command generates documentation. The prepared panel shows the seed description and column description, extending the documentation beyond the model metadata on the previous screen.
      state:
        kind: comparison
        title: Prepared documentation entries
        columns:
          - resource
          - description
        rows:
          -   - 'seed locations'
              - The three Jaffle Shop locations.
          -   - locations.name
              - Name shown on revenue reports.
        result_status:
        diagram:
        provenance: Authored illustration; fixture-derived values or explicitly prepared workflow. Not a
          captured dbt run.
      takeaway: |-
        The documentation can describe the CSV seed and its columns, as well as models.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: yaml
          filename: models/seed_docs.yml
          content: |
            version: 2
            seeds:
              - name: locations
                description: The three Jaffle Shop locations.
                columns:
                  - name: name
                    description: Name shown on revenue reports.
          highlight_lines:
            - 2
            - 4
            - 7
          purpose: Authored era-specific example; illustration only.
        - language: shell
          filename: commands.sh
          content: |
            dbt docs generate
          highlight_lines:
            - 1
          purpose: Authored era-specific example; illustration only.
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Attach custom facts such as owner and unit to a model.
      - Add descriptions to seed resources and their columns.
    scenario: >-
      The revenue SQL gives the right number but no owner. Jaffle Shop records who maintains it and adds documentation
      for the location CSV used by reports.
    outcome: >-
      See the ownership gap filled and the seed description appear in a prepared documentation view.
  title: |-
    Demo: record the revenue owner and describe the location seed
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
