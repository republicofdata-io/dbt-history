  intro:
    can_now:
    - Attach custom metadata such as a model’s responsible team.
    - Document more resource types, including macros, seeds and snapshots.
    scenario: |
      A finance team needs to know who maintains the shop’s revenue definition. The model carries that context alongside its SQL.
    outcome: |
      See metadata describe responsibility without pretending to grant warehouse permissions.
