id: '0.16'
label: v0.16
title: Richer metadata
lead: >
  Custom metadata lets a project carry context such as who maintains a model. Documentation reaches more
  resource types.
problem_then: |
  A lineage graph can show what depends on a model without explaining who understands its business meaning.
what_changed:
  - id: change-1
    summary: meta and richer resource documentation.
    introduced_in: 0.16.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Documentation for macros, analyses, snapshots and seeds; source/column tags.
    introduced_in: 0.16.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
in_practice: |
  Attach team context to the resource alongside its technical definition.
technical_detail: >
  meta is project metadata; it does not itself create access control, approval workflows or a governance
  service. This example’s finance owner is fictional.
milestones:
  - id: 0.16.0
    kind: package
    date: '2020-03-23'
    precision: day
    title: First published package
    evidence:
      - src-2
sources:
