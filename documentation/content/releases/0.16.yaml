walkthrough:
  id: wt-0.16
  learning_objective: |
    Add ownership context without mistaking it for enforcement.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: question
    title: Find a question the schema cannot answer
    explanation: |
      Old Port revenue is correct, but someone must explain the refund rule.
    state:
      kind: comparison
      title: Find a question the schema cannot answer
      columns:
      - model
      - revenue_cents
      - question
      rows:
      - - 'revenue_by_location: Old Port'
        - 3400
        - Who maintains this definition?
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A data type is not business ownership.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: revenue_by_location
            meta:
              owner: finance
              unit: cents
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
  - id: meta
    title: Attach project context
    explanation: |
      The metadata names the responsible fictional team.
    state:
      kind: comparison
      title: Attach project context
      columns:
      - model
      - owner
      - unit
      rows:
      - - revenue_by_location
        - finance
        - cents
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Metadata can travel with the model.
    code:
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: revenue_by_location
            meta:
              owner: finance
              unit: cents
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
    evidence:
    - src-1
    - src-2
    - src-3
  - id: boundary
    title: Understand what metadata does
    explanation: |
      The same model retains its SQL and permissions.
    state:
      kind: comparison
      title: Understand what metadata does
      columns:
      - property
      - effect
      rows:
      - - 'owner: finance'
        - informational context
      - - warehouse permissions
        - not changed by this metadata
      - - base revenue
        - 12,500 cents
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      Documented ownership and enforced permissions are separate.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: models/revenue_by_location.sql
      content: |
        select
            r.location_id, l.name as location,
            sum(r.payment_cents) as payment_cents,
            sum(r.refund_cents) as refund_cents,
            sum(r.revenue_cents) as revenue_cents
        from {{ ref("order_revenue") }} as r
        join raw.locations as l on r.location_id = l.location_id
        group by r.location_id, l.name
        order by r.location_id
      highlight_lines:
      - 3
      - 4
      - 5
      purpose: authored executable syntax; illustration only
    - language: yaml
      filename: models/schema.yml
      content: |
        version: 2
        models:
          - name: revenue_by_location
            meta:
              owner: finance
              unit: cents
      highlight_lines:
      - 1
      - 2
      - 3
      - 4
