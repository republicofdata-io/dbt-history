    limitations: |
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were reviewed against the cited release evidence. Small-fixture values are independently checked; no measured performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
    - Define a SQL expression once in a macro and reuse it in models.
    - Rebuild an incremental model completely with full-refresh control.
    scenario: |
      Several reports subtract refunds from payments. Waffle Shop moves that repeated expression into a macro so the definition is easier to keep consistent.
    outcome: |
      See the macro definition, its call and the 1,000-cent net value of order 1042.
status: reviewed
