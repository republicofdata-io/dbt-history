id: '0.6'
label: v0.6
title: Reusable macros
lead: |
  Macros give repeated SQL a shared definition. The refund calculation can become a small reusable expression.
problem_then: |
  Copying a calculation into several models makes later corrections easy to miss.
what_changed:
  - id: change-1
    summary: Macros, full-refresh control for incrementals and target context.
    introduced_in: 0.6.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
  - id: change-2
    summary: Run-level hooks and additional runtime materialization controls.
    introduced_in: 0.6.0
    adapter_constraints:
    evidence:
      - src-1
    confidence: high
in_practice: |
  Change one macro, then compile the models that use it.
technical_detail: >
  Use a simple expression macro compatible with this era. Richer adapter/ref/var macro context belongs to
  later releases. Full-refresh is another change in this release; it rebuilds incremental tables when needed.
