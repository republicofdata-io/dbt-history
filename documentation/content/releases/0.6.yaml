walkthrough:
  id: wt-0.6
  learning_objective: |
    See how a macro produces SQL rather than storing data.
  context: |
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
  - id: repeat
    title: Spot the repeated rule
    explanation: |
      Order 1042 has a partial refund.
    state:
      kind: comparison
      title: Spot the repeated rule
      columns:
      - order_id
      - payment_cents
      - refund_cents
      - net_cents
      rows:
      - - 1042
        - 1200
        - 200
        - 1000
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      The same subtraction may appear in several models.
    evidence:
    - src-1
    - src-2
    - src-3
    code:
    - language: sql
      filename: analyses/order_1042.sql
      content: |
        select order_id, payment_cents, refund_cents,
            payment_cents - refund_cents as revenue_cents
        from {{ ref("order_amounts") }}
        where order_id = 1042
      highlight_lines:
      - 2
      - 4
      purpose: authored executable syntax; illustration only
  - id: macro
    title: Name the SQL expression
    explanation: |
      The macro accepts SQL expressions and emits subtraction.
    state:
      kind: comparison
      title: Name the SQL expression
      columns:
      - macro
      - input expressions
      - emitted expression
      rows:
      - - net_cents
        - payment_cents, refund_cents
        - (payment_cents - refund_cents)
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      A macro generates SQL; it is not a warehouse table.
    code:
    - language: jinja
      filename: macros/net_cents.sql
      content: |
        {% macro net_cents(payment, refund) %}
            ({{ payment }} - {{ refund }})
        {% endmacro %}
      highlight_lines:
      - 1
      - 2
      - 3
    evidence:
    - src-1
    - src-2
    - src-3
  - id: use
    title: Apply the shared definition
    explanation: |
      The input has already aggregated each payment and refund per order.
    state:
      kind: table
      title: 'Order 1042: partial refund'
      columns:
      - order_id
      - location
      - payment_cents
      - refund_cents
      - revenue_cents
      rows:
      - - 1042
        - Old Port
        - 1200
        - 200
        - 1000
      result_status: null
      diagram: null
      provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
    takeaway: |
      One definition preserves the 1,000-cent result.
    code:
    - language: sql
      filename: models/order_revenue.sql
      content: |
        select order_id, {{ net_cents("payment_cents", "refund_cents") }} as revenue_cents
        from {{ ref("order_amounts") }}
      highlight_lines:
      - 1
      - 2
    - language: jinja
      filename: macros/net_cents.sql
      content: |
        {% macro net_cents(payment, refund) %}
            ({{ payment }} - {{ refund }})
        {% endmacro %}
      highlight_lines:
      - 1
      - 2
      - 3
    evidence:
    - src-1
    - src-2
    - src-3
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
