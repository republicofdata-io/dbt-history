walkthrough:
  id: wt-0.6
  learning_objective: |
    See how a macro produces SQL text that models reuse, rather than storing data.
  context: >
    Waffle Shop has three locations. Base revenue is 12,500 cents: Old Port 3,400, Mile End 4,300 and
    Riverside 4,800. The selected fixture is base. Each state below is an authored illustration.
  dataset_variant: base
  steps:
    - id: repeat
      title: The same subtraction in every report
      explanation: >
        This query looks at one order. Highlighted line 2 is the rule that keeps getting retyped: payments
        minus refunds. Highlighted line 4 narrows the query to order 1042. The result panel shows that the
        order paid 1,200 cents and refunded 200, so its net is 1,000 cents.
      state:
        kind: comparison
        title: Order 1042, worked by hand
        columns:
          - order_id
          - payment_cents
          - refund_cents
          - net_cents
        rows:
          - - 1042
            - 1200
            - 200
            - 1000
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: >
        Payments minus refunds is typed out in several models, and each copy is a place a mistake could creep
        in.
      evidence:
        - src-1
        - src-2
        - src-3
      code:
        - language: sql
          filename: analyses/order_1042.sql
          content: |
            select order_id, payment_cents, refund_cents,
                payment_cents - refund_cents as revenue_cents
            from {{ ref("order_amounts") }}
            where order_id = 1042
          highlight_lines:
            - 2
            - 4
          purpose: authored executable syntax; illustration only
    - id: macro
      title: Give the expression a name
      explanation: >
        This file defines a macro. A macro is a small template: it takes inputs and produces text, here a
        piece of SQL. Highlighted lines 1 to 3 name it net_cents, take two inputs, and produce the subtraction
        in brackets. Nothing is stored in the database at this point. The result panel shows what goes in and
        what comes out.
      state:
        kind: comparison
        title: What the macro takes in and gives back
        columns:
          - macro
          - input expressions
          - emitted expression
        rows:
          - - net_cents
            - payment_cents, refund_cents
            - (payment_cents - refund_cents)
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        A macro produces SQL text; it is not a table and holds no data.
      code:
        - language: jinja
          filename: macros/net_cents.sql
          content: |
            {% macro net_cents(payment, refund) %}
                ({{ payment }} - {{ refund }})
            {% endmacro %}
          highlight_lines:
            - 1
            - 2
            - 3
      evidence:
        - src-1
        - src-2
        - src-3
    - id: use
      title: Call the macro from the revenue model
      explanation: >
        Highlighted line 1 of order_revenue calls net_cents with the two column names instead of typing the
        subtraction. Before the query runs, dbt replaces that call with the SQL from highlighted lines 1 to 3
        of the macro file. Highlighted line 2 reads from order_amounts, where payments and refunds are already
        totalled per order. The result panel shows order 1042 again: 1,000 cents net, the same as before.
      state:
        kind: table
        title: Order 1042 through the macro
        columns:
          - order_id
          - location
          - payment_cents
          - refund_cents
          - revenue_cents
        rows:
          - - 1042
            - Old Port
            - 1200
            - 200
            - 1000
        result_status: null
        diagram: null
        provenance: authored illustration; fixture-derived values or explicitly hypothetical workflow
      takeaway: |
        The model now uses the shared definition and gets the same 1,000-cent answer.
      code:
        - language: sql
          filename: models/order_revenue.sql
          content: |
            select order_id, {{ net_cents("payment_cents", "refund_cents") }} as revenue_cents
            from {{ ref("order_amounts") }}
          highlight_lines:
            - 1
            - 2
        - language: jinja
          filename: macros/net_cents.sql
          content: |
            {% macro net_cents(payment, refund) %}
                ({{ payment }} - {{ refund }})
            {% endmacro %}
          highlight_lines:
            - 1
            - 2
            - 3
      evidence:
        - src-1
        - src-2
        - src-3
  evidence:
    status: illustration
    review_date: '2026-09-22'
    source_refs:
      - src-1
      - src-2
      - src-3
      - src-4
    limitations: >
      Prepared teaching states, not executed on a historical dbt runtime. Feature and syntax choices were
      reviewed against the cited release evidence. Small-fixture values are independently checked; no measured
      performance claims.
    code_review:
      reviewed_on: '2026-09-22'
      historical_cutoff: '2026-09-21'
      method: Original source/archive and release documentation inspection; no historical dbt execution.
  intro:
    can_now:
      - Write a piece of SQL once as a macro, a small template, and drop it into any model.
      - Force an incremental model to rebuild from scratch with the full-refresh flag.
    scenario: >
      Several reports subtract refunds from payments. Each one types the subtraction by hand, so a change to
      the rule means editing them all. The shop moves the expression into one macro. Order 1042, paid 1,200
      cents and refunded 200, is the test case.
    outcome: |
      See the macro's definition, the line that calls it, and the same 1,000-cent net for order 1042.
  title: |
    Demo: a macro writes the payments-minus-refunds expression once and reuses it
status: reviewed
review_scope: Source and fixture review; no historical dbt engine execution.
default_milestone: 0.6.0
