chapter_changes:
  '0.1':
  - Matched SQL/result columns, showed generated table/view statements, supplied the ref parent and explicit diagram
    IDs.
  '0.2':
  - Kept and explained the source-correct parent-to-child declaration; schema opens first. Confirmed data/ seeds
    cannot be ref targets yet; changed the orphan inspection to direct warehouse SQL.
  '0.3':
  - Added order_amounts to the dependency picture and confirmed user.run-target in the original loader.
  '0.4':
  - Added a dedicated ephemeral step and kept one model chain and incremental config through all four steps.
  '0.5':
  - Replaced repetitive conversion screens with variables, a 0.5.1 archive, and a 0.5.4 custom reconciliation test;
    added explicit archive feed metadata to the existing variant.
  '0.6':
  - Aligned query columns and added a full-refresh step with incorrect stored values visibly corrected.
  '0.7':
  - Confirmed the named-profile target syntax and added an explicitly dated 0.7.1 role setting.
  '0.8':
  - Replaced the transaction label with a visible prepared schedule and added a 0.8.3 BigQuery profile using the
    historical schema key.
  '0.9':
  - Showed hand-written duplicated SQL before package use and kept the unconfigured order model in schema jaffle.
  '0.10':
  - Added packages.yml/local dependency step and joined seed names directly to order-level revenue.
  '0.11':
  - Highlighted the actual column description, made diagram IDs explicit and included the fields consumed by the
    location query.
  '0.12':
  - Kept identical tagged model SQL across all screens; removed the undemonstrated cache promise from the intro.
  '0.13':
  - Connected downstream revenue to the source-backed payments model; made the Redshift date arithmetic assumption
    explicit.
  '0.14':
  - Standardized snapshot SQL/highlights and added a working soft-rule warning over the base refund of 800 cents.
  '0.15':
  - Showed file-level parse reuse, the profile option and an explicitly authored JSON field example; verified global
    command-flag positions.
  '0.16':
  - Removed meta from the unanswered-question screen, highlighted its actual values, and replaced the boundary screen
    with seed documentation.
  '0.17':
  - Kept the same refund input on both sides of the repair, showed the fail-fast outcome, and used path selection
    to restore the numeric revenue result.
  '0.18':
  - Made the SQL edit visible, included order_amounts in the rebuilt branch, and listed every reused model parent
    with deferral preconditions.
  '0.19':
  - Kept the snapshot/highlights identical and qualified fixture dates, revival and test-deferral scope.
  '0.20':
  - Recorded the audit-schema assumption and narrowed the intro to the stored-failure behavior actually shown.
  '0.21':
  - Expanded the graph through both intermediate models to revenue_by_location and named that exact skipped table.
  '1.0':
  - Separated the schema filenames and kept the metric definition in the original 1.0 dialect.
  '1.1':
  - Restored the actual source-to-revenue graph and explained timestamp comparison independently of freshness thresholds.
  '1.2':
  - Rebuilt the three screens as denied read, declared/applied grant, and successful read; removed duplicate conflicting
    model files.
  '1.3':
  - Confirmed 12 base orders and the Snowflake/Snowpark assumption; aligned the input inspection table with its
    query.
  '1.4':
  - Showed 12,500 versus 14,400 directly and added a Snowflake incremental-predicate step with a safe fixed fixture
    boundary.
  '1.5':
  - Fixed contract highlights and result columns; added a complete two-version interface with dbt show and a preserved
    v1 consumer.
  '1.6':
  - Added missing model code and complete retry statuses, removed the unchanged-SQL requirement, and added a PostgreSQL
    materialized-view screen.
  '1.7':
  - Replaced the local dependency with a real Hub range, showed the prepared lock pin and independently verified
    request hash, and named static_index.html.
  '1.8':
  - Added --empty setup and unit-test commands, explained warehouse schema requirements, and aligned the upstream
    chain.
  '1.9':
  - Named Snowflake, clarified exclusive bounds and lookback, added a total query, and demonstrated a YAML snapshot
    with two dated rows.
  '1.10':
  - Added the historically qualified sampling screen, named the deprecation category and escalation command, and
    moved highlights to the duplicated key.
  '1.11':
  - Named Snowflake on screen, verified function() syntax and the nonempty dependency diagram, and supplied the
    location-level conversion query.
  '1.12':
  - Added vars.yml with its correct wrapper, showed explicit four-model selection comparisons, verified common parser
    flags, and removed the duplicate ad hoc query file.
  '2.0':
