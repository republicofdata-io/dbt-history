rendering_contract:
- id: version-order
  instruction: Use the chapters array, not lexical file sorting. Origin precedes 0.1; 0.9 precedes 0.10.
- id: anchor
  instruction: Resolve every tab from the selected milestone. Use default_milestone when supplied; otherwise the
    first milestone. v2 has exactly four milestones and opens on September 16 GA.
- id: steps
  instruction: Render complete prepared step states and preserve the illustration label. A shell block is read-only
    content, not an execution action.
- id: fixture
  instruction: Apply variants recursively through extends. Add extra_rows, then apply declared change_events. The
    base is immutable. Event-based deletion does not erase orders.
- id: external-products
  instruction: ecosystem/placements.yaml is a list. Register each product_definition as a product before resolving
    placements; definitions use the same fields as catalogue identities. Do not count the definition as an extra
    placement.
- id: half-open-intervals
  instruction: For exact dates, from is inclusive and to is exclusive. A chart interval ending can be editorial
    rotation, not retirement.
- id: date-precision
  instruction: Month/year values are uncertain intervals, not the first day. Show a qualified state while the anchor
    is within that interval. Never display an invented exact date.
- id: bounded-observations
  instruction: uncertainty and date_basis=observed-by preserve a bound. Do not silently treat the upper bound as
    the actual acquisition or rename day.
- id: catalogue-membership
  instruction: Apply catalogue_membership independently of product age and current owner. Fivetran-lineage identities
    enter the dbt catalogue from June 1, 2026. Pending acquisition records are not completed ownership.
- id: maturity
  instruction: Apply maturity by surface. A null maturity on an ordinary event leaves previous known maturity unchanged;
    explicit state_override replaces it. The June 2026 engine alpha has a null enum plus maturity_label=alpha. Never
    carry its earlier beta label over that explicit alpha observation.
- id: availability
  instruction: availability=announced-not-available means upcoming, not usable. availability_scope distinguishes
    public/private preview or beta. Planned November Native App retirement is not a completed event at cutoff.
- id: licensing
  instruction: Keep license separate from access and commercial_conditions. Full dbt and dbt OSS are separate distributions.
    The schema-limited pricing kind with event_subtype=licence-change denotes a licence event, not a price change.
- id: uncertainty-in-extra-fields
  instruction: Preserve and render qualifications in ownership/name intervals, known_since_basis, maturity_label,
    availability_scope and commercial_conditions. Validation that accepts but strips these fields is insufficient
    for publication.
- id: fixture-provenance
  instruction: All shop names, values and proposed errors are fictional teaching material, not historical claims.
    Source references substantiate dbt capabilities; independent fixture calculations substantiate the numbers.
open_checks:
- id: first-ref-patch
  status: qualified-in-content
  description: 0.1.1 lacks ref; 0.1.14 contains it. The exact first patch remains unknown, so introduced_in is null
    with known_present_in and introduction_uncertainty.
- id: run-operation
  status: qualified-in-content
  description: Present in inspected 0.13 source but announced in 0.14 release notes. No exact first-introduction
    claim is made.
- id: transform-close
  status: bounded-in-content
  description: February 8 agreement and acquisition confirmed by October 17, 2023; legal closing day not established.
- id: census
  status: bounded-in-content
  description: Completion lies between May 1 and September 3, 2025; Activations naming is observed by February 2,
    2026, not assigned a fabricated rename day.
- id: native-app
  status: known-by-observation
  description: Original launch remains unknown. The content starts its catalogue record at the July 24 maintenance
    notice and explicitly labels that as an observation.
- id: atlan
  status: qualified-in-content
  description: Conflicting 2019/2020 launch descriptions are not resolved silently; the chart uses the dated July
    2022 evidence.
- id: entitlements
  status: not-exhaustive
  description: Historical plan-specific entitlements are not exhaustively researched. Null access or licence is
    unknown, not free or open source.
- id: runtime
  status: not-executed
  description: Historical syntax is source-reviewed. No warehouse execution, measured performance or original terminal
    log is claimed. Only the Core 1.7 request-hash helper was executed in isolation.
authoring_corrections:
- id: snowflake-projects-date
  description: The cited native dbt Projects GA article is dated November 10, 2025; the skeleton’s June 2025 placement
