expected_revenue:
  columns:
  - location_id
  - location
  - payment_cents
  - refund_cents
  - revenue_cents
  rows:
  - - 1
    - Old Port
    - 4400
    - 1000
    - 3400
  - - 2
    - Mile End
    - 4600
    - 300
    - 4300
  - - 3
    - Riverside
    - 4800
    - 0
    - 4800
  total_cents: 12500
  arithmetic: |
    Old Port: 900 + (1200 - 200) + (600 + 900) + (800 - 800) = 3400.
    Mile End: 1800 + 1100 + (1000 - 300) + 700 = 4300.
    Riverside: 1300 + 900 + 1600 + 1000 = 4800.
    All locations: 13800 payments - 1300 refunds = 12500 cents.
derived_relations:
- name: payments_by_order
  definition: Group payments by order_id; sum amount_cents as payment_cents.
- name: refunds_by_order
  definition: Group refunds by order_id; sum amount_cents as refund_cents.
- name: order_amounts
  definition: 'One row per order: order_id, customer_id, location_id, ordered_at, payment_cents, refund_cents. Left
    join the two per-order aggregates; coalesce missing sums to zero.'
- name: order_revenue
  definition: All order_amounts fields plus revenue_cents = payment_cents - refund_cents.
- name: revenue_by_location
  definition: Sum order_revenue.revenue_cents by location_id; join locations for its name.
