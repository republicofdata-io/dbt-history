id: waffle-shop
title: One day at Waffle Shop
provenance:
  kind: authored-fiction
  authored_on: '2026-09-22'
  historical_claim: false
  note: Names, transactions and dates are invented teaching fixtures. Their arithmetic is checked independently.
recurring_question: How much revenue did each location earn, and can we trust the answer?
business_rules:
- id: revenue-definition
  statement: Revenue per order is payments minus refunds, in cents.
- id: attribution
  statement: Attribute revenue and refunds to the original order location and order trading day, in UTC.
- id: successful-events
  statement: Every base payment is a successful capture and every refund is successful. There are no tax, currency
    or cancellation adjustments.
- id: aggregate-before-join
  statement: Sum payments and refunds separately per order before joining them to orders. Missing refunds count
    as zero.
- id: immutable-base
  statement: Variants add named rows or change events without altering the base fixture. Apply only the selected
    variant and its declared parent.
